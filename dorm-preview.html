<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日方舟基建模块样式 - 精确复刻</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            gap: 30px;
        }

        .title {
            color: #8a8a9a;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 白色矩阵背景容器 */
        .card-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* 卡片主体 - 黑色背景 */
        .module-card {
            width: 400px;
            height: 88px;
            background: linear-gradient(90deg, #2a2a2e 0%, #141416 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 12px;
        }

        /* 顶部凹陷 - 角度更小，接近矩形 */
        .module-card .notch-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 6px;
            background: #ffffff;
            border-radius: 0 0 3px 3px;
            clip-path: polygon(0% 0%, 100% 0%, 97% 100%, 3% 100%);
            z-index: 5;
        }

        /* 底部凹陷 - 角度更小，接近矩形 */
        .module-card .notch-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 6px;
            background: #ffffff;
            border-radius: 3px 3px 0 0;
            clip-path: polygon(3% 0%, 97% 0%, 100% 100%, 0% 100%);
            z-index: 5;
        }

        /* 左侧凹陷 - 宽度减小，角度更小 */
        .module-card .notch-left {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 32px;
            background: #ffffff;
            border-radius: 0 2px 2px 0;
            clip-path: polygon(0% 0%, 0% 100%, 100% 94%, 100% 6%);
            z-index: 5;
        }

        /* 右侧凹陷 - 宽度减小，角度更小 */
        .module-card .notch-right {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 32px;
            background: #ffffff;
            border-radius: 2px 0 0 2px;
            clip-path: polygon(100% 0%, 100% 100%, 0% 94%, 0% 6%);
            z-index: 5;
        }

        /* 边框线条 */
        .module-card .border-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                #3a3a42 0%, 
                transparent 25%, 
                transparent 75%, 
                #3a3a42 100%
            );
            z-index: 2;
        }

        .module-card .border-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                #2a2a32 0%, 
                transparent 25%, 
                transparent 75%, 
                #2a2a32 100%
            );
            z-index: 2;
        }

        .module-card .border-left {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(180deg, 
                #3a3a42 0%, 
                #3a3a42 32%, 
                transparent 32%, 
                transparent 68%, 
                #3a3a42 68%, 
                #3a3a42 100%
            );
            z-index: 1;
        }

        .module-card .border-right {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(180deg, 
                #3a3a42 0%, 
                #3a3a42 32%, 
                transparent 32%, 
                transparent 68%, 
                #3a3a42 68%, 
                #3a3a42 100%
            );
            z-index: 1;
        }

        /* 点阵背景 */
        .module-card .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle, rgba(100,100,110,0.1) 1px, transparent 1px);
            background-size: 6px 6px;
            pointer-events: none;
        }

        /* 顶部高光 */
        .module-card .top-highlight {
            position: absolute;
            top: 1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(120,130,140,0.4) 30%, 
                rgba(120,130,140,0.5) 50%, 
                rgba(120,130,140,0.4) 70%, 
                transparent 100%
            );
            pointer-events: none;
        }

        /* 左侧图标区域 */
        .icon-section {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        /* 六边形图标容器 */
        .hex-icon {
            width: 52px;
            height: 52px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hex-frame {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 2px solid #3a3a42;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .hex-inner {
            width: 42px;
            height: 42px;
            background: rgba(30,30,36,0.9);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .beds-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .bed-row {
            display: flex;
            gap: 3px;
        }

        .bed-block {
            width: 5px;
            height: 5px;
            background: #6a7a8a;
            border-radius: 1px;
        }

        .bed-block.tall {
            height: 8px;
        }

        /* 文字区域 */
        .text-section {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .module-name {
            font-size: 16px;
            font-weight: 700;
            color: #d0d0d4;
            letter-spacing: 1px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .module-status {
            font-size: 12px;
            color: #7a7a8a;
            font-weight: 500;
        }

        /* 等级胶囊指示器 - 竖向六边形 */
        .level-indicators {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }

        .level-capsule {
            width: 7px;
            height: 16px;
            background: linear-gradient(180deg, #4a4a5a 0%, #3a3a4a 100%);
            border-top: 1px solid #6a6a7a;
            clip-path: polygon(50% 0%, 100% 20%, 100% 80%, 50% 100%, 0% 80%, 0% 20%);
        }

        .level-capsule.active {
            background: linear-gradient(180deg, #c0a040 0%, #a08030 100%);
            border-top-color: #d4b860;
            box-shadow: 0 0 6px rgba(192,160,64,0.4);
        }

        /* 右侧状态 */
        .status-section {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
        }

        .status-icon {
            width: 18px;
            height: 18px;
            border: 1px solid #3a3a42;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #7a7a8a;
            background: rgba(30,30,36,0.8);
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
            color: #c0a040;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        /* 变体展示 */
        .variants {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .variants-title {
            color: #6a6a7a;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        /* 小号卡片 */
        .card-container.small {
            padding: 16px;
        }

        .card-container.small .module-card {
            width: 320px;
            height: 72px;
        }

        .card-container.small .module-card .notch-top,
        .card-container.small .module-card .notch-bottom {
            width: 140px;
            height: 5px;
        }

        .card-container.small .module-card .notch-left,
        .card-container.small .module-card .notch-right {
            width: 3px;
            height: 26px;
        }

        .card-container.small .hex-icon {
            width: 44px;
            height: 44px;
        }

        .card-container.small .hex-frame {
            width: 40px;
            height: 40px;
        }

        .card-container.small .hex-inner {
            width: 34px;
            height: 34px;
        }

        .card-container.small .bed-block {
            width: 4px;
            height: 4px;
        }

        .card-container.small .bed-block.tall {
            height: 6px;
        }

        .card-container.small .module-name {
            font-size: 14px;
        }

        .card-container.small .module-status {
            font-size: 11px;
        }

        .card-container.small .level-capsule {
            width: 5px;
            height: 14px;
        }

        .card-container.small .status-text {
            font-size: 14px;
        }

        /* 蓝色主题 */
        .card-container.blue .module-card {
            background: linear-gradient(90deg, #2a3a4e 0%, #142436 100%);
        }

        .card-container.blue .level-capsule.active {
            background: linear-gradient(180deg, #60a0c0 0%, #4080a0 100%);
            border-top-color: #80c0e0;
        }

        .card-container.blue .status-text {
            color: #60a0c0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght400;700&family=Noto+Sans+SC:wght400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <h2 class="title">基建模块样式 - 精确复刻</h2>

    <!-- 主卡片 -->
    <div class="card-container">
        <div class="module-card">
            <div class="grid-bg"></div>
            <div class="top-highlight"></div>
            <div class="border-top"></div>
            <div class="border-bottom"></div>
            <div class="border-left"></div>
            <div class="border-right"></div>
            
            <!-- 凹陷效果 - 露出白色背景 -->
            <div class="notch-top"></div>
            <div class="notch-bottom"></div>
            <div class="notch-left"></div>
            <div class="notch-right"></div>
            
            <div class="icon-section">
                <div class="hex-icon">
                    <div class="hex-frame"></div>
                    <div class="hex-inner">
                        <div class="beds-icon">
                            <div class="bed-row">
                                <div class="bed-block tall"></div>
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                            </div>
                            <div class="bed-row">
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                                <div class="bed-block"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-section">
                    <div class="title-area">
                        <div class="module-name">宿舍</div>
                        <div class="module-status">休息中</div>
                    </div>
                    <div class="level-indicators">
                        <div class="level-capsule active"></div>
                        <div class="level-capsule active"></div>
                        <div class="level-capsule active"></div>
                        <div class="level-capsule active"></div>
                        <div class="level-capsule active"></div>
                    </div>
                </div>
            </div>
            
            <div class="status-section">
                <div class="status-icon">i</div>
                <div class="status-text">5/5</div>
            </div>
        </div>
    </div>

    <!-- 变体 -->
    <div class="variants">
        <div class="variants-title">尺寸与主题变体</div>
        
        <!-- 小号卡片 -->
        <div class="card-container small">
            <div class="module-card">
                <div class="grid-bg"></div>
                <div class="top-highlight"></div>
                <div class="border-top"></div>
                <div class="border-bottom"></div>
                <div class="border-left"></div>
                <div class="border-right"></div>
                <div class="notch-top"></div>
                <div class="notch-bottom"></div>
                <div class="notch-left"></div>
                <div class="notch-right"></div>
                
                <div class="icon-section">
                    <div class="hex-icon">
                        <div class="hex-frame"></div>
                        <div class="hex-inner">
                            <div class="beds-icon">
                                <div class="bed-row">
                                    <div class="bed-block tall"></div>
                                    <div class="bed-block"></div>
                                    <div class="bed-block"></div>
                                    <div class="bed-block"></div>
                                    <div class="bed-block"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-section">
                        <div class="title-area">
                            <div class="module-name">宿舍</div>
                        </div>
                        <div class="level-indicators">
                            <div class="level-capsule active"></div>
                            <div class="level-capsule active"></div>
                            <div class="level-capsule"></div>
                            <div class="level-capsule"></div>
                            <div class="level-capsule"></div>
                        </div>
                    </div>
                </div>
                <div class="status-section">
                    <div class="status-icon">i</div>
                    <div class="status-text">2/5</div>
                </div>
            </div>
        </div>

        <!-- 蓝色主题 -->
        <div class="card-container small blue">
            <div class="module-card">
                <div class="grid-bg"></div>
                <div class="top-highlight"></div>
                <div class="border-top"></div>
                <div class="border-bottom"></div>
                <div class="border-left"></div>
                <div class="border-right"></div>
                <div class="notch-top"></div>
                <div class="notch-bottom"></div>
                <div class="notch-left"></div>
                <div class="notch-right"></div>
                
                <div class="icon-section">
                    <div class="hex-icon">
                        <div class="hex-frame"></div>
                        <div class="hex-inner">
                            <span style="font-size: 16px; color: #60a0c0;">⚙️</span>
                        </div>
                    </div>
                    <div class="text-section">
                        <div class="title-area">
                            <div class="module-name">制造站</div>
                        </div>
                        <div class="level-indicators">
                            <div class="level-capsule active"></div>
                            <div class="level-capsule active"></div>
                            <div class="level-capsule active"></div>
                            <div class="level-capsule"></div>
                            <div class="level-capsule"></div>
                        </div>
                    </div>
                </div>
                <div class="status-section">
                    <div class="status-icon">⚡</div>
                    <div class="status-text">3/5</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
