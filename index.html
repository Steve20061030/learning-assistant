<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习助手 - 知识图谱</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        :root {
            --bg-primary: #0a0e18;
            --bg-secondary: #111a28;
            --bg-card: rgba(30, 40, 60, 0.7);
            --text-primary: #e0f0ff;
            --text-secondary: #a0c0e0;
            --text-muted: #6080a0;
            --accent-cyan: #40c0e0;
            --accent-teal: #80e0c0;
            --accent-purple: #a080e0;
            --level-1: #60c0a0;
            --level-2: #60c0f0;
            --level-3: #a080e0;
            --level-4: #e08060;
            --level-5: #e060a0;
            --border-subtle: rgba(80, 120, 180, 0.3);
            --shadow-glow: 0 0 30px rgba(64, 192, 224, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #0d1321 100%);
            color: var(--text-primary);
            font-family: 'Noto Sans SC', 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.8;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 100, 180, 0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(100, 140, 200, 0.06), transparent 45%),
                repeating-linear-gradient(0deg, rgba(0, 60, 120, 0.02) 0, rgba(0, 60, 120, 0.02) 1px, transparent 1px, transparent 6px);
            pointer-events: none;
            z-index: 0;
        }

        ::selection {
            background: rgba(64, 192, 224, 0.3);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(10, 20, 40, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--accent-teal), var(--accent-cyan));
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            padding: 80px 20px 50px;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-teal), var(--accent-purple), transparent);
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { opacity: 0.5; width: 60%; }
            50% { opacity: 1; width: 80%; }
        }

        .header-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(64, 192, 224, 0.1);
            border: 1px solid rgba(64, 192, 224, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 {
            font-size: 64px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal), var(--accent-purple), var(--accent-cyan));
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            text-shadow: 0 0 60px rgba(64, 192, 224, 0.3);
            letter-spacing: 6px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        header p {
            color: var(--text-secondary);
            font-size: 20px;
            letter-spacing: 3px;
            font-weight: 300;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .header-stat { text-align: center; }

        .header-stat-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            color: var(--accent-cyan);
        }

        .header-stat-label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .knowledge-graph {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .graph-title {
            font-size: 24px;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .graph-title-icon {
            font-size: 28px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(60, 100, 160, 0.15);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .legend-item:hover {
            background: rgba(60, 100, 160, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(64, 192, 224, 0.2);
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
            transition: all 0.3s;
        }

        .legend-item:hover .legend-dot {
            transform: scale(1.2);
            box-shadow: 0 0 15px currentColor;
        }

        .legend-dot.level-1 { background: var(--level-1); color: var(--level-1); }
        .legend-dot.level-2 { background: var(--level-2); color: var(--level-2); }
        .legend-dot.level-3 { background: var(--level-3); color: var(--level-3); }
        .legend-dot.level-4 { background: var(--level-4); color: var(--level-4); }
        .legend-dot.level-5 { background: var(--level-5); color: var(--level-5); }

        .graph-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            justify-items: center;
        }

        .graph-node {
            padding: 20px 26px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            text-align: center;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            min-width: 130px;
            animation: fadeIn 0.5s ease-out backwards;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .graph-node::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s;
        }

        .graph-node:hover::before { left: 100%; }

        .graph-node:hover {
            transform: translateY(-10px) scale(1.05);
            z-index: 10;
        }

        .graph-node.level-1 {
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.25), rgba(96, 192, 160, 0.1));
            color: var(--level-1);
            border-color: rgba(96, 192, 160, 0.5);
        }
        .graph-node.level-1:hover { box-shadow: 0 15px 40px rgba(96, 192, 160, 0.3); border-color: var(--level-1); }

        .graph-node.level-2 {
            background: linear-gradient(135deg, rgba(96, 192, 240, 0.25), rgba(96, 192, 240, 0.1));
            color: var(--level-2);
            border-color: rgba(96, 192, 240, 0.5);
        }
        .graph-node.level-2:hover { box-shadow: 0 15px 40px rgba(96, 192, 240, 0.3); border-color: var(--level-2); }

        .graph-node.level-3 {
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.25), rgba(160, 128, 224, 0.1));
            color: var(--level-3);
            border-color: rgba(160, 128, 224, 0.5);
        }
        .graph-node.level-3:hover { box-shadow: 0 15px 40px rgba(160, 128, 224, 0.3); border-color: var(--level-3); }

        .graph-node.level-4 {
            background: linear-gradient(135deg, rgba(224, 128, 96, 0.25), rgba(224, 128, 96, 0.1));
            color: var(--level-4);
            border-color: rgba(224, 128, 96, 0.5);
        }
        .graph-node.level-4:hover { box-shadow: 0 15px 40px rgba(224, 128, 96, 0.3); border-color: var(--level-4); }

        .graph-node.level-5 {
            background: linear-gradient(135deg, rgba(224, 96, 160, 0.25), rgba(224, 96, 160, 0.1));
            color: var(--level-5);
            border-color: rgba(224, 96, 160, 0.5);
        }
        .graph-node.level-5:hover { box-shadow: 0 15px 40px rgba(224, 96, 160, 0.3); border-color: var(--level-5); }

        .node-level {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .node-name { font-weight: 600; position: relative; z-index: 1; }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .category-tag {
            padding: 10px 20px;
            background: rgba(60, 100, 160, 0.15);
            border-radius: 25px;
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .category-tag:hover, .category-tag.active {
            background: rgba(64, 192, 224, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(64, 192, 224, 0.2);
        }

        .course-section {
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease-out 1s both;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .section-icon { font-size: 28px; }

        .section-title {
            font-size: 26px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .course-card {
            background: linear-gradient(135deg, rgba(25, 35, 55, 0.9), rgba(15, 25, 40, 0.95));
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out backwards;
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal));
            transform: scaleX(0);
            transition: transform 0.4s;
        }

        .course-card:hover::before { transform: scaleX(1); }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(64, 192, 224, 0.15);
            border-color: rgba(100, 160, 220, 0.5);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .course-title {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .course-icon { font-size: 32px; opacity: 0.8; }

        .course-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .course-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .course-topic {
            font-size: 12px;
            padding: 5px 12px;
            background: rgba(60, 100, 160, 0.2);
            border-radius: 12px;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .course-card:hover .course-topic { background: rgba(60, 100, 160, 0.3); }

        .course-meta {
            display: flex;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid rgba(80, 120, 180, 0.2);
        }

        .course-meta-item {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease-out 1.2s both;
        }

        @media(max-width: 1100px) {
            .main-content { grid-template-columns: 1fr; }
            .header-stats { gap: 20px; }
            header h1 { font-size: 48px; }
        }

        .panel-box {
            background: linear-gradient(135deg, rgba(25, 35, 55, 0.9), rgba(15, 25, 40, 0.95));
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .panel-box:hover { box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4); }

        .panel-head {
            padding: 16px 20px;
            background: linear-gradient(90deg, rgba(40, 80, 140, 0.3), rgba(30, 60, 100, 0.1));
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-icon-box {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(120, 160, 220, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--accent-cyan);
            border-radius: 8px;
            background: rgba(64, 192, 224, 0.1);
        }

        .panel-name {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .panel-body { padding: 20px; }

        #contentDetail { min-height: 400px; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }

        .empty-text { font-size: 16px; }

        .content-card {
            background: linear-gradient(135deg, rgba(40, 55, 80, 0.5), rgba(25, 35, 55, 0.4));
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            animation: fadeIn 0.5s ease-out;
        }

        .content-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 22px;
            color: var(--accent-cyan);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .card-title-level {
            font-size: 11px;
            padding: 4px 10px;
            background: rgba(64, 192, 224, 0.2);
            border-radius: 12px;
            color: var(--accent-cyan);
            font-weight: 500;
        }

        .card-content {
            color: var(--text-secondary);
            line-height: 1.9;
            font-size: 15px;
        }

        .card-content p { margin-bottom: 14px; }
        .card-content p:last-child { margin-bottom: 0; }

        .intuition-box {
            background: linear-gradient(135deg, rgba(64, 140, 200, 0.15), rgba(64, 140, 200, 0.05));
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            border-left: 4px solid var(--accent-cyan);
        }

        .intuition-box strong { color: var(--accent-cyan); font-weight: 600; }

        .formula-box {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(20, 30, 50, 0.4));
            padding: 24px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-cyan);
            font-family: 'Consolas', 'Monaco', 'Microsoft YaHei', monospace;
            font-size: 16px;
            color: #c0e0f0;
            white-space: pre-wrap;
            line-height: 2;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-top: 16px;
            overflow-x: auto;
        }

        .related-section { margin-top: 20px; }

        .related-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .related-topics { display: flex; flex-wrap: wrap; gap: 10px; }

        .related-tag {
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.2), rgba(140, 100, 200, 0.1));
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent-purple);
            border: 1px solid rgba(160, 128, 224, 0.3);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .related-tag:hover {
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.35), rgba(140, 100, 200, 0.25));
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(160, 128, 224, 0.3);
        }

        .scenario-tag {
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.2), rgba(96, 192, 160, 0.1));
            border-radius: 16px;
            font-size: 13px;
            color: var(--level-1);
            border: 1px solid rgba(96, 192, 160, 0.3);
            transition: all 0.3s;
        }

        .scenario-tag:hover {
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.3), rgba(96, 192, 160, 0.15));
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(64, 192, 224, 0.15);
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(64, 192, 224, 0.3);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: 'Orbitron', monospace;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .try-section {
            background: linear-gradient(135deg, rgba(64, 140, 200, 0.12), rgba(64, 140, 200, 0.04));
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid var(--accent-cyan);
        }

        .try-title {
            font-size: 15px;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .try-list { list-style: none; padding: 0; }

        .try-item {
            padding: 8px 0;
            color: var(--text-secondary);
            font-size: 14px;
            padding-left: 20px;
            position: relative;
        }

        .try-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
        }

        .analysis-toggle-btn {
            margin-top: 16px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(100, 200, 140, 0.2), rgba(80, 180, 120, 0.1));
            border: 1px solid rgba(100, 200, 140, 0.4);
            border-radius: 10px;
            color: #80e0a0;
            font-size: 14px;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer;

                    { question: '尝试用自己的话解释相关概念', answer: 'AI发展就像一场马拉松，目前我们已经跑过了机器学习、深度学习两个里程碑，正在向通用人工智能(AGI)迈进。每个阶段都有新的技术突破，但也面临新的挑战。理解发展历程能帮助我们更好地把握未来方向。' }
                ],
                '智能简史': [
                    { question: '总结本节内容的核心要点', answer: 'AI发展简史的核心脉络：1）1950s-1960s：符号主义兴起，图灵测试提出，专家系统诞生；2）1980s-1990s：机器学习复苏，神经网络遇冷；3）2006年后：深度学习突破，ImageNet竞赛改变格局；4）2017年后：Transformer架构一统天下，大模型时代开启；5）未来：AGI成为终极目标。' },
                    { question: '思考该知识在实际中的应用场景', answer: '了解AI历史的意义：1）避免重复造轮子，很多问题历史上已有解决方案；2）理解技术局限性，每个方法都有其适用边界；3）把握发展趋势，在正确的方向上投入；4）培养科研思维，学习从问题到解决方案的演进过程。' },
                    { question: '尝试用自己的话解释相关概念', answer: 'AI发展就像人类探索未知世界：先是符号主义的"理性派"，试图用规则描述一切；后来是连接主义的"经验派"，让机器从数据中学习；现在两者融合，走向更通用的智能。理解这段历史，能帮助我们理解当前各种AI技术的起源和演进。' }

                '机器学习': [
                    { question: '总结本节内容的核心要点', answer: '机器学习的三大范式：1）监督学习：有标签数据，学习输入到输出的映射（如分类、回归）；2）无监督学习：无标签，发现数据内在结构（如聚类、降维）；3）强化学习：通过与环境交互学习最优策略。核心思想是从数据中自动提取模式和规律，而非人工编写规则。' },
                    { question: '思考该知识在实际中的应用场景', answer: '机器学习的应用领域：1）电商推荐：根据用户行为预测喜好；2）金融风控：信用评分、欺诈检测；3）医疗诊断：影像分析、疾病预测；4）自然语言处理：机器翻译、情感分析；5）计算机视觉：人脸识别、目标检测。每个领域都有独特的ML pipeline。' },
                    { question: '尝试用自己的话解释相关概念', answer: '机器学习可以类比为"照镜子学穿衣"：监督学习就像有老师指导的穿搭课（有正确答案）；无监督学习就像自己观察时尚杂志找出搭配规律（无答案）；强化学习就像不断尝试不同穿搭根据他人反馈调整（试错学习）。' }

                'DNN深度网络': [
                    { question: '总结本节内容的核心要点', answer: '深度神经网络的核心要素：1）层次结构：多层神经元逐层提取特征；2）非线性变换：激活函数（如ReLU）引入非线性；3）反向传播：通过梯度下降优化网络参数；4）表示学习：自动学习数据的多层次表示。深度网络的核心优势是能从原始数据中自动学习有用的特征表示。' },
                    { question: '思考该知识在实际中的应用场景', answer: 'DNN的典型应用：1）语音识别：声学模型使用深度 RNN/Transformer；2）推荐系统：深度学习模型捕捉用户复杂偏好；3）自然语言理解：BERT等预训练模型微调；4）搜索排序：深度语义匹配模型。深度网络的优势在于处理非结构化数据（图像、文本、语音）。' },
                    { question: '尝试用自己的话解释相关概念', answer: 'DNN的工作原理可以想象成层层过滤：就像我们识别一只猫，眼睛→轮廓→纹理→整体，一层比一层抽象。每一层神经元都在对信息进行加工和提炼，最终得到高层语义表示。这就是"深度"的意义——多层次的理解。' }

                '卷积神经网络': [

                    { question: '思考该知识在实际中的应用场景', answer: 'CNN的广泛应用：1）图像分类：ResNet、EfficientNet等 backbone；2）目标检测：YOLO、Faster R-CNN；3）语义分割：U-Net、DeepLab；4）人脸识别：FaceNet、ArcFace；5）医学影像：CT/MRI分析。CNN是计算机视觉的基础架构。' },
                    { question: '尝试用自己的话解释相关概念', answer: 'CNN就像用不同滤镜检查图片：第一个滤镜专门找边缘，第二个找纹理，第三个找形状...每过一层，信息的"语义层次"就提升一点。就像专家鉴定一幅画，先看笔触（低层），再看风格（中层），最后判断真伪（高层）。' }

            data_struct: {
                'C++基础': [
                    { question: '总结本节内容的核心要点', answer: 'C++基础的核心要点：1）指针与引用：理解内存地址和间接访问；2）类和对象：面向对象编程的封装、继承、多态；3）STL容器：vector、list、map等标准库的使用；4）内存管理：new/delete、RAII原则。这些是学习数据结构和算法的编程基础。' },
                    { question: '思考该知识在实际中的应用场景', answer: 'C++在实际工程中的应用：1）系统编程：操作系统、游戏引擎；2）高频交易：低延迟系统；3）嵌入式开发：资源受限环境；4）科学计算：性能关键应用。C++的零成本抽象让你既能写高层代码，又能控制底层细节。' },
                    { question: '尝试用自己的话解释相关概念', answer: 'C++的指针就像房间的门牌号，通过它你可以找到任何数据。引用则是房间的另一个名字。指针可以改变指向（换房间），引用一旦绑定就不能改变（固定房间）。理解这个比喻，就能理解C++的内存操作。' }
                ],
                '栈与队列': [
                    { question: '总结本节内容的核心要点', answer: '栈和队列的核心特点：1）栈（LIFO）：后进先出，只允许在一端操作，如叠盘子；2）队列（FIFO）：先进先出，一端入另一端出，如排队买票；3）实现方式：可以用数组或链表；4）时间复杂度：入栈/出栈、入队/出队都是O(1)。这两种是基础但重要的数据结构。' },
                    { question: '思考该知识在实际中的应用场景', answer: '栈的应用：函数调用栈、表达式求值、括号匹配、撤销操作、历史记录。队列的应用：任务调度、广度优先搜索、消息队列、打印机队列。理解这些应用能帮助你选择合适的数据结构解决实际问题。' },
                    { question: '尝试用自己的话解释相关概念', answer: '栈就像邮箱，只从上面放取信件——最后放进去的最先被取出。队列就像排队买奶茶——先来的人先拿到。记住"栈是倒过来的队列"这个口诀，就能区分它们的特性。' }
                ],
                '链表': [
                    { question: '总结本节内容的核心要点', answer: '链表的核心特点：1）节点结构：数据+指针；2）动态性：不需要连续内存，容量可变；3）操作特点：插入/删除O(1)，但访问需要O(n)；4）类型：单链表、双链表、循环链表。链表的优势在于频繁的插入删除操作。' },
                    { question: '思考该知识在实际中的应用场景', answer: '链表的应用：1）操作系统的内存管理；2）浏览器的历史记录（前进/后退）；3）音乐播放器的播放列表；4）LRU缓存实现；5）哈希表的链地址法解决冲突。链表是理解更复杂数据结构的基础。' },
                    { question: '尝试用自己的话解释相关概念', answer: '链表就像寻宝游戏：每个线索卡片告诉你下一个宝藏在哪里，直到找到最后一个（NULL）。不像数组的连续房间，链表可以分散在各处，但只能按顺序找。这种"跳跃式"存储让插入删除很快，但随机访问很慢。' }
                ],
                '树与图': [

                    { question: '思考该知识在实际中的应用场景', answer: '树的应用：1）文件系统目录结构；2）XML/HTML的DOM树；3）数据库索引（B+树）；4）表达式树；5）霍夫曼编码。图的應用：1）社交网络关系；2）地图导航；3）任务调度；4）电路网络。' },
                    { question: '尝试用自己的话解释相关概念', answer: '树就像家族族谱：每个人只有一个父亲（根节点除外），但可能有多个孩子。二叉树是严格的计划生育，每对父母最多两个孩子。图则像城市交通图，道路可以双向、多条连接，更复杂但也更真实。' }
                ],
                '查找与排序': [
                    { question: '总结本节内容的核心要点', answer: '排序算法：1）O(n²)：冒泡、选择、插入排序，简单但慢；2）O(n log n)：快速、归并、堆排序，常用高效算法；3）O(n)：计数、桶、基数排序，适合特殊数据。查找算法：1）顺序查找O(n)；2）二分查找O(log n)，但需要有序。' },
                    { question: '思考该知识在实际中的应用场景', answer: '排序的应用：1）数据库 ORDER BY；2）文件整理；3）排行榜；4）数据预处理。查找的应用：1）字典查找；2）数据库索引查询；3）编译器符号表；4）拼写检查。排序和查找是计算机科学最基础的问题。' },
                    { question: '尝试用自己的话解释相关概念', answer: '排序就像整理书架：冒泡排序是相邻两本比较交换，像相邻气泡冒上去；快速排序是选一本书当"中间人"分区；归并排序是先分小组整理再合并。查找就像在字典里找词，二分查找每次排除一半。' }
                ],
                '哈希表': [
                    { question: '总结本节内容的核心要点', answer: '哈希表的核心原理：1）哈希函数：将键转换为数组索引；2）冲突处理：链地址法（链表）、开放地址法；3）负载因子：存储数量/槽位，影响性能；4）复杂度：理想情况下查找、插入、删除都是O(1)。哈希表是效率极高的键值存储结构。' },
                    { question: '思考该知识在实际中的应用场景', answer: '哈希表的应用：1）缓存系统（Redis等）；2）去重检测；3）字符串查找（Rabin-Karp）；4）编译器符号表；5）区块链的默克尔树。几乎所有需要快速键值查询的场景都离不开哈希表。' },
                    { question: '尝试用自己的话解释相关概念', answer: '哈希表就像图书管理员的编码系统：每本书根据书名的某种规则被分配到特定书架。同一规则可能让不同书分配到同一位置（冲突），这时就需要排队或开辟新区域。好的哈希函数让分配更均匀，查找更快。' }
                ]

            discrete_math: {
                '命题逻辑': [
                    { question: '总结本节内容的核心要点', answer: '命题逻辑的核心概念：1）命题：具有真假值的陈述句；2）联结词：∧（且）、∨（或）、¬（非）、→（蕴含）、↔（等价）；3）真值表：描述命题间关系；4）等价式：德摩根律、双重否定律等；5）推理规则：肯定前件、否定后件。这是数理逻辑的基础。' },
                    { question: '思考该知识在实际中的应用场景', answer: '命题逻辑的应用：1）数字电路设计：逻辑门实现命题运算；2）程序语言中的布尔表达式；3）数据库查询的AND/OR/NOT；4）AI中的命题推理；5）数学证明的基础。命题逻辑让我们能够精确表达和推理命题关系。' },
                    { question: '尝试用自己的话解释相关概念', answer: '命题逻辑就像搭积木：每个命题是一个积木块（真或假），联结词是胶水，把积木粘成不同形状。"A→B"意味着如果A成立，B就必须成立。这就像"如果明天下雨，地面就会湿"这样的因果关系。' }

                '集合与关系': [
                    { question: '总结本节内容的核心要点', answer: '集合论的核心概念：1）集合：确定对象的无序聚集；2）运算：∪（并）、∩（交）、−（差）、′（补）；3）关系：集合笛卡尔积的子集；4）特殊关系：等价关系（自反、对称、传递）、偏序关系。集合论是现代数学的基础语言。' },
                    { question: '思考该知识在实际中的应用场景', answer: '集合论的应用：1）数据库：关系代数基于集合操作；2）社交网络：好友关系是集合；3）搜索引擎：文档与查询的匹配；4）机器学习：样本空间、特征空间；5）程序设计：集合类型、过滤操作。' },
                    { question: '尝试用自己的话解释相关概念', answer: '集合就像一个袋子，里面装着一类东西。并集是两个袋子东西合一起，交集是共同拥有的，差集是减去共有的。关系则是描述袋子里的东西之间如何"配对"，比如"同班同学"就是学生集合上的一个关系。' }

                '图论': [
                    { question: '总结本节内容的核心要点', answer: '图论的核心概念：1）图：顶点集+边集；2）路径、回路、连通性；3）特殊图：树（无回路连通图）、二分图、平面图；4）算法：最短路径、最小生成树、欧拉回路；5）应用：网络流、匹配问题。图论是离散数学的重要分支。' },
                    { question: '思考该知识在实际中的应用场景', answer: '图论的应用：1）社交网络分析：朋友关系、六度分隔；2）导航系统：最短路径算法；3）任务调度：拓扑排序；4）电路设计：网络流；5）生物信息学：蛋白质交互网络。图论提供了一种强大的建模工具。' },
                    { question: '尝试用自己的话解释相关概念', answer: '图就像城市地图：每个地点是顶点，道路是边。两地之间的路线就是路径，能绕一圈回到原点的叫回路。树是连接所有点但没有环路的特殊图，就像一棵倒置的树，树枝不会形成圈。' }

                '树': [
                    { question: '总结本节内容的核心要点', answer: '树结构的核心特性：1）树的定义：n个结点，n-1条边，连通无回路；2）二叉树：每个结点最多两个子节点；3）遍历：深度优先（前/中/后序）、广度优先（层序）；4）BST：左小右大的二叉搜索树；5）树的存储：顺序存储、链式存储。' },
                    { question: '思考该知识在实际中的应用场景', answer: '树的应用：1）文件系统：目录结构；2）XML/HTML解析：DOM树；3）数据库索引：B+树；4）编译器：语法树；5）游戏AI：决策树。层次化的数据结构天然适合表示包含关系和顺序关系的信息。' },
                    { question: '尝试用自己的话解释相关概念', answer: '树就像族谱：最上面是祖先（根），下面是后代。族谱的每一代就是一层，同一个人下面的两个孩子就是左子树和右子树。从根到某个人的路径长度就是树的深度，所有叶子中最长的路径长度就是树的高度。' }

                    { question: '思考该知识在实际中的应用场景', answer: '组合数学的应用：1）概率计算：骰子、扑克概率；2）算法复杂度分析：计数操作次数；3）密码学：密钥空间大小；4）数据库：查询结果计数；5）软件开发：测试用例数量估算。组合数学是量化分析的基础工具。' },
                    { question: '尝试用自己的话解释相关概念', answer: '组合数学就像计算开密码锁的可能组合数。排列考虑顺序（密码的位数有顺序），组合不考虑顺序（选哪些数字）。乘法原理是分步完成一件事（每步方法相乘），加法原理是分类完成一件事（每类方法相加）。' }
                ]

        function initGraph() {
            const container = document.getElementById('graphContainer');
            knowledgeNodes.forEach((node, index) => {
                const el = document.createElement('div');
                el.className = `graph-node level-${node.level}`;
                el.innerHTML = `<div class="node-level">Lv${node.level}</div><div class="node-name">${node.name}</div>`;
                el.style.animationDelay = `${index * 30}ms`;
                el.style.cursor = 'pointer';
                el.onclick = () => openDetailPage(node.name);
                container.appendChild(el);
            });
        }

        function initCourses() {
            const container = document.getElementById('courseGrid');
            courseData.forEach((course, index) => {
                const el = document.createElement('div');
                el.className = 'course-card';
                el.style.animationDelay = `${index * 100}ms`;
                el.innerHTML = `
                    <div class="course-header">
                        <div class="course-title">${course.title}</div>
                        <div class="course-icon">${course.icon}</div>
                    </div>
                    <div class="course-desc">${course.desc}</div>
                    <div class="course-topics">
                        ${course.topics.slice(0, 4).map(t => `<span class="course-topic">${t}</span>`).join('')}
                        ${course.topics.length > 4 ? `<span class="course-topic">+${course.topics.length - 4}</span>` : ''}
                    </div>
                    <div class="course-meta">
                        <span class="course-meta-item">📑 ${course.topics.length} 章节</span>
                    </div>`;
                el.onclick = () => showCourseDetail(course);
                container.appendChild(el);
            });
        }

        function filterNodes(category, element) {
            document.querySelectorAll('.category-tag').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');
            else document.querySelector(`.category-tag:nth-child(1)`).classList.add('active');
            const nodes = document.querySelectorAll('.graph-node');
            nodes.forEach((node, i) => {
                const data = knowledgeNodes[i];
                if (category === 'all' || data.category === category) {
                    node.style.display = 'block';
                    node.style.animation = 'fadeIn 0.5s ease-out forwards';
                } else { node.style.display = 'none'; }
            });
        }

        function showNodeDetail(node) {
            const detail = topicDetails[node.name] || {

                related: [],

                stats: { accuracy: 85, complexity: '中', usage: '广泛' }
            };

            document.getElementById('contentDetail').innerHTML = `
                <div class="content-card">
                    <div class="card-title">
                        <span class="card-title-level">Lv${detail.level}</span>
                        <span>${node.name}</span>
                    </div>
                    <div class="card-content">
                        <p><strong style="color:var(--accent-cyan);">📖 定义：</strong>${detail.definition}</p>
                    </div>
                    <div class="intuition-box"><strong>💡 直观理解：</strong>${detail.intuition}</div>
                    ${detail.formula ? `<div class="formula-box">${detail.formula}</div>` : ''}

                    ${detail.history ? `<div style="margin-top:16px;padding:16px;background:rgba(160,128,224,0.1);border-radius:12px;border-left:4px solid var(--accent-purple);">
                        <div style="font-size:14px;color:var(--accent-purple);margin-bottom:8px;font-weight:600;">📜 历史渊源</div>
                        <div style="font-size:14px;color:var(--text-secondary);line-height:1.7;">${detail.history}</div>
                    </div>` : ''}
                    <div style="margin-top:18px;">
                        <div class="related-label">📌 应用场景</div>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;">${detail.scenarios.map(s => `<span class="scenario-tag">${s}</span>`).join('')}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-value" style="color:var(--level-1);">${detail.stats.accuracy}%</div><div class="stat-label">准确率</div></div>

                    </div>
                    ${detail.related && detail.related.length > 0 ? `
                    <div class="related-section">
                        <div class="related-label">🔗 相关主题</div>
                        <div class="related-topics">${detail.related.map(r => `<span class="related-tag" onclick="showNodeDetail({name:'${r}',level:${getRelatedLevel(r)},category:'${getRelatedCategory(r)}',desc:'',year:''})">${r}</span>`).join('')}</div>
                    </div>` : ''}
                    ${detail.limitations ? `
                    <div class="try-section">
                        <div class="try-title">⚠️ 局限性</div>
                        <ul class="try-list">${detail.limitations.map(l => `<li class="try-item">${l}</li>`).join('')}</ul>
                    </div>` : ''}
                    <div style="margin-top:20px;text-align:center;">
                        <button class="btn btn-main" onclick="openDetailPage('${node.name}')" style="padding:14px 30px;">
                            🚀 查看完整详情
                        </button>
                    </div>
                </div>`;
        }

        function showCourseDetail(course) {
            document.getElementById('contentDetail').innerHTML = `
                <div class="content-card">
                    <div class="card-title"><span>${course.icon}</span><span>${course.title}</span></div>
                    <div class="card-content"><p>${course.desc}</p></div>
                    <div style="margin-top:18px;">
                        <div class="related-label">📋 课程章节</div>
                        <div class="related-topics">${course.topics.map(t => `<span class="related-tag" onclick="showTopicContent('${course.id}', '${t}')">${t}</span>`).join('')}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-value" style="color:var(--accent-cyan);">${course.topics.length}</div><div class="stat-label">章节数</div></div>
                    </div>
                </div>`;
        }

        function toggleAnalysis() {
            const btn = document.querySelector('.analysis-toggle-btn');
            const content = document.querySelector('.analysis-content');
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                btn.classList.remove('active');

                btn.classList.add('active');

        let notes = [];
        function showNoteModal() { document.getElementById('noteTitle').value = ''; document.getElementById('noteBody').value = ''; document.getElementById('noteModal').style.display = 'flex'; }
        function closeNoteModal() { document.getElementById('noteModal').style.display = 'none'; }
        function saveNote() {
            const title = document.getElementById('noteTitle').value; const body = document.getElementById('noteBody').value;
            if (!title.trim()) { alert('请输入笔记标题'); return; }
            notes.push({ id: Date.now(), title, body, time: new Date().toLocaleString() });
            closeNoteModal(); renderNotes(); updateNotesCount();
        }
        function renderNotes() {
            const container = document.getElementById('notesList');
            if (notes.length === 0) { container.innerHTML = '<div class="empty-state" style="padding:30px 0;"><p class="empty-text" style="font-size:13px;">暂无笔记</p></div>'; return; }
            container.innerHTML = notes.map(n => `<div class="note-item"><div class="note-title">${n.title}</div><div class="note-content">${n.body || '无内容'}</div><div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${n.time}</div></div>`).join('');
        }
        function filterNotes() {
            const keyword = document.getElementById('notesSearch').value.toLowerCase();
            const container = document.getElementById('notesList');
            const filtered = notes.filter(n => n.title.toLowerCase().includes(keyword) || n.body.toLowerCase().includes(keyword));
            if (filtered.length === 0) { container.innerHTML = '<div class="empty-state" style="padding:30px 0;"><p class="empty-text" style="font-size:13px;">未找到匹配的笔记</p></div>'; return; }
            container.innerHTML = filtered.map(n => `<div class="note-item"><div class="note-title">${n.title}</div><div class="note-content">${n.body || '无内容'}</div><div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${n.time}</div></div>`).join('');
        }
        function updateNotesCount() { document.getElementById('notesCount').textContent = `${notes.length} 篇`; }
        function sendAIMessage() {
            const input = document.getElementById('aiInput'); const msg = input.value.trim();
            if (!msg) return;
            const messages = document.getElementById('aiMessages');
            messages.innerHTML += `<div class="ai-message ai-message-user"><strong>你：</strong>${msg}</div>`;
            input.value = ''; messages.scrollTop = messages.scrollHeight;
            setTimeout(() => {
                const replies = ['这是一个很好的问题！让我为你详细解答...', '我来帮你分析这个概念。首先，我们需要理解...', '这个知识点确实很重要，让我从基础开始讲起...', '好的，我来为你解释一下这个问题的关键点...', '这个问题涉及到多个方面，让我逐一为你说明...'];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                messages.innerHTML += `<div class="ai-message ai-message-bot"><strong>🤖 AI助手：</strong>${reply}</div>`;
                messages.scrollTop = messages.scrollHeight;
            }, 800);
        }
        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        document.addEventListener('DOMContentLoaded', () => { initGraph(); initCourses(); renderNotes(); });
