<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #d0e0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        header { 
            text-align: center; 
            padding: 60px 20px 30px;
            position: relative;
            z-index: 1;
        }
        header h1 {
            font-size: 52px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0, #40c0e0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        header p { color: #80a0c0; font-size: 18px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            background: rgba(30, 40, 60, 0.7);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(80, 120, 180, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(64, 192, 224, 0.5);
            box-shadow: 0 15px 40px rgba(64, 192, 224, 0.15);
        }
        .stat-icon { font-size: 32px; margin-bottom: 10px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #40c0e0; }
        .stat-label { font-size: 13px; color: #80a0c0; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .tab {
            padding: 10px 24px;
            background: rgba(60, 100, 160, 0.3);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            border: 1px solid transparent;
        }
        .tab:hover { background: rgba(80, 140, 200, 0.4); }
        .tab.active { 
            background: linear-gradient(135deg, rgba(64, 192, 224, 0.4), rgba(128, 224, 192, 0.3));
            border-color: rgba(64, 192, 224, 0.5);
        }

        .knowledge-graph {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            position: relative;
            z-index: 1;
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { font-size: 20px; color: #a0c0e0; }
        .legend { display: flex; gap: 15px; flex-wrap: wrap; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
        .legend-dot.level-1 { background: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; }
        .legend-dot.level-3 { background: #a080e0; }
        .legend-dot.level-4 { background: #e08060; }
        .legend-dot.level-5 { background: #e060a0; }

        .graph-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            justify-items: center;
        }
        .graph-node {
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-align: center;
            border: 2px solid transparent;
        }
        .graph-node:hover { transform: translateY(-5px); }
        .graph-node.level-1 { background: rgba(96, 192, 160, 0.3); color: #60c0a0; border-color: rgba(96, 192, 160, 0.5); }
        .graph-node.level-2 { background: rgba(96, 192, 240, 0.3); color: #60c0f0; border-color: rgba(96, 192, 240, 0.5); }
        .graph-node.level-3 { background: rgba(160, 128, 224, 0.3); color: #a080e0; border-color: rgba(160, 128, 224, 0.5); }
        .graph-node.level-4 { background: rgba(224, 128, 96, 0.3); color: #e08060; border-color: rgba(224, 128, 96, 0.5); }
        .graph-node.level-5 { background: rgba(224, 96, 160, 0.3); color: #e060a0; border-color: rgba(224, 96, 160, 0.5); }

        .courses-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .course-card {
            background: rgba(30, 40, 60, 0.7);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }
        .course-card:hover {
            transform: translateY(-5px);
            border-color: rgba(64, 192, 224, 0.5);
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .course-name { font-size: 20px; font-weight: 600; color: #d0e0f0; }
        .course-difficulty {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .course-difficulty.easy { background: rgba(100, 180, 140, 0.3); color: #60c0a0; }
        .course-difficulty.medium { background: rgba(100, 160, 220, 0.3); color: #60c0f0; }
        .course-difficulty.hard { background: rgba(220, 140, 100, 0.3); color: #e08060; }
        .course-progress {
            margin-top: 15px;
            height: 6px;
            background: rgba(60, 80, 120, 0.5);
            border-radius: 3px;
            overflow: hidden;
        }
        .course-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #40c0e0, #80e0c0);
        }

        .visualization-section {
            display: none;
            background: rgba(30, 40, 60, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            position: relative;
            z-index: 1;
        }
        .viz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .viz-title { font-size: 18px; color: #a0c0e0; }
        .viz-controls { display: flex; gap: 10px; }
        .viz-btn {
            padding: 8px 16px;
            background: rgba(60, 100, 160, 0.4);
            border: none;
            border-radius: 8px;
            color: #a0c0e0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }
        .viz-btn:hover { background: rgba(64, 192, 224, 0.4); }
        .viz-btn.active { background: rgba(64, 192, 224, 0.6); }

        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
        }
        .chart-title { font-size: 14px; color: #80a0c0; margin-bottom: 15px; }

        .bar-chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 150px;
            padding: 10px;
        }
        .bar {
            width: 30px;
            background: linear-gradient(180deg, #40c0e0, #80e0c0);
            border-radius: 4px 4px 0 0;
            position: relative;
            cursor: pointer;
        }
        .bar:hover {
            background: linear-gradient(180deg, #60c0f0, #80e0c0);
        }
        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #80a0c0;
        }
        .bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #40c0e0;
            font-weight: bold;
        }

        .exercise-section {
            display: none;
            background: linear-gradient(135deg, rgba(60, 180, 140, 0.15), rgba(60, 140, 180, 0.15));
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(60, 180, 140, 0.3);
            position: relative;
            z-index: 1;
        }
        .exercise-title { font-size: 22px; color: #80e0c0; margin-bottom: 10px; }
        .exercise-desc { color: #80a0c0; font-size: 15px; margin-bottom: 20px; }
        .exercise-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #40c0e0, #80e0c0);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .exercise-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(64, 192, 224, 0.5);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: linear-gradient(135deg, #1a1f35, #0f1623);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(80, 120, 180, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h3 { font-size: 24px; color: #d0e0f0; }
        .close-btn {
            font-size: 28px;
            cursor: pointer;
            color: #80a0c0;
            transition: all 0.3s;
        }
        .close-btn:hover { color: #fff; }

        .content-card {
            background: rgba(60, 80, 120, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .card-title {
            font-size: 16px;
            color: #80c0f0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-content {
            color: #a0c0e0;
            line-height: 1.7;
            font-size: 14px;
        }

        .slider-section { margin-top: 20px; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .slider-value {
            color: #40c0e0;
            font-weight: bold;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(60, 100, 160, 0.5);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #40c0e0, #80e0c0);
            border-radius: 50%;
            cursor: pointer;
        }

        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .related-tag {
            padding: 6px 16px;
            background: rgba(180, 140, 220, 0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #a080e0;
            border: 1px solid rgba(180, 140, 220, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .related-tag:hover { 
            background: rgba(180, 140, 220, 0.3);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #6080a0;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .chart-container { grid-template-columns: 1fr; }
            header h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 个性化学习助手</h1>
            <p>基于学习风格的自适应学习平台</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card" onclick="showTab('knowledge')">
                <div class="stat-icon">📊</div>
                <div class="stat-value">25</div>
                <div class="stat-label">知识点</div>
            </div>
            <div class="stat-card" onclick="showTab('courses')">
                <div class="stat-icon">📚</div>
                <div class="stat-value">5</div>
                <div class="stat-label">课程</div>
            </div>
            <div class="stat-card" onclick="showTab('visualization')">
                <div class="stat-icon">📈</div>
                <div class="stat-value">96%</div>
                <div class="stat-label">学习进度</div>
            </div>
            <div class="stat-card" onclick="showTab('exercises')">
                <div class="stat-icon">✏️</div>
                <div class="stat-value">125</div>
                <div class="stat-label">练习题</div>
            </div>
        </div>

        <div class="tabs">
            <span class="tab active" onclick="showTab('knowledge')">📊 知识图谱</span>
            <span class="tab" onclick="showTab('courses')">📚 课程中心</span>
            <span class="tab" onclick="showTab('visualization')">📈 学习统计</span>
            <span class="tab" onclick="showTab('exercises')">✏️ 练习题册</span>
        </div>

        <div id="knowledge" class="knowledge-graph">
            <div class="graph-header">
                <div class="graph-title">📊 知识体系图谱</div>
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot level-1"></span> 基础</span>
                    <span class="legend-item"><span class="legend-dot level-2"></span> 进阶</span>
                    <span class="legend-item"><span class="legend-dot level-3"></span> 高级</span>
                    <span class="legend-item"><span class="legend-dot level-4"></span> 深度学习</span>
                    <span class="legend-item"><span class="legend-dot level-5"></span> 专家级</span>
                </div>
            </div>
            <div class="graph-container" id="graphNodes"></div>
        </div>

        <div id="courses" class="courses-grid"></div>

        <div id="visualization" class="visualization-section">
            <div class="viz-header">
                <div class="viz-title">📈 学习数据分析</div>
                <div class="viz-controls">
                    <button class="viz-btn active" onclick="updateCharts('week')">本周</button>
                    <button class="viz-btn" onclick="updateCharts('month')">本月</button>
                    <button class="viz-btn" onclick="updateCharts('year')">本年</button>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-box">
                    <div class="chart-title">📊 每日学习时长（分钟）</div>
                    <div class="bar-chart" id="learningBarChart"></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">📈 学习进度趋势</div>
                    <svg viewBox="0 0 300 150" style="width: 100%;">
                        <line x1="0" y1="37" x2="300" y2="37" stroke="rgba(100,140,180,0.2)" stroke-dasharray="4 4"/>
                        <line x1="0" y1="75" x2="300" y2="75" stroke="rgba(100,140,180,0.2)" stroke-dasharray="4 4"/>
                        <line x1="0" y1="112" x2="300" y2="112" stroke="rgba(100,140,180,0.2)" stroke-dasharray="4 4"/>
                        <path d="M0,105 Q75,90 150,75 T300,45 L300,150 L0,150 Z" fill="url(#grad1)" opacity="0.3"/>
                        <path d="M0,105 Q75,90 150,75 T300,45" fill="none" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="0" cy="105" r="5" fill="#40c0e0" stroke="white" stroke-width="2"/>
                        <circle cx="75" cy="90" r="5" fill="#40c0e0" stroke="white" stroke-width="2"/>
                        <circle cx="150" cy="75" r="5" fill="#40c0e0" stroke="white" stroke-width="2"/>
                        <circle cx="225" cy="60" r="5" fill="#40c0e0" stroke="white" stroke-width="2"/>
                        <circle cx="300" cy="45" r="5" fill="#40c0e0" stroke="white" stroke-width="2"/>
                        <defs>
                            <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#40c0e0"/>
                                <stop offset="100%" stop-color="#40c0e0" stop-opacity="0"/>
                            </linearGradient>
                            <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#40c0e0"/>
                                <stop offset="100%" stop-color="#80e0c0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">🎯 技能掌握度雷达图</div>
                <svg viewBox="0 0 400 400" style="width: 100%; max-width: 400px; margin: 0 auto;">
                    <polygon points="200,50 350,125 350,275 200,350 50,275 50,125" fill="none" stroke="rgba(100,140,180,0.2)" stroke-width="1"/>
                    <polygon points="200,100 300,150 300,250 200,300 100,250 100,150" fill="none" stroke="rgba(100,140,180,0.3)" stroke-width="1"/>
                    <polygon points="200,150 250,175 250,225 200,250 150,225 150,175" fill="none" stroke="rgba(100,140,180,0.4)" stroke-width="1"/>
                    <polygon points="200,80 320,130 310,250 200,300 90,250 80,130" fill="rgba(64,192,224,0.3)" stroke="#40c0e0" stroke-width="2"/>
                    <circle cx="200" cy="80" r="6" fill="#40c0e0"/>
                    <circle cx="320" cy="130" r="6" fill="#40c0e0"/>
                    <circle cx="310" cy="250" r="6" fill="#40c0e0"/>
                    <circle cx="200" cy="300" r="6" fill="#40c0e0"/>
                    <circle cx="90" cy="250" r="6" fill="#40c0e0"/>
                    <circle cx="80" cy="130" r="6" fill="#40c0e0"/>
                    <text x="200" y="40" fill="#80a0c0" font-size="12" text-anchor="middle">数学基础</text>
                    <text x="370" y="150" fill="#80a0c0" font-size="12" text-anchor="middle">编程能力</text>
                    <text x="350" y="300" fill="#80a0c0" font-size="12" text-anchor="middle">算法设计</text>
                    <text x="200" y="370" fill="#80a0c0" font-size="12" text-anchor="middle">系统架构</text>
                    <text x="30" y="300" fill="#80a0c0" font-size="12" text-anchor="middle">数据处理</text>
                    <text x="30" y="150" fill="#80a0c0" font-size="12" text-anchor="middle">机器学习</text>
                </svg>
            </div>
        </div>

        <div id="exercises" class="exercise-section">
            <div class="exercise-title">✏️ 精选练习题册</div>
            <div class="exercise-desc">涵盖5门核心课程的125道精选题目，包含详细解析和个性化学习建议</div>
            <button class="exercise-btn" onclick="openExerciseBook()">📚 开始练习</button>
        </div>

        <div class="modal-overlay" id="topicModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modalTitle">知识点详情</h3>
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                </div>
                <div id="modalContent" style="padding-top: 10px;"></div>
            </div>
        </div>

        <footer>
            <p>个性化学习助手 | 基于学习风格的自适应学习平台</p>
        </footer>
    </div>

    <script>
        const knowledgeNodes = [
            { name: '线性回归', level: 1, category: 'ai', desc: '最基础的回归算法' },
            { name: '逻辑回归', level: 1, category: 'ai', desc: '二分类算法' },
            { name: 'KNN', level: 1, category: 'ai', desc: 'K近邻算法' },
            { name: '机器学习基础', level: 2, category: 'ai', desc: '监督/无监督/强化学习' },
            { name: '决策树', level: 2, category: 'ai', desc: '树形分类模型' },
            { name: '神经网络', level: 3, category: 'ai', desc: '多层神经网络模型' },
            { name: 'SVM', level: 3, category: 'ai', desc: '支持向量机' },
            { name: '随机森林', level: 3, category: 'ai', desc: '集成学习算法' },
            { name: '深度学习', level: 4, category: 'ai', desc: '深层网络架构' },
            { name: '卷积神经网络', level: 4, category: 'ai', desc: 'CNN原理与应用' },
            { name: '栈和队列', level: 1, category: 'ds', desc: '线性数据结构' },
            { name: '链表', level: 1, category: 'ds', desc: '链式存储结构' },
            { name: '树结构', level: 2, category: 'ds', desc: '层次化数据结构' },
            { name: '排序算法', level: 2, category: 'ds', desc: '快速/归并排序' },
            { name: '查找算法', level: 2, category: 'ds', desc: '二分/哈希查找' },
            { name: '图算法', level: 3, category: 'ds', desc: '图的遍历与路径' },
            { name: '集合论', level: 1, category: 'math', desc: '集合运算与关系' },
            { name: '命题逻辑', level: 1, category: 'math', desc: '命题与真值表' },
            { name: '谓词逻辑', level: 2, category: 'math', desc: '量词与推理' },
            { name: '图论', level: 2, category: 'math', desc: '图的基本概念' },
            { name: '信息表示', level: 1, category: 'sys', desc: '二进制与编码' },
            { name: '浮点数', level: 2, category: 'sys', desc: 'IEEE 754标准' },
            { name: '动态规划', level: 3, category: 'algo', desc: '最优子结构' },
            { name: '贪心算法', level: 3, category: 'algo', desc: '局部最优选择' },
            { name: '复杂度分析', level: 2, category: 'algo', desc: '时间/空间复杂度' }
        ];

        const courses = [
            { id: 'ai', name: '人工智能数学思维', difficulty: 'medium', progress: 85, topics: ['线性回归', '机器学习基础', '神经网络'] },
            { id: 'ds', name: '数据结构与算法', difficulty: 'hard', progress: 72, topics: ['栈和队列', '链表', '树结构'] },
            { id: 'math', name: '离散数学', difficulty: 'easy', progress: 96, topics: ['集合论', '图论', '命题逻辑'] },
            { id: 'sys', name: '计算机系统', difficulty: 'medium', progress: 68, topics: ['信息表示', '浮点数'] },
            { id: 'algo', name: '算法设计与分析', difficulty: 'hard', progress: 55, topics: ['动态规划', '贪心算法'] }
        ];

        const topicDetails = {
            '线性回归': {
                level: 1,
                definition: '线性回归是最基础的机器学习算法之一。它的目标是找到一条最佳直线（或超平面），用来描述因变量和自变量之间的线性关系。',
                intuition: '想象你在散点图中画一条线，让所有点到这条线的距离平方和最小。这条线就是最佳拟合线。',
                formula: 'ŷ = wx + b',
                loss: 'J(w,b) = (1/n)Σ(yᵢ - ŷᵢ)²',
                scenarios: ['房价预测', '销量预测', '成绩预测'],
                related: ['逻辑回归', 'SVM'],
                hasVisualization: true,
                stats: { accuracy: 92, complexity: 'O(n)', usage: '广泛' }
            },
            '逻辑回归': {
                level: 1,
                definition: '逻辑回归是一种用于二分类问题的监督学习算法，输出概率值表示样本属于某一类的可能性。',
                intuition: '在线性回归的基础上，使用sigmoid函数将输出映射到0-1之间，表示概率。',
                formula: 'σ(z) = 1 / (1 + e^(-z))',
                loss: '交叉熵损失',
                scenarios: ['垃圾邮件检测', '疾病诊断', '信用评分'],
                related: ['线性回归', '神经网络'],
                hasVisualization: true,
                stats: { accuracy: 88, complexity: 'O(n)', usage: '广泛' }
            },
            'KNN': {
                level: 1,
                definition: 'K近邻算法是一种简单的监督学习算法，通过找到最近的K个邻居来进行分类或回归。',
                intuition: '物以类聚，人以群分。一个样本的类别由它周围最近的邻居决定。',
                formula: '距离 = √Σ(xᵢ - yᵢ)²',
                scenarios: ['推荐系统', '图像分类', '异常检测'],
                related: ['决策树', '聚类算法'],
                hasVisualization: false,
                stats: { accuracy: 85, complexity: 'O(n)', usage: '中等' }
            },
            '机器学习基础': {
                level: 2,
                definition: '机器学习是人工智能的一个分支，它使计算机能够从数据中学习模式，而无需显式编程。',
                intuition: '让计算机像人类一样从经验中学习，通过大量数据训练模型来做出预测或决策。',
                scenarios: ['图像识别', '自然语言处理', '推荐系统'],
                related: ['神经网络', '深度学习'],
                hasVisualization: false,
                stats: { accuracy: '-', complexity: '-', usage: '核心' }
            },
            '决策树': {
                level: 2,
                definition: '决策树是一种树形结构的分类模型，通过递归划分特征空间来进行决策。',
                intuition: '就像玩20问游戏，每次根据一个特征进行提问，逐步缩小范围直到得到答案。',
                formula: '信息增益 = 熵(父节点) - Σ权重×熵(子节点)',
                scenarios: ['信用评分', '医疗诊断', '客户流失预测'],
                related: ['随机森林', 'XGBoost'],
                hasVisualization: false,
                stats: { accuracy: 82, complexity: 'O(n log n)', usage: '广泛' }
            },
            '神经网络': {
                level: 3,
                definition: '神经网络是由大量人工神经元相互连接组成的计算模型，模拟生物神经网络的结构和功能。',
                intuition: '就像大脑中的神经元网络，每个神经元接收输入，进行简单计算，然后传递给下一层。',
                formula: 'a = σ(z), z = Σ(wᵢxᵢ) + b',
                loss: '交叉熵损失',
                scenarios: ['图像识别', '语音识别', '机器翻译'],
                related: ['深度学习', 'CNN'],
                hasVisualization: true,
                stats: { accuracy: 96, complexity: 'O(n)', usage: '核心' }
            }
        };

        function renderKnowledgeGraph() {
            const container = document.getElementById('graphNodes');
            container.innerHTML = knowledgeNodes.map(node => `
                <div class="graph-node level-${node.level}" onclick="showTopicDetail('${node.name}')">
                    ${node.name}
                </div>
            `).join('');
        }

        function renderCourses() {
            const container = document.getElementById('courses');
            container.innerHTML = courses.map(course => `
                <div class="course-card">
                    <div class="course-header">
                        <span class="course-name">${course.name}</span>
                        <span class="course-difficulty ${course.difficulty}">${course.difficulty === 'easy' ? '简单' : course.difficulty === 'medium' ? '中等' : '困难'}</span>
                    </div>
                    <div style="color:#80a0c0;font-size:13px;margin-bottom:10px;">已完成 ${course.progress}%</div>
                    <div class="course-progress">
                        <div class="course-progress-bar" style="width: ${course.progress}%;"></div>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;">
                        ${course.topics.map(t => `<span style="padding:4px 12px;background:rgba(60,80,120,0.6);border-radius:12px;font-size:12px;color:#a0c0e0;">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('knowledge').style.display = tabName === 'knowledge' ? 'block' : 'none';
            document.getElementById('courses').style.display = tabName === 'courses' ? 'grid' : 'none';
            document.getElementById('visualization').style.display = tabName === 'visualization' ? 'block' : 'none';
            document.getElementById('exercises').style.display = tabName === 'exercises' ? 'block' : 'none';
        }

        function showTopicDetail(topicName) {
            const detail = topicDetails[topicName];
            if (!detail) {
                alert(`暂无${topicName}的详细内容`);
                return;
            }
            
            const levelColors = ['', '#60c0a0', '#60c0f0', '#a080e0', '#e08060', '#e060a0'];
            const levelLabels = ['', '基础', '进阶', '高级', '深度学习', '专家级'];
            
            let content = `
                <div class="content-card">
                    <div class="card-title">📖 什么是${topicName}？</div>
                    <div class="card-content">
                        ${detail.definition}
                        <div style="margin-top:15px;padding:15px;background:rgba(60,140,200,0.2);border-radius:8px;">
                            <strong style="color:#40c0e0;">💡 核心直觉：</strong>${detail.intuition}
                        </div>
                    </div>
                </div>
                
                <div class="content-card">
                    <div class="card-title">📊 性能指标</div>
                    <div class="card-content">
                        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;">
                            <div style="text-align:center;padding:15px;background:rgba(0,0,0,0.3);border-radius:8px;">
                                <div style="font-size:20px;color:#40c0e0;font-weight:bold;">${detail.stats.accuracy}</div>
                                <div style="font-size:12px;color:#80a0c0;margin-top:5px;">准确率%</div>
                            </div>
                            <div style="text-align:center;padding:15px;background:rgba(0,0,0,0.3);border-radius:8px;">
                                <div style="font-size:20px;color:#80e0c0;font-weight:bold;">${detail.stats.complexity}</div>
                                <div style="font-size:12px;color:#80a0c0;margin-top:5px;">时间复杂度</div>
                            </div>
                            <div style="text-align:center;padding:15px;background:rgba(0,0,0,0.3);border-radius:8px;">
                                <div style="font-size:20px;color:#a080e0;font-weight:bold;">${detail.stats.usage}</div>
                                <div style="font-size:12px;color:#80a0c0;margin-top:5px;">使用频率</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                ${detail.formula ? `
                <div class="content-card">
                    <div class="card-title">📐 核心公式</div>
                    <div class="card-content">
                        <div style="background:rgba(0,0,0,0.4);padding:15px;border-radius:8px;border-left:4px solid #40c0e0;font-family:'Times New Roman',serif;font-size:16px;">${detail.formula}</div>
                        ${detail.loss ? `<div style="background:rgba(0,0,0,0.4);padding:15px;border-radius:8px;border-left:4px solid #40c0e0;font-family:'Times New Roman',serif;font-size:16px;margin-top:10px;">损失函数：${detail.loss}</div>` : ''}
                    </div>
                </div>
                ` : ''}
                
                <div class="content-card">
                    <div class="card-title">🎯 适用场景</div>
                    <div class="card-content">
                        <div style="display:flex;flex-wrap:wrap;gap:10px;">
                            ${detail.scenarios.map(s => `<span style="padding:6px 14px;background:rgba(60,180,140,0.2);border-radius:15px;font-size:13px;color:#60c0a0;">${s}</span>`).join('')}
                        </div>
                    </div>
                </div>
                
                <div class="content-card">
                    <div class="card-title">🔗 相关知识点</div>
                    <div class="card-content">
                        <div class="related-topics">
                            ${detail.related.map(r => `<span class="related-tag">${r}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('modalTitle').innerHTML = `${topicName} <span style="font-size:14px;color:${levelColors[detail.level]};">(${levelLabels[detail.level]})</span>`;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('topicModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('topicModal').style.display = 'none';
        }

        function updateCharts(period) {
            document.querySelectorAll('.viz-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            const values = {
                week: [45, 65, 52, 72, 58, 38, 48],
                month: [38, 52, 45, 68, 55, 72, 60],
                year: [25, 35, 42, 55, 62, 58, 68]
            };
            const labels = ['一', '二', '三', '四', '五', '六', '日'];
            
            const container = document.getElementById('learningBarChart');
            container.innerHTML = values[period].map((v, i) => `
                <div class="bar" style="height: ${v / 72 * 100}%;">
                    <span class="bar-value">${v}</span>
                    <span class="bar-label">周${labels[i]}</span>
                </div>
            `).join('');
        }

        function openExerciseBook() {
            window.open('learning-terminal.html', '_blank');
        }

        document.getElementById('topicModal').addEventListener('click', (e) => {
            if (e.target.id === 'topicModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderKnowledgeGraph();
        renderCourses();
        updateCharts('week');
    </script>
</body>
</html>
