<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #d0e0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* 动态背景 */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(64, 192, 224, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-50px) translateX(20px); opacity: 0.8; }
        }

        header { 
            text-align: center; 
            padding: 60px 20px 30px;
            position: relative;
            z-index: 1;
        }
        header h1 {
            font-size: 52px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0, #40c0e0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        header p { color: #80a0c0; font-size: 18px; }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            background: rgba(30, 40, 60, 0.7);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(80, 120, 180, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(64, 192, 224, 0.5);
            box-shadow: 0 15px 40px rgba(64, 192, 224, 0.15);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(64, 192, 224, 0.1), transparent);
            transition: left 0.5s ease;
        }
        .stat-card:hover::before { left: 100%; }
        .stat-icon { font-size: 32px; margin-bottom: 10px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #40c0e0; }
        .stat-label { font-size: 13px; color: #80a0c0; }

        /* 导航标签 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }
        .tab {
            padding: 10px 24px;
            background: rgba(60, 100, 160, 0.3);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            border: 1px solid transparent;
        }
        .tab:hover { 
            background: rgba(80, 140, 200, 0.4);
            transform: scale(1.05);
        }
        .tab.active { 
            background: linear-gradient(135deg, rgba(64, 192, 224, 0.4), rgba(128, 224, 192, 0.3));
            border-color: rgba(64, 192, 224, 0.5);
            box-shadow: 0 0 20px rgba(64, 192, 224, 0.3);
        }

        /* 知识图谱 */
        .knowledge-graph {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin: 0 20px 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            position: relative;
            z-index: 1;
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { 
            font-size: 20px; 
            color: #a0c0e0; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-dot { 
            width: 14px; 
            height: 14px; 
            border-radius: 50%; 
            box-shadow: 0 0 8px currentColor;
        }
        .legend-dot.level-1 { background: #60c0a0; color: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; color: #60c0a0; }
        .legend-dot.level-3 { background: #a080e0; color: #a080e0; }
        .legend-dot.level-4 { background: #e08060; color: #e08060; }
        .legend-dot.level-5 { background: #e060a0; color: #e060a0; }

        /* 知识图谱节点 - 创新布局 */
        .graph-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            justify-items: center;
        }
        .graph-node {
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            font-size: 14px;
            text-align: center;
            border: 2px solid transparent;
            min-width: 100px;
        }
        .graph-node:hover {
            transform: translateY(-8px) scale(1.05);
            z-index: 10;
        }
        .graph-node.level-1 { 
            background: linear-gradient(135deg, rgba(100, 180, 140, 0.3), rgba(60, 160, 120, 0.2)); 
            color: #80e0c0; 
            border-color: rgba(100, 180, 140, 0.4);
        }
        .graph-node.level-2 { 
            background: linear-gradient(135deg, rgba(100, 160, 220, 0.3), rgba(60, 140, 200, 0.2)); 
            color: #80c0f0; 
            border-color: rgba(100, 160, 220, 0.4);
        }
        .graph-node.level-3 { 
            background: linear-gradient(135deg, rgba(180, 140, 220, 0.3), rgba(160, 120, 200, 0.2)); 
            color: #a080e0; 
            border-color: rgba(180, 140, 220, 0.4);
        }
        .graph-node.level-4 { 
            background: linear-gradient(135deg, rgba(220, 140, 100, 0.3), rgba(200, 120, 80, 0.2)); 
            color: #e08060; 
            border-color: rgba(220, 140, 100, 0.4);
        }
        .graph-node.level-5 { 
            background: linear-gradient(135deg, rgba(220, 100, 160, 0.3), rgba(200, 80, 140, 0.2)); 
            color: #e060a0; 
            border-color: rgba(220, 100, 160, 0.4);
        }
        .graph-node::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .graph-node:hover::after { opacity: 1; }

        /* 课程卡片 */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 0 20px 30px;
            position: relative;
            z-index: 1;
        }
        .course-card {
            background: rgba(30, 40, 60, 0.7);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #40c0e0, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .course-card:hover::before { opacity: 1; }
        .course-card:hover {
            transform: translateY(-6px);
            border-color: rgba(64, 192, 224, 0.5);
            box-shadow: 0 20px 40px rgba(64, 192, 224, 0.15);
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .course-name { font-size: 20px; font-weight: 600; color: #d0e0f0; }
        .course-difficulty {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .course-difficulty.easy { background: rgba(100, 180, 140, 0.3); color: #60c0a0; }
        .course-difficulty.medium { background: rgba(100, 160, 220, 0.3); color: #60c0f0; }
        .course-difficulty.hard { background: rgba(220, 140, 100, 0.3); color: #e08060; }
        .course-progress {
            margin-top: 15px;
            height: 6px;
            background: rgba(60, 80, 120, 0.5);
            border-radius: 3px;
            overflow: hidden;
        }
        .course-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #40c0e0, #80e0c0);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .course-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .topic-tag {
            padding: 4px 12px;
            background: rgba(60, 80, 120, 0.6);
            border-radius: 12px;
            font-size: 12px;
            color: #a0c0e0;
            transition: all 0.3s;
        }
        .topic-tag:hover { background: rgba(80, 120, 160, 0.7); }

        /* 可视化图表 */
        .visualization-section {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin: 0 20px 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            position: relative;
            z-index: 1;
        }
        .viz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .viz-title { font-size: 18px; color: #a0c0e0; }
        .viz-controls {
            display: flex;
            gap: 10px;
        }
        .viz-btn {
            padding: 8px 16px;
            background: rgba(60, 100, 160, 0.4);
            border: none;
            border-radius: 8px;
            color: #a0c0e0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }
        .viz-btn:hover { background: rgba(64, 192, 224, 0.4); }
        .viz-btn.active { background: rgba(64, 192, 224, 0.6); }

        /* 图表容器 */
        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            min-height: 280px;
            position: relative;
        }
        .chart-title { font-size: 14px; color: #80a0c0; margin-bottom: 15px; }
        
        /* 柱状图 */
        .bar-chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 200px;
            padding: 10px;
        }
        .bar {
            width: 30px;
            background: linear-gradient(180deg, #40c0e0, #60c0a0);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: height 0.5s ease;
            cursor: pointer;
        }
        .bar:hover {
            background: linear-gradient(180deg, #60c0f0, #80e0c0);
            box-shadow: 0 -5px 20px rgba(64, 192, 224, 0.4);
        }
        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #80a0c0;
            white-space: nowrap;
        }
        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #40c0e0;
            font-weight: bold;
        }

        /* 折线图 */
        .line-chart {
            position: relative;
            height: 200px;
            padding: 10px;
        }
        .line-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .line-path {
            fill: none;
            stroke: url(#lineGradient);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.5s ease;
        }
        .line-area {
            fill: url(#areaGradient);
            opacity: 0.3;
        }
        .line-point {
            fill: #40c0e0;
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s;
        }
        .line-point:hover {
            fill: #60c0f0;
            transform: scale(1.5);
        }
        .line-grid {
            stroke: rgba(100, 140, 180, 0.2);
            stroke-dasharray: 4 4;
        }

        /* 知识点详情模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal {
            background: linear-gradient(135deg, #1a1f35, #0f1623);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(80, 120, 180, 0.3);
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #1a1f35, #0f1623);
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(80, 120, 180, 0.2);
        }
        .modal-header h3 { font-size: 24px; color: #d0e0f0; }
        .close-btn {
            font-size: 28px;
            cursor: pointer;
            color: #80a0c0;
            transition: all 0.3s;
        }
        .close-btn:hover { color: #fff; transform: rotate(90deg); }

        /* 内容卡片 */
        .content-card {
            background: rgba(60, 80, 120, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .content-card:hover { border-color: rgba(64, 192, 224, 0.3); }
        .card-title {
            font-size: 16px;
            color: #80c0f0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-content {
            color: #a0c0e0;
            line-height: 1.7;
            font-size: 14px;
        }

        /* 交互式滑块 */
        .slider-section {
            margin-top: 20px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .slider-value {
            color: #40c0e0;
            font-weight: bold;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(60, 100, 160, 0.5);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #40c0e0, #60c0a0);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(64, 192, 224, 0.5);
            transition: all 0.3s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(64, 192, 224, 0.7);
        }

        /* 数学公式 */
        .math-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            margin: 15px 0;
            overflow-x: auto;
            border-left: 4px solid #40c0e0;
        }

        /* 相关知识点 */
        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .related-tag {
            padding: 6px 16px;
            background: rgba(180, 140, 220, 0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #a080e0;
            border: 1px solid rgba(180, 140, 220, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .related-tag:hover { 
            background: rgba(180, 140, 220, 0.3);
            transform: translateY(-2px);
        }

        /* 练习入口 */
        .exercise-section {
            background: linear-gradient(135deg, rgba(60, 180, 140, 0.15), rgba(60, 140, 180, 0.15));
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            margin: 0 20px 30px;
            border: 1px solid rgba(60, 180, 140, 0.3);
            position: relative;
            z-index: 1;
        }
        .exercise-title { 
            font-size: 22px; 
            color: #80e0c0; 
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .exercise-desc { color: #80a0c0; font-size: 15px; margin-bottom: 20px; }
        .exercise-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #40c0e0, #60c0a0);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 5px 20px rgba(64, 192, 224, 0.3);
        }
        .exercise-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(64, 192, 224, 0.5);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #6080a0;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .chart-container { grid-template-columns: 1fr; }
            header h1 { font-size: 36px; }
            .stat-value { font-size: 22px; }
        }
    </style>
</head>
<body>
    <!-- 动态背景粒子 -->
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <header>
            <h1>🧠 个性化学习助手</h1>
            <p>基于学习风格的自适应学习平台</p>
        </header>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card" onclick="showTab('knowledge')">
                <div class="stat-icon">📊</div>
                <div class="stat-value">25</div>
                <div class="stat-label">知识点</div>
            </div>
            <div class="stat-card" onclick="showTab('courses')">
                <div class="stat-icon">📚</div>
                <div class="stat-value">5</div>
                <div class="stat-label">课程</div>
            </div>
            <div class="stat-card" onclick="showTab('visualization')">
                <div class="stat-icon">📈</div>
                <div class="stat-value">96%</div>
                <div class="stat-label">学习进度</div>
            </div>
            <div class="stat-card" onclick="showTab('exercises')">
                <div class="stat-icon">✏️</div>
                <div class="stat-value">125</div>
                <div class="stat-label">练习题</div>
            </div>
        </div>

        <!-- 导航标签 -->
        <div class="tabs">
            <span class="tab active" onclick="showTab('knowledge')">📊 知识图谱</span>
            <span class="tab" onclick="showTab('courses')">📚 课程中心</span>
            <span class="tab" onclick="showTab('visualization')">📈 学习统计</span>
            <span class="tab" onclick="showTab('exercises')">✏️ 练习题册</span>
        </div>

        <!-- 知识图谱 -->
        <div id="knowledge" class="knowledge-graph">
            <div class="graph-header">
                <div class="graph-title">📊 知识体系图谱</div>
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot level-1"></span> 基础</span>
                    <span class="legend-item"><span class="legend-dot level-2"></span> 进阶</span>
                    <span class="legend-item"><span class="legend-dot level-3"></span> 高级</span>
                    <span class="legend-item"><span class="legend-dot level-4"></span> 深度学习</span>
                    <span class="legend-item"><span class="legend-dot level-5"></span> 专家级</span>
                </div>
            </div>
            <div class="graph-container" id="graphNodes">
            </div>
        </div>

        <!-- 课程中心 -->
        <div id="courses" style="display: none;" class="courses-grid">
        </div>

        <!-- 可视化统计 -->
        <div id="visualization" style="display: none;" class="visualization-section">
            <div class="viz-header">
                <div class="viz-title">📈 学习数据分析</div>
                <div class="viz-controls">
                    <button class="viz-btn active" onclick="updateCharts('week')">本周</button>
                    <button class="viz-btn" onclick="updateCharts('month')">本月</button>
                    <button class="viz-btn" onclick="updateCharts('year')">本年</button>
                </div>
            </div>
            
            <div class="chart-container">
                <!-- 学习时长柱状图 -->
                <div class="chart-box">
                    <div class="chart-title">📊 每日学习时长（分钟）</div>
                    <div class="bar-chart" id="learningBarChart">

        }
        
        function drawVisualization(value, topicName) {
            const canvas = document.getElementById('visualizationCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            canvas.width = width;
            
            ctx.clearRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(100, 140, 180, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (height / 4) * i);
                ctx.lineTo(width, (height / 4) * i);
                ctx.stroke();
            }
            
            const param = value / 100;
            
            if (topicName === '线性回归') {
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, height * (0.6 - param * 0.3));
                ctx.lineTo(width, height * (0.3 + param * 0.2));
                ctx.stroke();
                
                for (let i = 0; i < 15; i++) {
                    const x = (width / 14) * i;
                    const y = height * (0.5 - param * 0.15 + Math.sin(i * 0.5) * 0.15);
                    ctx.fillStyle = '#80e0c0';
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (topicName === '逻辑回归') {
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let x = 0; x < width; x++) {
                    const z = (x - width / 2) / (width / 4) * (1 + param);
                    const y = height - height / (1 + Math.exp(-z));
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            } else if (topicName === '神经网络') {
                const layers = 3;
                const nodesPerLayer = [3, 4, 2];
                
                for (let layer = 0; layer < layers; layer++) {
                    const layerX = (width / (layers + 1)) * (layer + 1);
                    for (let node = 0; node < nodesPerLayer[layer]; node++) {
                        const nodeY = (height / (nodesPerLayer[layer] + 1)) * (node + 1);
                        
                        ctx.fillStyle = `rgba(64, 192, 224, ${0.3 + param * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(layerX, nodeY, 15 + param * 10, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = '#40c0e0';
                        ctx.lineWidth = 1 + param;
                        ctx.stroke();
                        
                        if (layer < layers - 1) {
                            for (let nextNode = 0; nextNode < nodesPerLayer[layer + 1]; nextNode++) {
                                const nextX = (width / (layers + 1)) * (layer + 2);
                                const nextY = (height / (nodesPerLayer[layer + 1] + 1)) * (nextNode + 1);
                                ctx.beginPath();
                                ctx.moveTo(layerX + 15 + param * 10, nodeY);
                                ctx.lineTo(nextX - 15 - param * 10, nextY);
                                ctx.strokeStyle = `rgba(64, 192, 224, ${0.2 + param * 0.3})`;
                                ctx.stroke();
                            }
                        }
                    }
                }
            } else if (topicName === '动态规划') {
                const gridSize = 5;
                const cellSize = Math.min(width, height) / (gridSize + 1);
                
                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        const x = (j + 1) * cellSize;
                        const y = (i + 1) * cellSize;
                        
                        const dist = Math.abs(i - j);
                        const opacity = Math.max(0.2, 1 - dist * 0.2 - (1 - param) * 0.5);
                        
                        ctx.fillStyle = `rgba(64, 192, 224, ${opacity})`;
                        ctx.fillRect(x - cellSize / 2 + 2, y - cellSize / 2 + 2, cellSize - 4, cellSize - 4);
                        
                        ctx.strokeStyle = '#40c0e0';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x - cellSize / 2, y - cellSize / 2, cellSize, cellSize);
                    }
                }
                
                ctx.strokeStyle = '#80e0c0';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cellSize, cellSize);
                for (let i = 0; i < gridSize; i++) {
                    const x = ((Math.min(i, Math.floor(param * gridSize)) + 1)) * cellSize;
                    const y = ((i + 1)) * cellSize;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            } else {
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let x = 0; x < width; x++) {
                    const y = height / 2 + Math.sin(x * 0.02 + param * Math.PI * 2) * (height / 4);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }
