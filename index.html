<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #d0e0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; padding: 40px 20px 20px; }
        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: #80a0c0; font-size: 16px; }

        /* 导航标签 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            padding: 0 20px;
        }
        .tab {
            padding: 8px 20px;
            background: rgba(60, 100, 160, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .tab:hover { background: rgba(80, 140, 200, 0.4); }
        .tab.active { background: rgba(60, 180, 220, 0.5); }

        /* 知识图谱 */
        .knowledge-graph {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 16px;
            padding: 30px;
            margin: 0 20px 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { font-size: 18px; color: #a0c0e0; }
        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .legend-dot.level-1 { background: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; }
        .legend-dot.level-3 { background: #a080e0; }
        .legend-dot.level-4 { background: #e08060; }
        .legend-dot.level-5 { background: #e060a0; }

        /* 知识图谱节点 */
        .graph-nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .graph-node {
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            font-size: 14px;
            border: 1px solid transparent;
        }
        .graph-node:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(60, 140, 200, 0.2);
        }
        .graph-node.level-1 { background: rgba(100, 180, 140, 0.3); color: #80e0c0; border-color: rgba(100, 180, 140, 0.3); }
        .graph-node.level-2 { background: rgba(100, 160, 220, 0.3); color: #80c0f0; border-color: rgba(100, 160, 220, 0.3); }
        .graph-node.level-3 { background: rgba(180, 140, 220, 0.3); color: #a080e0; border-color: rgba(180, 140, 220, 0.3); }
        .graph-node.level-4 { background: rgba(220, 140, 100, 0.3); color: #e08060; border-color: rgba(220, 140, 100, 0.3); }
        .graph-node.level-5 { background: rgba(220, 100, 160, 0.3); color: #e060a0; border-color: rgba(220, 100, 160, 0.3); }

        /* 课程卡片 */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 0 20px 30px;
        }
        .course-card {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }
        .course-card:hover {
            transform: translateY(-3px);
            border-color: rgba(100, 180, 220, 0.4);
            box-shadow: 0 10px 30px rgba(60, 140, 200, 0.1);
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .course-name { font-size: 18px; font-weight: 600; color: #d0e0f0; }
        .course-difficulty {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        .course-difficulty.easy { background: rgba(100, 180, 140, 0.3); color: #60c0a0; }
        .course-difficulty.medium { background: rgba(100, 160, 220, 0.3); color: #60c0f0; }
        .course-difficulty.hard { background: rgba(220, 140, 100, 0.3); color: #e08060; }
        .course-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .topic-tag {
            padding: 3px 10px;
            background: rgba(60, 80, 120, 0.5);
            border-radius: 10px;
            font-size: 12px;
            color: #a0c0e0;
        }

        /* 知识点详情页面 */
        .topic-detail {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .detail-header {
            margin-bottom: 30px;
            text-align: center;
        }
        .detail-title {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .detail-level {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* 内容卡片 */
        .content-card {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .card-title {
            font-size: 18px;
            color: #80c0f0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-content {
            color: #a0c0e0;
            line-height: 1.8;
            font-size: 15px;
        }
        .card-content ul {
            margin-left: 20px;
            margin-top: 10px;
        }
        .card-content li {
            margin-bottom: 8px;
        }

        /* 适用场景标签 */
        .scenario-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .scenario-tag {
            padding: 6px 14px;
            background: rgba(60, 180, 140, 0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #80e0c0;
            border: 1px solid rgba(60, 180, 140, 0.3);
        }

        /* 发展脉络 */
        .timeline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(60, 80, 120, 0.3);
            border-radius: 10px;
            margin-top: 15px;
        }
        .timeline-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .timeline-year {
            padding: 4px 10px;
            background: rgba(60, 140, 200, 0.4);
            border-radius: 8px;
            font-size: 12px;
            color: #80c0f0;
        }
        .timeline-arrow {
            color: #6080a0;
        }
        .timeline-link {
            padding: 4px 10px;
            background: rgba(100, 140, 180, 0.3);
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .timeline-link:hover { background: rgba(100, 140, 180, 0.5); }

        /* 数学公式 */
        .math-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            margin: 15px 0;
            overflow-x: auto;
        }

        /* 交互式滑块 */
        .slider-container {
            margin: 20px 0;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .slider-value {
            color: #40c0e0;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(60, 100, 160, 0.5);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #40c0e0;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 可视化区域 */
        .visualization-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }
        .canvas-container {
            width: 100%;
            height: 280px;
            position: relative;
        }
        .canvas-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #80c0f0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
        }
        .canvas-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0);
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            transition: all 0.3s;
        }
        .canvas-axis {
            position: absolute;
            background: rgba(100, 140, 180, 0.3);
        }
        .axis-x {
            height: 1px;
            bottom: 20px;
            left: 10%;
            right: 10%;
        }
        .axis-y {
            width: 1px;
            left: 10%;
            top: 20px;
            bottom: 20px;
        }

        /* 相关知识点 */
        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .related-tag {
            padding: 6px 14px;
            background: rgba(180, 140, 220, 0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #a080e0;
            border: 1px solid rgba(180, 140, 220, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .related-tag:hover { background: rgba(180, 140, 220, 0.3); }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(60, 100, 160, 0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .back-btn:hover { background: rgba(60, 140, 200, 0.4); }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #6080a0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页内容 -->
        <div id="home-page">
            <header>

            <div id="exercises" style="display: none; padding: 0 20px;">

                    <div style="font-size: 20px; color: #80e0c0; margin-bottom: 10px;">✏️ 精选练习题册</div>

                    <button onclick="openExerciseBook()" style="padding: 12px 30px; background: linear-gradient(135deg, #40c0e0, #60c0a0); border: none; border-radius: 25px; color: white; font-size: 16px; cursor: pointer; transition: all 0.3s;">📚 开始练习</button>
                </div>
            </div>
        </div>

        <!-- 知识点详情页 -->
        <div id="topic-page" style="display: none;">
            <div class="topic-detail" id="topicDetailContent">

        </div>

        <footer>
            <p>个性化学习助手 | 基于学习风格的自适应学习平台</p>

    </div>

                intuition: '走一步看一步，每次都选看起来最好的选项。',
                scenarios: ['找零钱', '区间调度', '最小生成树', '哈夫曼编码'],

        function renderKnowledgeGraph() {
            const container = document.getElementById('graphNodes');
            container.innerHTML = knowledgeNodes.map(node => `
                <div class="graph-node level-${node.level}" onclick="showTopicDetail('${node.name}')" title="${node.shortDesc}">
                    ${node.name}
                </div>
            `).join('');
        }

        function renderCourses() {
            const container = document.getElementById('courses');
            container.innerHTML = courses.map(course => `
                <div class="course-card" onclick="filterByCategory('${course.id}')">
                    <div class="course-header">
                        <span class="course-name">${course.name}</span>
                        <span class="course-difficulty ${course.difficulty}">${course.difficulty === 'easy' ? '简单' : course.difficulty === 'medium' ? '中等' : '困难'}</span>
                    </div>
                    <div style="color:#80a0c0;font-size:13px;margin-bottom:10px;">${course.desc}</div>
                    <div style="color:#6080a0;font-size:12px;">预计学习时间: ${course.time}分钟</div>
                    <div class="course-topics">
                        ${course.topics.slice(0, 4).map(t => `<span class="topic-tag">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('knowledge').style.display = tabName === 'knowledge' ? 'block' : 'none';
            document.getElementById('courses').style.display = tabName === 'courses' ? 'grid' : 'none';
            document.getElementById('exercises').style.display = tabName === 'exercises' ? 'block' : 'none';
        }

        function filterByCategory(category) {
            const nodes = document.querySelectorAll('.graph-node');
            nodes.forEach(node => {
                node.style.display = node.getAttribute('onclick').includes(category) ? 'block' : 'none';
            });
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.tab:first-child').classList.add('active');
        }

        function showTopicDetail(topicName) {
            const detail = topicDetails[topicName];
            if (!detail) return;
            
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('topic-page').style.display = 'block';
            
            const levelColors = ['', '#60c0a0', '#60c0f0', '#a080e0', '#e08060', '#e060a0'];
            const levelLabels = ['', '基础', '进阶', '高级', '深度学习', '专家级'];
            
            let content = `
                <div class="back-btn" onclick="goBack()">
                    ← 返回知识图谱
                </div>
                <div class="detail-header">
                    <h2 class="detail-title">${topicName}</h2>
                    <span class="detail-level" style="background: rgba(${levelColors[detail.level]}, 0.2); color: ${levelColors[detail.level]}; border: 1px solid ${levelColors[detail.level]};">
                        Level ${detail.level} - ${levelLabels[detail.level]}
                    </span>
                </div>
                
                <div class="content-card">
                    <div class="card-title">📖 什么是${topicName}？</div>
                    <div class="card-content">
                        ${detail.definition}
                        <div style="margin-top: 15px; padding: 15px; background: rgba(60, 140, 200, 0.2); border-radius: 8px;">
                            <strong style="color: #40c0e0;">💡 核心直觉：</strong>${detail.intuition}
                        </div>
                    </div>
                </div>
                
                <div class="content-card">
                    <div class="card-title">🎯 适用场景</div>
                    <div class="card-content">
                        <div class="scenario-tags">
                            ${detail.scenarios.map(s => `<span class="scenario-tag">${s}</span>`).join('')}
                        </div>
                    </div>
                </div>
                
                <div class="content-card">
                    <div class="card-title">📜 历史渊源</div>
                    <div class="card-content">
                        <strong style="color: #80c0f0;">起源：</strong>${detail.history.origin}（${detail.history.year}年）<br/>
                        <strong style="color: #80c0f0;">里程碑：</strong>${detail.history.milestone}
                        <div class="timeline">
                            ${detail.development.map((item, i) => `
                                <div class="timeline-item">
                                    <span class="timeline-year">${item.year}</span>
                                    <span class="timeline-link" onclick="showTopicDetail('${item.name}')">${item.name}</span>
                                </div>
                                ${i < detail.development.length - 1 ? '<span class="timeline-arrow">→</span>' : ''}
                            `).join('')}
                        </div>
                    </div>
                </div>
                
                <div class="content-card">
                    <div class="card-title">⚠️ 局限性</div>
                    <div class="card-content">
                        <ul>
                            ${detail.limitations.map(l => `<li>${l}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
            
            if (detail.formula || detail.loss) {
                content += `
                    <div class="content-card">
                        <div class="card-title">📐 数学原理</div>
                        <div class="card-content">
                            ${detail.formula ? `<div class="math-box">模型：${detail.formula}</div>` : ''}
                            ${detail.loss ? `<div class="math-box">损失函数：${detail.loss}</div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            if (detail.hasVisualization) {
                content += `
                    <div class="content-card">
                        <div class="card-title">🎮 交互式可视化</div>
                        <div class="card-content">
                            <div class="visualization-area">
                                <div class="canvas-container">
                                    <div class="canvas-axis axis-x"></div>
                                    <div class="canvas-axis axis-y"></div>
                                    <div class="canvas-line" id="visLine" style="width: 80%;"></div>
                                </div>
                                <div class="slider-container">
                                    <div class="slider-label">
                                        <span>参数调整</span>
                                        <span class="slider-value" id="sliderVal">50</span>
                                    </div>
                                    <input type="range" min="1" max="100" value="50" oninput="updateVisualization(this.value)" id="visSlider">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            content += `
                <div class="content-card">
                    <div class="card-title">🔗 相关知识点</div>
                    <div class="card-content">
                        <div class="related-topics">
                            ${detail.related.map(r => `<span class="related-tag" onclick="showTopicDetail('${r}')">${r}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('topicDetailContent').innerHTML = content;
            
            if (detail.hasVisualization) {
                initVisualization();
            }
        }

        function initVisualization() {
            const canvas = document.querySelector('.canvas-container');
            for (let i = 0; i < 15; i++) {
                const dot = document.createElement('div');
                dot.className = 'canvas-dot';
                dot.style.left = `${10 + Math.random() * 80}%`;
                dot.style.top = `${20 + Math.random() * 60}%`;
                canvas.appendChild(dot);
            }
            updateVisualization(50);
        }

        function updateVisualization(value) {
            document.getElementById('sliderVal').textContent = value;
            const line = document.getElementById('visLine');
            line.style.width = `${value}%`;
            line.style.background = `linear-gradient(90deg, #40c0e0, ${value > 70 ? '#80e0c0' : '#80c0f0'})`;
            
            const dots = document.querySelectorAll('.canvas-dot');
            dots.forEach((dot, i) => {
                const offset = (value - 50) * 0.3;
                dot.style.transform = `translate(-50%, -50%) translateY(${offset * (i % 3 - 1)}px)`;
            });
        }

        function goBack() {
            document.getElementById('topic-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            renderKnowledgeGraph();
        }

        function openExerciseBook() {
            window.open('learning-terminal.html', '_blank');
        }

        renderKnowledgeGraph();
        renderCourses();
    </script>
</body>
</html>
