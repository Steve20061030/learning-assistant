<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #d0e0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        header { 
            text-align: center; 
            padding: 60px 20px 30px;
        }
        header h1 {
            font-size: 52px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0, #40c0e0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        header p { color: #80a0c0; font-size: 18px; }

        .knowledge-graph {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { font-size: 20px; color: #a0c0e0; }
        .legend { display: flex; gap: 15px; flex-wrap: wrap; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
        .legend-dot.level-1 { background: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; }
        .legend-dot.level-3 { background: #a080e0; }
        .legend-dot.level-4 { background: #e08060; }
        .legend-dot.level-5 { background: #e060a0; }

        .graph-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            justify-items: center;
        }
        .graph-node {
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-align: center;
            border: 2px solid transparent;
        }
        .graph-node:hover { transform: translateY(-5px); }
        .graph-node.level-1 { background: rgba(96, 192, 160, 0.3); color: #60c0a0; border-color: rgba(96, 192, 160, 0.5); }
        .graph-node.level-2 { background: rgba(96, 192, 240, 0.3); color: #60c0f0; border-color: rgba(96, 192, 240, 0.5); }
        .graph-node.level-3 { background: rgba(160, 128, 224, 0.3); color: #a080e0; border-color: rgba(160, 128, 224, 0.5); }
        .graph-node.level-4 { background: rgba(224, 128, 96, 0.3); color: #e08060; border-color: rgba(224, 128, 96, 0.5); }
        .graph-node.level-5 { background: rgba(224, 96, 160, 0.3); color: #e060a0; border-color: rgba(224, 96, 160, 0.5); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: linear-gradient(135deg, #1a1f35, #0f1623);
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(80, 120, 180, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h3 { font-size: 24px; color: #d0e0f0; }
        .close-btn {
            font-size: 28px;
            cursor: pointer;
            color: #80a0c0;
            transition: all 0.3s;
        }
        .close-btn:hover { color: #fff; }

        .content-card {
            background: rgba(60, 80, 120, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .card-title {
            font-size: 16px;
            color: #80c0f0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-content {
            color: #a0c0e0;
            line-height: 1.7;
            font-size: 14px;
        }

        .slider-section { margin-top: 20px; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .slider-value {
            color: #40c0e0;
            font-weight: bold;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(60, 100, 160, 0.5);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #40c0e0, #80e0c0);
            border-radius: 50%;
            cursor: pointer;
        }

        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .related-tag {
            padding: 6px 16px;
            background: rgba(180, 140, 220, 0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #a080e0;
            border: 1px solid rgba(180, 140, 220, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .related-tag:hover { background: rgba(180, 140, 220, 0.3); }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #6080a0;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 36px; }
        }
    </style>
</head>

        function drawVisualization(topicName, value) {
            const canvas = document.getElementById('vizCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            canvas.width = width;
            canvas.height = height;
            
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(100,140,180,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (height / 10) * i);
                ctx.lineTo(width, (height / 10) * i);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo((width / 10) * i, 0);
                ctx.lineTo((width / 10) * i, height);
                ctx.stroke();
            }
            
            const param = value / 100;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            switch(topicName) {
                case '线性回归':
                    drawRegression(ctx, width, height, param);
                    break;
                case '逻辑回归':
                    drawSigmoid(ctx, width, height, param);
                    break;
                case 'KNN':
                    drawKNN(ctx, width, height, param);
                    break;
                case '神经网络':
                    drawNeuralNetwork(ctx, width, height, param);
                    break;
                case 'SVM':
                    drawSVM(ctx, width, height, param);
                    break;
                case '栈和队列':
                    drawStackQueue(ctx, width, height, param);
                    break;
                case '链表':
                    drawLinkedList(ctx, width, height, param);
                    break;
                case '树结构':
                    drawTree(ctx, width, height, param);
                    break;
                case '排序算法':
                    drawSorting(ctx, width, height, param);
                    break;
                case '查找算法':
                    drawSearch(ctx, width, height, param);
                    break;
                case '集合论':
                    drawSetOperations(ctx, width, height, param);
                    break;
                case '复杂度分析':
                    drawComplexity(ctx, width, height, param);
                    break;
                case '动态规划':
                    drawDP(ctx, width, height, param);
                    break;
                case '贪心算法':
                    drawGreedy(ctx, width, height, param);
                    break;
                default:
                    drawDefault(ctx, width, height, param);
            }
        }

        function drawRegression(ctx, w, h, p) {
            ctx.strokeStyle = '#40c0e0';
            ctx.beginPath();
            const slope = -0.3 + p * 0.6;
            ctx.moveTo(50, h * 0.8);
            ctx.lineTo(w - 50, h * 0.2 + slope * h * 0.5);
            ctx.stroke();
            
            for (let i = 0; i < 20; i++) {
                const x = 50 + (w - 100) * (i / 19);
                const baseY = h * 0.5 + Math.sin(i * 0.5) * 60;
                const y = baseY + (1 - p) * 30 * Math.random();
                
                ctx.fillStyle = 'rgba(128, 224, 192, 0.7)';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('斜率: ' + slope.toFixed(2), 20, 30);
            ctx.fillText('数据点: 20个', 20, 50);
        }

        function drawSigmoid(ctx, w, h, p) {
            const gradient = ctx.createLinearGradient(0, 0, w, 0);
            gradient.addColorStop(0, '#40c0e0');
            gradient.addColorStop(1, '#80e0c0');
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            for (let x = 0; x <= w; x++) {
                const z = (x - w/2) / (w/4) * (1 + p);
                const y = h - h / (1 + Math.exp(-z));
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.fillRect(w/2 - 2, h/2 - 5, 4, 10);
            ctx.font = '14px Arial';
            ctx.fillText('阈值: 0.5', 20, 30);
            ctx.fillText('陡峭度: ' + (1 + p).toFixed(2), 20, 50);
        }

        function drawKNN(ctx, w, h, p) {
            const k = Math.floor(1 + p * 9);
            const points = [];
            for (let i = 0; i < 30; i++) {
                points.push({
                    x: Math.random() * (w - 100) + 50,
                    y: Math.random() * (h - 100) + 50,
                    class: Math.random() > 0.5 ? 0 : 1
                });
            }
            
            points.forEach(pt => {
                ctx.fillStyle = pt.class === 0 ? '#60c0a0' : '#e060a0';
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });
            
            const targetX = w/2;
            const targetY = h/2;
            const distances = points.map(pt => ({
                ...pt,
                dist: Math.sqrt((pt.x - targetX)*(pt.x - targetX) + (pt.y - targetY)*(pt.y - targetY))
            })).sort((a, b) => a.dist - b.dist);
            
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            distances.slice(0, k).forEach(pt => {
                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                ctx.lineTo(pt.x, pt.y);
                ctx.stroke();
            });
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#40c0e0';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.font = '14px Arial';
            ctx.fillText('K = ' + k, 20, 30);
            ctx.fillText('红色邻居: ' + distances.slice(0, k).filter(p => p.class === 1).length, 20, 50);
        }

        function drawNeuralNetwork(ctx, w, h, p) {
            const layers = 4;
            const nodes = [3, 5, 4, 2];
            const layerX = [];
            for (let i = 0; i < layers; i++) {
                layerX.push((w / (layers + 1)) * (i + 1));
            }
            
            for (let i = 0; i < layers - 1; i++) {
                for (let j = 0; j < nodes[i]; j++) {
                    const y1 = (h / (nodes[i] + 1)) * (j + 1);
                    for (let k = 0; k < nodes[i+1]; k++) {
                        const y2 = (h / (nodes[i+1] + 1)) * (k + 1);
                        const opacity = 0.2 + p * 0.4 * Math.random();
                        ctx.strokeStyle = `rgba(64, 192, 224, ${opacity})`;
                        ctx.lineWidth = 1 + p;
                        ctx.beginPath();
                        ctx.moveTo(layerX[i], y1);
                        ctx.lineTo(layerX[i+1], y2);
                        ctx.stroke();
                    }
                }
            }
            
            for (let i = 0; i < layers; i++) {
                for (let j = 0; j < nodes[i]; j++) {
                    const y = (h / (nodes[i] + 1)) * (j + 1);
                    const radius = 10 + p * 8;
                    ctx.fillStyle = `rgba(64, 192, 224, ${0.5 + p * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(layerX[i], y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#40c0e0';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('隐藏层数: ' + (layers - 2), 20, 30);
            ctx.fillText('激活强度: ' + (p * 100).toFixed(0) + '%', 20, 50);
        }

        function drawSVM(ctx, w, h, p) {
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * (w/2 - 100) + 50;
                const y = Math.random() * (h - 100) + 50;
                ctx.fillStyle = '#60c0a0';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * (w/2 - 100) + w/2 + 50;
                const y = Math.random() * (h - 100) + 50;
                ctx.fillStyle = '#e060a0';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const marginWidth = 20 + p * 40;
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(w/2 - marginWidth, 30);
            ctx.lineTo(w/2 - marginWidth, h - 30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(w/2 + marginWidth, 30);
            ctx.lineTo(w/2 + marginWidth, h - 30);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(w/2, 30);
            ctx.lineTo(w/2, h - 30);
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('间隔宽度: ' + (marginWidth * 2).toFixed(0), 20, 30);
            ctx.fillText('支持向量: 4个', 20, 50);
        }

        function drawStackQueue(ctx, w, h, p) {
            ctx.fillStyle = '#40c0e0';
            ctx.font = '16px Arial';
            ctx.fillText('栈 (LIFO)', 50, 30);
            ctx.fillText('队列 (FIFO)', w/2 + 50, 30);
            
            ctx.strokeStyle = '#60c0a0';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const y = h - 50 - i * 40;
                ctx.strokeRect(30, y, 100, 30);
                if (i < 4 - Math.floor(p * 5)) {
                    ctx.fillStyle = '#60c0a0';
                    ctx.font = '14px Arial';
                    ctx.fillText(['A', 'B', 'C', 'D', 'E'][i], 65, y + 20);
                }
            }
            
            ctx.fillStyle = '#e060a0';
            ctx.fillText('TOP →', 10, h - 50 - (4 - Math.floor(p * 5)) * 40 + 20);
            
            for (let i = 0; i < 5; i++) {
                const x = w/2 + 30 + i * 22;
                const y = h - 50;
                ctx.strokeStyle = '#a080e0';
                ctx.strokeRect(x, y, 20, 60);
                if (i < Math.floor(p * 5)) {
                    ctx.fillStyle = '#a080e0';
                    ctx.font = '12px Arial';
                    ctx.fillText(['1', '2', '3', '4', '5'][i], x + 5, y + 35);
                }
            }
            
            ctx.fillStyle = '#a080e0';
            ctx.fillText('→ 入口', w/2 + 30 - 40, h - 65);
            ctx.fillText('出口 →', w/2 + 30 + 5 * 22 + 10, h - 65);
        }

        function drawLinkedList(ctx, w, h, p) {
            const nodeCount = 5 + Math.floor(p * 4);
            const nodeWidth = 60;
            const nodeHeight = 40;
            const gap = (w - 100) / nodeCount;
            
            for (let i = 0; i < nodeCount; i++) {
                const x = 50 + i * gap;
                const y = h/2 - nodeHeight/2;
                
                ctx.fillStyle = '#1a1f35';
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, nodeWidth, nodeHeight);
                ctx.strokeRect(x, y, nodeWidth, nodeHeight);
                
                ctx.strokeStyle = '#40c0e0';
                ctx.fillStyle = '#40c0e0';
                ctx.font = '14px Arial';
                ctx.fillText(String(i + 1), x + nodeWidth/2 - 5, y + nodeHeight/2 + 5);
                
                ctx.beginPath();
                ctx.moveTo(x + nodeWidth, y + nodeHeight/2);
                ctx.lineTo(x + nodeWidth + gap/2, y + nodeHeight/2);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(x + nodeWidth + gap/2 - 5, y + nodeHeight/2 - 5);
                ctx.lineTo(x + nodeWidth + gap/2, y + nodeHeight/2);
                ctx.lineTo(x + nodeWidth + gap/2 - 5, y + nodeHeight/2 + 5);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.beginPath();
            ctx.arc(50 + nodeCount * gap - nodeWidth, h/2 + 50, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '12px Arial';
            ctx.fillText('NULL', 50 + nodeCount * gap - nodeWidth + 10, h/2 + 55);
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('节点数: ' + nodeCount, 20, 30);
            ctx.fillText('next指针', 20, 50);
        }

        function drawTree(ctx, w, h, p) {
            const depth = 2 + Math.floor(p * 3);
            
            function drawNode(x, y, level, angle) {
                if (level >= depth) return;
                
                const childGap = angle * (w / Math.pow(2, level + 1)) * 0.8;
                
                ctx.fillStyle = '#40c0e0';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#0a0e18';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(level === 0 ? '根' : 'N' + level, x, y + 4);
                ctx.textAlign = 'left';
                
                const y2 = y + 60;
                const x1 = x - childGap;
                const x2 = x + childGap;
                
                if (level < depth - 1) {
                    ctx.strokeStyle = 'rgba(64, 192, 224, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, y + 20);
                    ctx.lineTo(x1, y2 - 15);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y + 20);
                    ctx.lineTo(x2, y2 - 15);
                    ctx.stroke();
                    
                    drawNode(x1, y2, level + 1, angle / 2);
                    drawNode(x2, y2, level + 1, angle / 2);
                }
            }
            
            drawNode(w/2, 50, 0, Math.PI / 3);
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('深度: ' + (depth - 1), 20, 30);
            ctx.fillText('节点数: ' + (Math.pow(2, depth) - 1), 20, 50);
        }

        function drawSorting(ctx, w, h, p) {
            const bars = 20;
            const heights = [];
            for (let i = 0; i < bars; i++) {
                heights.push(Math.random() * 0.7 + 0.3);
            }
            
            const sortedCount = Math.floor(p * bars);
            const barWidth = (w - 40) / bars;
            
            for (let i = 0; i < bars; i++) {
                const barHeight = heights[i] * (h - 60);
                const x = 20 + i * barWidth;
                const y = h - 30 - barHeight;
                
                if (i < sortedCount) {
                    const gradient = ctx.createLinearGradient(x, y, x, h);
                    gradient.addColorStop(0, '#40c0e0');
                    gradient.addColorStop(1, '#80e0c0');
                    ctx.fillStyle = gradient;
                } else {
                    ctx.fillStyle = 'rgba(224, 128, 96, 0.7)';
                }
                
                ctx.fillRect(x + 2, y, barWidth - 4, barHeight);
                
                if (i === sortedCount - 1 || (sortedCount === 0 && i === 0)) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 2, y, barWidth - 4, barHeight);
                }
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('已排序: ' + sortedCount + '/' + bars, 20, 30);
            ctx.fillText('算法: 快速排序', 20, 50);
        }

        function drawSearch(ctx, w, h, p) {
            const arr = [10, 25, 30, 45, 55, 68, 72, 85, 90, 95];
            const target = 55;
            const searchIndex = Math.floor(p * (arr.length + 1));
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('二分查找目标: ' + target, 20, 30);
            
            const boxWidth = 50;
            const startX = (w - arr.length * boxWidth) / 2;
            
            for (let i = 0; i < arr.length; i++) {
                const x = startX + i * boxWidth;
                
                ctx.strokeStyle = i === searchIndex ? '#ffffff' : 'rgba(64, 192, 224, 0.5)';
                ctx.lineWidth = i === searchIndex ? 3 : 1;
                ctx.strokeRect(x, h/2 - 20, boxWidth - 5, 40);
                
                ctx.fillStyle = i === searchIndex ? '#40c0e0' : '#a0c0e0';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(arr[i], x + boxWidth/2 - 2, h/2 + 5);
                ctx.fillText(i, x + boxWidth/2 - 2, h/2 + 30);
                ctx.textAlign = 'left';
            }
            
            if (searchIndex < arr.length && arr[searchIndex] === target) {
                ctx.fillStyle = '#80e0c0';
                ctx.font = '16px Arial';
                ctx.fillText('找到!', w/2, h/2 + 80);
            } else if (searchIndex >= arr.length) {
                ctx.fillStyle = '#e08060';
                ctx.font = '16px Arial';
                ctx.fillText('未找到', w/2, h/2 + 80);
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '12px Arial';
            ctx.fillText('查找次数: ' + Math.ceil(Math.log2(arr.length)), 20, 50);
        }

        function drawSetOperations(ctx, w, h, p) {
            const cx1 = w/3;
            const cy1 = h/2;
            const cx2 = 2*w/3;
            const cy2 = h/2;
            const r = 100;
            
            ctx.fillStyle = 'rgba(96, 192, 160, 0.2)';
            ctx.beginPath();
            ctx.arc(cx1, cy1, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#60c0a0';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(160, 128, 224, 0.2)';
            ctx.beginPath();
            ctx.arc(cx2, cy2, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a080e0';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '16px Arial';
            ctx.fillText('A', cx1 - r - 20, cy1 + 5);
            ctx.fillText('B', cx2 + r + 15, cy2 + 5);
            
            const mode = Math.floor(p * 4);
            ctx.font = '14px Arial';
            const labels = ['A n B', 'A U B', 'A - B', '对称差'];
            ctx.fillText(labels[mode], w/2, 30);
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '12px Arial';
            ctx.fillText('元素数: 8个(A), 6个(B)', 20, h - 30);
        }

        function drawComplexity(ctx, w, h, p) {
            ctx.strokeStyle = 'rgba(100,140,180,0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (h / 10) * i);
                ctx.lineTo(w, (h / 10) * i);
                ctx.stroke();
            }
            
            const complexities = [
                { name: 'O(1)', color: '#60c0a0', y: 0 },
                { name: 'O(log n)', color: '#60c0f0', y: h * 0.2 },
                { name: 'O(n)', color: '#a080e0', y: h * 0.4 },
                { name: 'O(n log n)', color: '#e08060', y: h * 0.6 },
                { name: 'O(n2)', color: '#e060a0', y: h * 0.85 }
            ];
            
            complexities.forEach(c => {
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, c.y);
                ctx.lineTo(w, Math.min(c.y + p * h * 0.3, h - 20));
                ctx.stroke();
                
                ctx.fillStyle = c.color;
                ctx.font = '12px Arial';
                ctx.fillText(c.name, w - 60, c.y - 5);
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('当前展示: ' + (p * 100).toFixed(0) + '% 增长', 20, 30);
        }

        function drawDP(ctx, w, h, p) {
            const gridSize = 5;
            const cellSize = Math.min(w, h) / (gridSize + 2);
            const startX = cellSize;
            const startY = cellSize;
            
            for (let i = 0; i <= gridSize; i++) {
                for (let j = 0; j <= gridSize; j++) {
                    const x = startX + j * cellSize;
                    const y = startY + i * cellSize;
                    
                    const dist = Math.abs(i - j);
                    const opacity = Math.max(0.1, 1 - dist * 0.15 - (1 - p) * 0.5);
                    
                    ctx.fillStyle = `rgba(64, 192, 224, ${opacity})`;
                    ctx.fillRect(x, y, cellSize - 2, cellSize - 2);
                    ctx.strokeStyle = '#40c0e0';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, cellSize - 2, cellSize - 2);
                    
                    ctx.fillStyle = '#0a0e18';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(dist, x + cellSize/2 - 1, y + cellSize/2 + 4);
                    ctx.textAlign = 'left';
                }
            }
            
            ctx.strokeStyle = '#80e0c0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(startX + cellSize/2, startY + cellSize/2);
            for (let i = 0; i <= Math.floor(p * gridSize); i++) {
                const x = startX + (i + 0.5) * cellSize;
                const y = startY + (i + 0.5) * cellSize;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('状态数: ' + ((gridSize+1) * (gridSize+1)), 20, 30);
            ctx.fillText('最优路径步数: ' + Math.floor(p * gridSize), 20, 50);
        }

        function drawGreedy(ctx, w, h, p) {
            const intervals = [
                {start: 0, end: 3, profit: 30},
                {start: 2, end: 5, profit: 50},
                {start: 4, end: 7, profit: 40},
                {start: 6, end: 9, profit: 60},
                {start: 8, end: 11, profit: 35}
            ];
            
            const scale = w / 12;
            
            ctx.strokeStyle = 'rgba(100,140,180,0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * scale, 0);
                ctx.lineTo(i * scale, h);
                ctx.stroke();
            }
            
            const selected = Math.floor(p * intervals.length);
            intervals.forEach((iv, i) => {
                const isSelected = i < selected;
                const x = iv.start * scale;
                const width = (iv.end - iv.start) * scale;
                const y = 50 + i * 40;
                
                ctx.fillStyle = isSelected ? '#40c0e0' : 'rgba(64, 192, 224, 0.3)';
                ctx.fillRect(x, y, width, 25);
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.strokeRect(x, y, width, 25);
                
                ctx.fillStyle = '#0a0e18';
                ctx.font = '10px Arial';
                ctx.fillText(iv.profit, x + width/2 - 5, y + 17);
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '14px Arial';
            ctx.fillText('选择数量: ' + selected, 20, 30);
            ctx.fillText('总利润: ' + intervals.slice(0, selected).reduce((sum, iv) => sum + iv.profit, 0), 20, 50);
        }

        function drawDefault(ctx, w, h, p) {
            ctx.fillStyle = '#40c0e0';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('交互式演示区域', w/2, h/2);
            ctx.font = '14px Arial';
            ctx.fillText('调整滑块查看动态效果', w/2, h/2 + 30);
            ctx.textAlign = 'left';
        }

        document.getElementById('topicModal').addEventListener('click', (e) => {
            if (e.target.id === 'topicModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderKnowledgeGraph();
    </script>
</body>
