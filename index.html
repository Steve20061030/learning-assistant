<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLTutor - 个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #d0e0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 40px; }
        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: #80a0c0; font-size: 16px; }

        /* 导航标签 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 20px;
            background: rgba(60, 100, 160, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .tab:hover { background: rgba(80, 140, 200, 0.4); }
        .tab.active { background: rgba(60, 180, 220, 0.5); }

        /* 知识图谱 */
        .knowledge-graph {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { font-size: 18px; color: #a0c0e0; }
        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .legend-dot.level-1 { background: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; }
        .legend-dot.level-3 { background: #a080e0; }
        .legend-dot.level-4 { background: #e08060; }
        .legend-dot.level-5 { background: #e060a0; }

        /* 知识图谱节点 */
        .graph-nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .graph-node {
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            font-size: 14px;
        }
        .graph-node:hover { transform: translateY(-3px); }
        .graph-node.level-1 { background: rgba(100, 180, 140, 0.3); color: #80e0c0; border: 1px solid rgba(100, 180, 140, 0.3); }
        .graph-node.level-2 { background: rgba(100, 160, 220, 0.3); color: #80c0f0; border: 1px solid rgba(100, 160, 220, 0.3); }
        .graph-node.level-3 { background: rgba(180, 140, 220, 0.3); color: #a080e0; border: 1px solid rgba(180, 140, 220, 0.3); }
        .graph-node.level-4 { background: rgba(220, 140, 100, 0.3); color: #e08060; border: 1px solid rgba(220, 140, 100, 0.3); }
        .graph-node.level-5 { background: rgba(220, 100, 160, 0.3); color: #e060a0; border: 1px solid rgba(220, 100, 160, 0.3); }

        /* 课程卡片 */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .course-card {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(80, 120, 180, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }
        .course-card:hover {
            transform: translateY(-3px);
            border-color: rgba(100, 180, 220, 0.4);
            box-shadow: 0 10px 30px rgba(60, 140, 200, 0.1);
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .course-name { font-size: 18px; font-weight: 600; color: #d0e0f0; }
        .course-difficulty {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        .course-difficulty.easy { background: rgba(100, 180, 140, 0.3); color: #60c0a0; }
        .course-difficulty.medium { background: rgba(100, 160, 220, 0.3); color: #60c0f0; }
        .course-difficulty.hard { background: rgba(220, 140, 100, 0.3); color: #e08060; }
        .course-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .topic-tag {
            padding: 3px 10px;
            background: rgba(60, 80, 120, 0.5);
            border-radius: 10px;
            font-size: 12px;
            color: #a0c0e0;
        }

        /* 学习风格评估 */
        .learning-style-section {
            background: rgba(30, 40, 60, 0.6);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.2);
        }
        .style-title { font-size: 18px; color: #a0c0e0; margin-bottom: 20px; }
        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .style-card {
            background: rgba(60, 80, 120, 0.4);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .style-card:hover { transform: scale(1.05); }
        .style-icon { font-size: 28px; margin-bottom: 8px; }
        .style-name { font-size: 13px; color: #a0c0e0; }

        /* 雷达图 */
        .radar-container {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            position: relative;
        }
        .radar-bg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(100, 180, 140, 0.3) 0deg,
                rgba(100, 160, 220, 0.3) 60deg,
                rgba(180, 140, 220, 0.3) 120deg,
                rgba(220, 140, 100, 0.3) 180deg,
                rgba(220, 100, 160, 0.3) 240deg,
                rgba(200, 200, 100, 0.3) 300deg,
                rgba(100, 180, 140, 0.3) 360deg
            );
        }
        .radar-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(30, 40, 60, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
            color: #80a0c0;
        }

        /* 练习题册入口 */
        .exercise-section {
            background: linear-gradient(135deg, rgba(60, 180, 140, 0.2), rgba(60, 140, 180, 0.2));
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(60, 180, 140, 0.3);
        }
        .exercise-title { font-size: 20px; color: #80e0c0; margin-bottom: 10px; }
        .exercise-desc { color: #80a0c0; font-size: 14px; margin-bottom: 20px; }
        .exercise-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #40c0e0, #60c0a0);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .exercise-btn:hover { transform: scale(1.05); }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: linear-gradient(135deg, #1a1f35, #0f1623);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(80, 120, 180, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { font-size: 22px; color: #d0e0f0; }
        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #80a0c0;
        }
        .modal-body { color: #d0e0f0; }
        .info-box {
            background: rgba(60, 80, 120, 0.4);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .info-title { font-size: 14px; color: #80c0f0; margin-bottom: 8px; }
        .info-content { font-size: 13px; color: #a0c0e0; line-height: 1.6; }

        /* 页脚 */
        footer {
            text-align: center;
            margin-top: 40px;
            color: #6080a0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 MLTutor 个性化学习助手</h1>
            <p>基于学习风格的自适应学习平台</p>
        </header>

        <!-- 导航标签 -->
        <div class="tabs">
            <span class="tab active" onclick="showTab('knowledge')">📊 知识图谱</span>
            <span class="tab" onclick="showTab('courses')">📚 课程中心</span>
            <span class="tab" onclick="showTab('learning-style')">🎯 学习风格</span>
            <span class="tab" onclick="showTab('exercises')">✏️ 练习题册</span>
        </div>

        <!-- 知识图谱 -->
        <div id="knowledge" class="knowledge-graph">
            <div class="graph-header">
                <div class="graph-title">📊 知识体系图谱</div>
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot level-1"></span> 基础</span>
                    <span class="legend-item"><span class="legend-dot level-2"></span> 进阶</span>
                    <span class="legend-item"><span class="legend-dot level-3"></span> 高级</span>
                    <span class="legend-item"><span class="legend-dot level-4"></span> 深度学习</span>
                    <span class="legend-item"><span class="legend-dot level-5"></span> 专家级</span>
                </div>
            </div>
            <div class="graph-nodes" id="graphNodes">
                <!-- 节点由JS生成 -->
            </div>
        </div>

        <!-- 课程中心 -->
        <div id="courses" style="display: none;" class="courses-grid" id="coursesGrid">
            <!-- 课程卡片由JS生成 -->
        </div>

        <!-- 学习风格评估 -->
        <div id="learning-style" style="display: none;" class="learning-style-section">
            <div class="style-title">🎯 学习风格评估</div>
            <div class="style-grid">
                <div class="style-card" onclick="selectStyle('visual')">
                    <div class="style-icon">🎨</div>
                    <div class="style-name">视觉型</div>
                </div>
                <div class="style-card" onclick="selectStyle('verbal')">
                    <div class="style-icon">📖</div>
                    <div class="style-name">语言型</div>
                </div>
                <div class="style-card" onclick="selectStyle('logical')">
                    <div class="style-icon">🧮</div>
                    <div class="style-name">逻辑型</div>
                </div>
                <div class="style-card" onclick="selectStyle('practical')">
                    <div class="style-icon">🔧</div>
                    <div class="style-name">实践型</div>
                </div>
                <div class="style-card" onclick="selectStyle('social')">
                    <div class="style-icon">👥</div>
                    <div class="style-name">社交型</div>
                </div>
                <div class="style-card" onclick="selectStyle('solitary')">
                    <div class="style-icon">🙋</div>
                    <div class="style-name">自主型</div>
                </div>
            </div>
            <div class="radar-container">
                <div class="radar-bg"></div>
                <div class="radar-center">
                    点击上方<br/>选择学习风格
                </div>
            </div>
        </div>

        <!-- 练习题册入口 -->
        <div id="exercises" style="display: none;" class="exercise-section">
            <div class="exercise-title">✏️ 精选练习题册</div>
            <div class="exercise-desc">涵盖5门核心课程的精选题目，包含详细解析和个性化学习建议</div>
            <button class="exercise-btn" onclick="openExerciseBook()">📚 开始练习</button>
        </div>

        <!-- 课程详情模态框 -->
        <div class="modal-overlay" id="courseModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="courseModalTitle">课程详情</h3>
                    <span class="close-btn" onclick="closeModal('courseModal')">&times;</span>
                </div>
                <div class="modal-body" id="courseModalContent"></div>
            </div>
        </div>

        <!-- 知识点详情模态框 -->
        <div class="modal-overlay" id="topicModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="topicModalTitle">知识点详情</h3>
                    <span class="close-btn" onclick="closeModal('topicModal')">&times;</span>
                </div>
                <div class="modal-body" id="topicModalContent"></div>
            </div>
        </div>

        <footer>
            <p>MLTutor 个性化学习助手 | 基于学习风格的自适应学习平台</p>
        </footer>
    </div>

    <script>
        // 知识图谱数据
        const knowledgeNodes = [
            // AI数学思维
            { name: '人工智能概述', level: 1, category: 'ai_math', desc: 'AI发展历程与核心概念' },

            { name: '集合论', level: 1, category: 'discrete', desc: '集合运算与关系' },

            { name: '谓词逻辑', level: 2, category: 'discrete', desc: '量词与推理' },

            { name: '代数结构', level: 3, category: 'discrete', desc: '群、环、域' },
            // 计算机系统
            { name: '信息表示', level: 1, category: 'computer', desc: '二进制与编码' },
            { name: '浮点数', level: 2, category: 'computer', desc: 'IEEE 754标准' },

            { name: '虚拟内存', level: 3, category: 'computer', desc: '分页与分段' },

            { name: '动态规划', level: 3, category: 'algorithm', desc: '最优子结构与重叠子问题' },
            { name: '贪心算法', level: 3, category: 'algorithm', desc: '局部最优选择' },

            { name: 'NP问题', level: 5, category: 'algorithm', desc: '计算复杂性理论' }
        ];

        // 课程数据
        const courses = [
            {
                id: 'ai_math_thinking',
                name: '人工智能数学思维',
                difficulty: 'medium',
                topics: ['人工智能概述', '机器学习基础', '神经网络', '深度学习', '卷积神经网络'],

                prerequisites: ['编程基础']

            {

                name: '离散数学',
                difficulty: 'easy',
                topics: ['集合论', '图论', '命题逻辑', '谓词逻辑', '代数结构'],
                desc: '计算机科学的数学基础',

            },
            {

                topics: ['信息表示', '浮点数', '机器指令', '程序优化', '虚拟内存'],

            {

        // 知识点详情
        const topicDetails = {
            '人工智能概述': {

            },
            '命题逻辑': {
                concept: '命题逻辑是研究命题及其推理的逻辑分支。',
                questions: ['什么是命题？', '真值表的作用是什么？']
            },
            '谓词逻辑': {
                concept: '谓词逻辑扩展了命题逻辑，引入了量词和谓词。',
                questions: ['全称量词和存在量词的区别？', '如何进行谓词逻辑推理？']
            },
            '图论': {
                concept: '图论是研究图的性质和应用的数学分支。',
                questions: ['图的基本概念有哪些？', '欧拉图和哈密顿图的区别？']
            },
            '代数结构': {
                concept: '代数结构是带有运算的集合，如群、环、域等。',
                questions: ['什么是群？', '环和域的区别？']
            },
            '信息表示': {
                concept: '计算机中信息的表示方法，包括二进制、编码等。',
                questions: ['二进制如何表示负数？', 'ASCII码和Unicode的区别？']
            },
            '浮点数': {
                concept: '浮点数是用于表示实数的一种数据类型，遵循IEEE 754标准。',
                questions: ['浮点数的表示格式？', '为什么浮点数运算有精度问题？']
            },
            '机器指令': {
                concept: '机器指令是计算机能够直接执行的指令，由操作码和操作数组成。',
                questions: ['指令的基本格式？', '寻址方式有哪些？']
            },
            '程序优化': {
                concept: '通过各种技术提高程序的性能和效率。',
                questions: ['程序优化的基本原则？', '缓存优化的方法？']
            },
            '虚拟内存': {
                concept: '虚拟内存是操作系统提供的一种内存管理技术，将磁盘空间当作内存使用。',
                questions: ['分页和分段的区别？', '页面置换算法有哪些？']
            },
            '动态规划': {
                concept: '动态规划是一种将复杂问题分解为子问题来求解的算法设计方法。',
                questions: ['动态规划的适用条件？', '最优子结构和重叠子问题的含义？']
            },
            '贪心算法': {
                concept: '贪心算法在每一步都做出当前最优的选择，希望最终得到全局最优解。',
                questions: ['贪心算法的适用条件？', '与动态规划的区别？']
            },
            '复杂度分析': {
                concept: '复杂度分析用于评估算法的时间和空间效率。',
                questions: ['时间复杂度的表示方法？', '什么是NP问题？']
            },
            'Dijkstra': {
                concept: 'Dijkstra算法用于在加权图中寻找单源最短路径。',
                questions: ['Dijkstra算法的时间复杂度？', '能否处理负权边？']
            },
            'NP问题': {
                concept: 'NP问题是指可以在多项式时间内验证解的正确性但尚未找到多项式时间算法的问题。',
                questions: ['P问题和NP问题的区别？', '什么是NP完全问题？']
            }
        };

        // 渲染知识图谱
        function renderKnowledgeGraph() {
            const container = document.getElementById('graphNodes');
            container.innerHTML = knowledgeNodes.map(node => `
                <div class="graph-node level-${node.level}" onclick="openTopicDetail('${node.name}')" title="${node.desc}">
                    ${node.name}
                </div>
            `).join('');
        }

        // 渲染课程卡片
        function renderCourses() {
            const container = document.getElementById('courses');
            container.innerHTML = courses.map(course => `
                <div class="course-card" onclick="openCourseDetail('${course.id}')">
                    <div class="course-header">
                        <span class="course-name">${course.name}</span>
                        <span class="course-difficulty ${course.difficulty}">${course.difficulty === 'easy' ? '简单' : course.difficulty === 'medium' ? '中等' : '困难'}</span>
                    </div>
                    <div style="color:#80a0c0;font-size:13px;margin-bottom:10px;">${course.desc}</div>
                    <div style="color:#6080a0;font-size:12px;">预计学习时间: ${course.estimatedTime}分钟</div>
                    <div class="course-topics">
                        ${course.topics.map(t => `<span class="topic-tag">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 切换标签
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('knowledge').style.display = tabName === 'knowledge' ? 'block' : 'none';
            document.getElementById('courses').style.display = tabName === 'courses' ? 'grid' : 'none';
            document.getElementById('learning-style').style.display = tabName === 'learning-style' ? 'block' : 'none';
            document.getElementById('exercises').style.display = tabName === 'exercises' ? 'block' : 'none';
        }

        // 打开课程详情
        function openCourseDetail(courseId) {
            const course = courses.find(c => c.id === courseId);
            if (!course) return;
            
            document.getElementById('courseModalTitle').textContent = course.name;
            document.getElementById('courseModalContent').innerHTML = `
                <div class="info-box">
                    <div class="info-title">📖 课程简介</div>
                    <div class="info-content">${course.desc}</div>
                </div>
                <div class="info-box">
                    <div class="info-title">⏱️ 预计学习时间</div>
                    <div class="info-content">${course.estimatedTime}分钟</div>
                </div>
                <div class="info-box">
                    <div class="info-title">📊 难度等级</div>
                    <div class="info-content">${course.difficulty === 'easy' ? '简单' : course.difficulty === 'medium' ? '中等' : '困难'}</div>
                </div>
                <div class="info-box">
                    <div class="info-title">📚 学习内容</div>
                    <div class="info-content">${course.topics.join(' → ')}</div>
                </div>
                <div class="info-box">
                    <div class="info-title">📋 前置知识</div>
                    <div class="info-content">${course.prerequisites.length > 0 ? course.prerequisites.join('、') : '无'}</div>
                </div>
            `;
            document.getElementById('courseModal').style.display = 'flex';
        }

        // 打开知识点详情
        function openTopicDetail(topicName) {
            const detail = topicDetails[topicName];
            if (!detail) return;
            
            document.getElementById('topicModalTitle').textContent = topicName;
            document.getElementById('topicModalContent').innerHTML = `
                <div class="info-box">
                    <div class="info-title">💡 核心概念</div>
                    <div class="info-content">${detail.concept}</div>
                </div>
                <div class="info-box">
                    <div class="info-title">🤔 思考题</div>
                    <div class="info-content">
                        ${detail.questions.map((q, i) => `${i+1}. ${q}`).join('<br/>')}
                    </div>
                </div>
            `;
            document.getElementById('topicModal').style.display = 'flex';
        }

        // 选择学习风格
        function selectStyle(style) {
            const styleNames = {
                visual: '视觉型学习者',
                verbal: '语言型学习者',
                logical: '逻辑型学习者',
                practical: '实践型学习者',
                social: '社交型学习者',
                solitary: '自主型学习者'
            };
            
            const suggestions = {
                visual: '建议：多使用图表、思维导图、视频教程进行学习',
                verbal: '建议：多阅读教材、笔记，通过文字理解概念',
                logical: '建议：注重理论推导，通过数学证明加深理解',
                practical: '建议：多进行实践操作，通过代码实现巩固知识',
                social: '建议：参与学习小组，通过讨论交流加深理解',
                solitary: '建议：制定个人学习计划，独立深入研究'
            };

            alert(`${styleNames[style]}\n\n${suggestions[style]}`);
        }

        // 打开练习题册
        function openExerciseBook() {
            window.open('learning-terminal.html', '_blank');
        }

        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 点击模态框外部关闭
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });

        // 初始化
        renderKnowledgeGraph();
        renderCourses();
    </script>
</body>
</html>
