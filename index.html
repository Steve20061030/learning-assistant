<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #e0f0ff;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        header { 
            text-align: center; 
            padding: 60px 20px 30px;
            position: relative;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #40c0e0, transparent);
        }
        header h1 {
            font-size: 56px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0, #a080e0, #40c0e0);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            text-shadow: 0 0 60px rgba(64, 192, 224, 0.3);
            letter-spacing: 4px;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }
        header p { 
            color: #80b0d0; 
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .knowledge-graph {
            background: rgba(30, 40, 60, 0.7);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { 
            font-size: 24px; 
            color: #a0c0e0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .legend { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            font-size: 14px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }
        .legend-item { 
            display: flex; 
            align-items: center; 
            gap: 10px;
            padding: 6px 12px;
            background: rgba(60, 100, 160, 0.2);
            border-radius: 20px;
            transition: all 0.3s;
        }
        .legend-item:hover {
            background: rgba(60, 100, 160, 0.4);
            transform: translateY(-2px);
        }
        .legend-dot { 
            width: 16px; 
            height: 16px; 
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        .legend-dot.level-1 { background: #60c0a0; color: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; color: #60c0f0; }
        .legend-dot.level-3 { background: #a080e0; color: #a080e0; }
        .legend-dot.level-4 { background: #e08060; color: #e08060; }
        .legend-dot.level-5 { background: #e060a0; color: #e060a0; }

        .graph-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 18px;
            justify-items: center;
        }
        .graph-node {
            padding: 16px 24px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            text-align: center;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .graph-node::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .graph-node:hover::before {
            left: 100%;
        }
        .graph-node:hover { 
            transform: translateY(-8px) scale(1.05); 
            z-index: 10;
            box-shadow: 0 20px 40px rgba(64, 192, 224, 0.3);
        }
        .graph-node.level-1 { 
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.25), rgba(96, 192, 160, 0.1)); 
            color: #60c0a0; 
            border-color: rgba(96, 192, 160, 0.6);
        }
        .graph-node.level-2 { 
            background: linear-gradient(135deg, rgba(96, 192, 240, 0.25), rgba(96, 192, 240, 0.1)); 
            color: #60c0f0; 
            border-color: rgba(96, 192, 240, 0.6);
        }
        .graph-node.level-3 { 
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.25), rgba(160, 128, 224, 0.1)); 
            color: #a080e0; 
            border-color: rgba(160, 128, 224, 0.6);
        }
        .graph-node.level-4 { 
            background: linear-gradient(135deg, rgba(224, 128, 96, 0.25), rgba(224, 128, 96, 0.1)); 
            color: #e08060; 
            border-color: rgba(224, 128, 96, 0.6);
        }
        .graph-node.level-5 { 
            background: linear-gradient(135deg, rgba(224, 96, 160, 0.25), rgba(224, 96, 160, 0.1)); 
            color: #e060a0; 
            border-color: rgba(224, 96, 160, 0.6);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 24, 0.98);
            display: none;
            flex-direction: column;
            z-index: 1000;
            padding: 30px;
            backdrop-filter: blur(20px);
            overflow-y: auto;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 30px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(80, 120, 180, 0.3);
        }
        .modal-header h3 { 
            font-size: 32px; 
            color: #f0f8ff;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .close-btn {
            font-size: 40px;
            cursor: pointer;
            color: #80a0c0;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .close-btn:hover { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .content-card {
            background: linear-gradient(135deg, rgba(40, 55, 80, 0.6), rgba(25, 35, 55, 0.4));
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            border: 1px solid rgba(80, 120, 180, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        .content-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        .card-title {
            font-size: 20px;
            color: #40c0e0;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .card-content {
            color: #c0d0e0;
            line-height: 1.8;
            font-size: 16px;
        }
        .card-content p {
            margin-bottom: 12px;
            text-align: justify;
        }
        .card-content p:last-child {
            margin-bottom: 0;
        }

        .slider-section { margin-top: 25px; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            color: #a0c0e0;
        }
        .slider-value {
            color: #40c0e0;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 18px;
        }
        input[type="range"] {
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, rgba(60, 100, 160, 0.6), rgba(64, 192, 224, 0.3));
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #40c0e0, #80e0c0);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(64, 192, 224, 0.5);
            transition: all 0.3s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(64, 192, 224, 0.7);
        }

        .related-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }
        .related-tag {
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.2), rgba(140, 100, 200, 0.1));
            border-radius: 25px;
            font-size: 14px;
            color: #b090f0;
            border: 1px solid rgba(180, 140, 220, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }
        .related-tag:hover { 
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.35), rgba(140, 100, 200, 0.25));
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(160, 128, 224, 0.35);
        }

        .formula-box {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(20, 30, 50, 0.4));
            padding: 24px;
            border-radius: 14px;
            border-left: 5px solid #40c0e0;
            font-family: 'Consolas', 'Monaco', 'Microsoft YaHei', monospace;
            font-size: 17px;
            color: #c0e0f0;
            white-space: pre-wrap;
            line-height: 2;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(64, 192, 224, 0.2);
            transition: all 0.3s;
        }
        .stat-card:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(64, 192, 224, 0.4);
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 13px;
            color: #80a0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scenario-tag {
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.2), rgba(96, 192, 160, 0.1));
            border-radius: 18px;
            font-size: 14px;
            color: #70d0b0;
            border: 1px solid rgba(96, 192, 160, 0.3);
            transition: all 0.3s;
        }
        .scenario-tag:hover {
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.3), rgba(96, 192, 160, 0.15));
            transform: translateY(-2px);
        }

        .intuition-box {
            background: linear-gradient(135deg, rgba(60, 140, 200, 0.2), rgba(60, 140, 200, 0.1));
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            border-left: 4px solid #40c0e0;
        }
        .intuition-box strong {
            color: #50d0f0;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            color: #6080a0;
            font-size: 15px;
            border-top: 1px solid rgba(80, 120, 180, 0.2);
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 36px; letter-spacing: 2px; }
            header p { font-size: 16px; }
            .graph-container { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
            .graph-node { padding: 12px 16px; font-size: 13px; }
            .modal-header h3 { font-size: 24px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 个性化学习助手</h1>
            <p>基于学习风格的自适应学习平台</p>
        </header>

        <div class="knowledge-graph">
            <div class="graph-header">
                <div class="graph-title">📊 知识体系图谱（共25个知识点）</div>
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot level-1"></span> 基础</span>
                    <span class="legend-item"><span class="legend-dot level-2"></span> 进阶</span>
                    <span class="legend-item"><span class="legend-dot level-3"></span> 高级</span>
                    <span class="legend-item"><span class="legend-dot level-4"></span> 深度学习</span>
                    <span class="legend-item"><span class="legend-dot level-5"></span> 专家级</span>
                </div>
            </div>
            <div class="graph-container" id="graphNodes"></div>
        </div>

        <div class="modal-overlay" id="topicModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modalTitle">知识点详情</h3>
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                </div>
                <div id="modalContent" style="padding-top: 10px;"></div>
            </div>
        </div>

        <footer>
            <p>个性化学习助手 | 基于学习风格的自适应学习平台</p>
        </footer>
    </div>

    <script>
        const knowledgeNodes = [
            { name: '线性回归', level: 1, category: 'ai' },
            { name: '逻辑回归', level: 1, category: 'ai' },
            { name: 'KNN', level: 1, category: 'ai' },
            { name: '机器学习基础', level: 2, category: 'ai' },
            { name: '决策树', level: 2, category: 'ai' },
            { name: '神经网络', level: 3, category: 'ai' },
            { name: 'SVM', level: 3, category: 'ai' },
            { name: '随机森林', level: 3, category: 'ai' },
            { name: '深度学习', level: 4, category: 'ai' },
            { name: '卷积神经网络', level: 4, category: 'ai' },
            { name: '栈和队列', level: 1, category: 'ds' },
            { name: '链表', level: 1, category: 'ds' },
            { name: '树结构', level: 2, category: 'ds' },
            { name: '排序算法', level: 2, category: 'ds' },
            { name: '查找算法', level: 2, category: 'ds' },
            { name: '图算法', level: 3, category: 'ds' },
            { name: '集合论', level: 1, category: 'math' },
            { name: '命题逻辑', level: 1, category: 'math' },
            { name: '谓词逻辑', level: 2, category: 'math' },
            { name: '图论', level: 2, category: 'math' },
            { name: '信息表示', level: 1, category: 'sys' },
            { name: '浮点数', level: 2, category: 'sys' },
            { name: '动态规划', level: 3, category: 'algo' },
            { name: '贪心算法', level: 3, category: 'algo' },
            { name: '复杂度分析', level: 2, category: 'algo' }
        ];

        const topicDetails = {
            '线性回归': {
                level: 1,
                definition: '线性回归是最基础的机器学习算法之一。它的目标是找到一条最佳直线（或超平面），用来描述因变量和自变量之间的线性关系。通过最小化预测值与实际值之间的均方误差来训练模型。',
                intuition: '想象你在散点图中画一条线，让所有点到这条线的距离平方和最小。这条线就是最佳拟合线，能够最好地代表数据的趋势。',
                formula: 'ŷ = w₁x₁ + w₂x₂ + ... + wₙxₙ + b\n= Σwᵢxᵢ + b',
                loss: 'J(w,b) = (1/(2n)) Σ(yᵢ - ŷᵢ)²',
                scenarios: ['房价预测', '销量预测', '成绩预测', '温度预测'],
                related: ['逻辑回归', '岭回归', 'SVM', '多元线性回归'],
                hasVisualization: true,
                vizType: 'regression',
                history: '线性回归由弗朗西斯·高尔顿在19世纪末提出，用于研究父子身高关系。后来被卡尔·皮尔逊发展完善，成为统计学的核心方法。',
                limitations: '只能捕捉线性关系，对异常值敏感，需要假设数据服从正态分布，无法处理非线性问题。',
                stats: { accuracy: 92, complexity: 'O(n)', usage: '广泛' }
            },
            '逻辑回归': {
                level: 1,
                definition: '逻辑回归是一种用于二分类问题的监督学习算法，输出概率值表示样本属于某一类的可能性。通过sigmoid函数将线性组合映射到0-1区间。',
                intuition: '在线性回归的基础上，使用sigmoid函数将输出压缩到0-1之间，表示样本属于正类的概率。概率大于0.5则预测为正类，否则为负类。',
                formula: 'σ(z) = 1 / (1 + e^(-z))\n其中 z = w·x + b',
                loss: '交叉熵损失: L = -[y·log(ŷ) + (1-y)·log(1-ŷ)]',
                scenarios: ['垃圾邮件检测', '疾病诊断', '信用评分', '欺诈检测'],
                related: ['线性回归', 'SVM', '神经网络', 'Softmax回归'],
                hasVisualization: true,
                vizType: 'sigmoid',
                history: '逻辑回归由统计学家大卫·考克斯在1958年提出，最初用于生物统计分析，现已成为分类问题的标准方法。',
                limitations: '只能处理二分类问题，对特征线性可分假设较强，无法直接处理多分类问题（需扩展为Softmax回归）。',
                stats: { accuracy: 88, complexity: 'O(n)', usage: '广泛' }
            },
            'KNN': {
                level: 1,
                definition: 'K近邻算法是一种简单的监督学习算法，通过找到最近的K个邻居来进行分类或回归。分类时采用多数投票，回归时采用平均。',
                intuition: '物以类聚，人以群分。一个样本的类别由它周围最近的K个邻居投票决定，距离越近的邻居权重越高。',
                formula: '欧氏距离: d(x,y) = √Σ(xᵢ - yᵢ)²\n曼哈顿距离: d(x,y) = Σ|xᵢ - yᵢ|',
                scenarios: ['推荐系统', '图像分类', '异常检测', '手写识别'],
                related: ['决策树', 'K-Means', 'SVM', '距离度量学习'],
                hasVisualization: true,
                vizType: 'knn',
                history: 'KNN算法由Cover和Hart在1967年正式提出，是最经典的机器学习算法之一，因其简单直观而被广泛应用。',
                limitations: '计算复杂度高（预测时需遍历所有样本），需要大量内存，K值选择敏感，对高维数据效果差。',
                stats: { accuracy: 85, complexity: 'O(n)', usage: '中等' }
            },
            '机器学习基础': {
                level: 2,
                definition: '机器学习是人工智能的一个分支，它使计算机能够从数据中学习模式，而无需显式编程。主要分为监督学习、无监督学习和强化学习三大类。',
                intuition: '让计算机像人类一样从经验中学习，通过大量数据训练模型来做出预测或决策，而不是编写固定的规则。',
                formula: '模型: y = f(x; θ)\n学习目标: min_θ L(f(x;θ), y)',
                scenarios: ['图像识别', '自然语言处理', '推荐系统', '自动驾驶'],
                related: ['神经网络', '深度学习', '监督学习', '无监督学习'],
                hasVisualization: false,
                history: '1959年，Arthur Samuel编写了第一个跳棋程序，标志着机器学习的诞生。1997年IBM深蓝击败国际象棋世界冠军。',
                limitations: '需要大量标注数据，模型可解释性差，容易过拟合，对数据质量要求高。',
                stats: { accuracy: '-', complexity: 'Varies', usage: '核心' }
            },
            '决策树': {
                level: 2,
                definition: '决策树是一种树形结构的分类和回归模型，通过递归划分特征空间来进行决策。每个内部节点代表一个特征上的判断条件，叶节点代表类别或回归值。',
                intuition: '就像玩20问游戏，每次根据一个特征进行提问（如"年龄是否大于30？"），逐步缩小范围直到得到答案。',
                formula: '信息增益 = 熵(父节点) - Σ(权重)×熵(子节点)\n熵 H(S) = -Σpᵢ×log₂(pᵢ)',
                scenarios: ['信用评分', '医疗诊断', '客户流失预测', '故障诊断'],
                related: ['随机森林', 'XGBoost', '梯度提升树', '决策规则'],

        function drawVisualization(topicName, value) {
            const canvas = document.getElementById('vizCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            canvas.width = width;
            canvas.height = height;
            
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(100,140,180,0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (height / 10) * i);
                ctx.lineTo(width, (height / 10) * i);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo((width / 10) * i, 0);
                ctx.lineTo((width / 10) * i, height);
                ctx.stroke();
            }
            
            const param = value / 100;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            switch(topicName) {
                case '线性回归':
                    drawRegression(ctx, width, height, param);
                    break;
                case '逻辑回归':
                    drawSigmoid(ctx, width, height, param);
                    break;
                case 'KNN':
                    drawKNN(ctx, width, height, param);
                    break;
                case '神经网络':
                    drawNeuralNetwork(ctx, width, height, param);
                    break;
                case 'SVM':
                    drawSVM(ctx, width, height, param);
                    break;
                case '栈和队列':

                    break;
                case '链表':

                    break;
                case '树结构':
                    drawTree(ctx, width, height, param);
                    break;
                case '排序算法':
                    drawSorting(ctx, width, height, param);
                    break;
                case '查找算法':
                    drawSearch(ctx, width, height, param);
                    break;
                case '集合论':
                    drawSetOperations(ctx, width, height, param);
                    break;
                case '复杂度分析':
                    drawComplexity(ctx, width, height, param);
                    break;
                case '动态规划':
                    drawDP(ctx, width, height, param);
                    break;

                    break;
                case '谓词逻辑':

        function drawRegression(ctx, w, h, p) {
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const slope = -0.4 + p * 0.8;
            const intercept = h * 0.6;
            ctx.moveTo(50, intercept);
            ctx.lineTo(w - 50, intercept - (w - 100) * slope);
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('y = ' + slope.toFixed(2) + 'x + ' + (intercept/h).toFixed(2), 20, 35);
            
            for (let i = 0; i < 25; i++) {
                const x = 50 + (w - 100) * (i / 24);
                const noise = (1 - p) * 40 * Math.sin(i * 0.4);
                const y = intercept - (x - 50) * slope + noise + (Math.random() - 0.5) * 20;
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 8);
                gradient.addColorStop(0, '#80e0c0');
                gradient.addColorStop(1, 'rgba(96, 192, 160, 0.3)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawSigmoid(ctx, w, h, p) {
            const gradient = ctx.createLinearGradient(0, 0, w, 0);
            gradient.addColorStop(0, '#40c0e0');
            gradient.addColorStop(1, '#80e0c0');
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            for (let x = 0; x <= w; x++) {
                const z = (x - w/2) / (w/4) * (1 + p);
                const y = h - h / (1 + Math.exp(-z));
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.fillRect(w/2 - 2, h/2 - 5, 4, 10);
            ctx.font = 'bold 14px Arial';
            ctx.fillText('阈值: 0.5', 20, 35);
            ctx.fillText('陡峭度: ' + (1 + p).toFixed(2), 20, 55);
        }

        function drawKNN(ctx, w, h, p) {
            const k = Math.floor(1 + p * 9);
            const points = [];
            for (let i = 0; i < 30; i++) {
                points.push({
                    x: Math.random() * (w - 100) + 50,
                    y: Math.random() * (h - 100) + 50,
                    class: Math.random() > 0.5 ? 0 : 1
                });
            }
            
            points.forEach(pt => {
                ctx.fillStyle = pt.class === 0 ? '#60c0a0' : '#e060a0';
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });
            
            const targetX = w/2;
            const targetY = h/2;
            const distances = points.map(pt => ({
                ...pt,
                dist: Math.sqrt((pt.x - targetX)*(pt.x - targetX) + (pt.y - targetY)*(pt.y - targetY))
            })).sort((a, b) => a.dist - b.dist);
            
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            distances.slice(0, k).forEach(pt => {
                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                ctx.lineTo(pt.x, pt.y);
                ctx.stroke();
            });
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#40c0e0';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.font = 'bold 14px Arial';
            ctx.fillText('K = ' + k, 20, 35);
            ctx.fillText('红色邻居: ' + distances.slice(0, k).filter(p => p.class === 1).length, 20, 55);
        }

        function drawNeuralNetwork(ctx, w, h, p) {
            const layers = 4;
            const nodes = [3, 5, 4, 2];
            const layerX = [];
            for (let i = 0; i < layers; i++) {
                layerX.push((w / (layers + 1)) * (i + 1));
            }
            
            for (let i = 0; i < layers - 1; i++) {
                for (let j = 0; j < nodes[i]; j++) {
                    const y1 = (h / (nodes[i] + 1)) * (j + 1);
                    for (let k = 0; k < nodes[i+1]; k++) {
                        const y2 = (h / (nodes[i+1] + 1)) * (k + 1);
                        const opacity = 0.2 + p * 0.4 * Math.random();
                        ctx.strokeStyle = `rgba(64, 192, 224, ${opacity})`;
                        ctx.lineWidth = 1 + p * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(layerX[i], y1);
                        ctx.lineTo(layerX[i+1], y2);
                        ctx.stroke();
                    }
                }
            }
            
            for (let i = 0; i < layers; i++) {
                for (let j = 0; j < nodes[i]; j++) {
                    const y = (h / (nodes[i] + 1)) * (j + 1);
                    const radius = 12 + p * 6;
                    ctx.fillStyle = `rgba(64, 192, 224, ${0.5 + p * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(layerX[i], y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#40c0e0';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('隐藏层数: ' + (layers - 2), 20, 35);
            ctx.fillText('激活强度: ' + (p * 100).toFixed(0) + '%', 20, 55);
        }

        function drawSVM(ctx, w, h, p) {
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * (w/2 - 100) + 50;
                const y = Math.random() * (h - 100) + 50;
                ctx.fillStyle = '#60c0a0';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * (w/2 - 100) + w/2 + 50;
                const y = Math.random() * (h - 100) + 50;
                ctx.fillStyle = '#e060a0';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const marginWidth = 20 + p * 50;
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(w/2 - marginWidth, 30);
            ctx.lineTo(w/2 - marginWidth, h - 30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(w/2 + marginWidth, 30);
            ctx.lineTo(w/2 + marginWidth, h - 30);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(w/2, 30);
            ctx.lineTo(w/2, h - 30);
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('间隔宽度: ' + (marginWidth * 2).toFixed(0), 20, 35);
            ctx.fillText('支持向量: 4个', 20, 55);
        }

        function drawStackQueue(ctx, w, h, p) {
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('栈 (LIFO)', 50, 35);
            ctx.fillText('队列 (FIFO)', w/2 + 50, 35);
            
            ctx.strokeStyle = '#60c0a0';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const y = h - 60 - i * 40;
                ctx.strokeRect(30, y, 100, 30);
                if (i < 4 - Math.floor(p * 5)) {
                    ctx.fillStyle = '#60c0a0';
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(['A', 'B', 'C', 'D', 'E'][i], 68, y + 22);
                }
            }
            
            ctx.fillStyle = '#e060a0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('TOP →', 5, h - 60 - (4 - Math.floor(p * 5)) * 40 + 22);
            
            for (let i = 0; i < 5; i++) {
                const x = w/2 + 30 + i * 24;
                const y = h - 60;
                ctx.strokeStyle = '#a080e0';
                ctx.strokeRect(x, y, 22, 60);
                if (i < Math.floor(p * 5)) {
                    ctx.fillStyle = '#a080e0';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(['1', '2', '3', '4', '5'][i], x + 7, y + 38);
                }
            }
            
            ctx.fillStyle = '#a080e0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('→ 入口', w/2 + 30 - 45, h - 75);
            ctx.fillText('出口 →', w/2 + 30 + 5 * 24 + 15, h - 75);
        }

        function drawLinkedList(ctx, w, h, p) {
            const nodeCount = 5 + Math.floor(p * 4);
            const nodeWidth = 65;
            const nodeHeight = 45;
            const gap = (w - 100) / nodeCount;
            
            for (let i = 0; i < nodeCount; i++) {
                const x = 50 + i * gap;
                const y = h/2 - nodeHeight/2;
                
                ctx.fillStyle = '#1a1f35';
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, nodeWidth, nodeHeight);
                ctx.strokeRect(x, y, nodeWidth, nodeHeight);
                
                ctx.fillStyle = '#40c0e0';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(String(i + 1), x + nodeWidth/2 - 6, y + nodeHeight/2 + 6);
                
                if (i < nodeCount - 1) {
                    ctx.strokeStyle = '#40c0e0';
                    ctx.beginPath();
                    ctx.moveTo(x + nodeWidth, y + nodeHeight/2);
                    ctx.lineTo(x + nodeWidth + gap/2, y + nodeHeight/2);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(x + nodeWidth + gap/2 - 6, y + nodeHeight/2 - 6);
                    ctx.lineTo(x + nodeWidth + gap/2, y + nodeHeight/2);
                    ctx.lineTo(x + nodeWidth + gap/2 - 6, y + nodeHeight/2 + 6);
                    ctx.stroke();
                }
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.beginPath();
            ctx.arc(50 + nodeCount * gap - nodeWidth + nodeWidth/2, h/2 + 55, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = 'bold 12px Arial';
            ctx.fillText('NULL', 50 + nodeCount * gap - nodeWidth + nodeWidth/2 + 12, h/2 + 60);
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('节点数: ' + nodeCount, 20, 35);
            ctx.fillText('结构: 单链表', 20, 55);
        }

        function drawTree(ctx, w, h, p) {
            const depth = 2 + Math.floor(p * 3);
            
            function drawNode(x, y, level, angle) {
                if (level >= depth) return;
                
                const childGap = angle * (w / Math.pow(2, level + 1)) * 0.8;
                
                ctx.fillStyle = '#40c0e0';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#0a0e18';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(level === 0 ? '根' : 'N' + level, x, y + 5);
                ctx.textAlign = 'left';
                
                const y2 = y + 65;
                const x1 = x - childGap;
                const x2 = x + childGap;
                
                if (level < depth - 1) {
                    ctx.strokeStyle = 'rgba(64, 192, 224, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y + 20);
                    ctx.lineTo(x1, y2 - 15);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y + 20);
                    ctx.lineTo(x2, y2 - 15);
                    ctx.stroke();
                    
                    drawNode(x1, y2, level + 1, angle / 2);
                    drawNode(x2, y2, level + 1, angle / 2);
                }
            }
            
            drawNode(w/2, 55, 0, Math.PI / 3);
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('深度: ' + (depth - 1), 20, 35);
            ctx.fillText('节点数: ' + (Math.pow(2, depth) - 1), 20, 55);
        }

        function drawSorting(ctx, w, h, p) {
            const bars = 20;
            const heights = [];
            for (let i = 0; i < bars; i++) {
                heights.push(Math.random() * 0.7 + 0.3);
            }
            
            const sortedCount = Math.floor(p * bars);
            const barWidth = (w - 40) / bars;
            
            for (let i = 0; i < bars; i++) {
                const barHeight = heights[i] * (h - 70);
                const x = 20 + i * barWidth;
                const y = h - 35 - barHeight;
                
                if (i < sortedCount) {
                    const gradient = ctx.createLinearGradient(x, y, x, h);
                    gradient.addColorStop(0, '#40c0e0');
                    gradient.addColorStop(1, '#80e0c0');
                    ctx.fillStyle = gradient;
                } else {
                    ctx.fillStyle = 'rgba(224, 128, 96, 0.7)';
                }
                
                ctx.fillRect(x + 2, y, barWidth - 4, barHeight);
                
                if (i === sortedCount - 1 && sortedCount > 0) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 2, y, barWidth - 4, barHeight);
                }
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('已排序: ' + sortedCount + '/' + bars, 20, 35);
            ctx.fillText('算法: 快速排序', 20, 55);
        }

        function drawSearch(ctx, w, h, p) {
            const arr = [10, 25, 30, 45, 55, 68, 72, 85, 90, 95];
            const target = 55;
            const searchIndex = Math.floor(p * (arr.length + 1));
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('二分查找目标: ' + target, 20, 35);
            
            const boxWidth = 55;
            const startX = (w - arr.length * boxWidth) / 2;
            
            for (let i = 0; i < arr.length; i++) {
                const x = startX + i * boxWidth;
                
                ctx.strokeStyle = i === searchIndex ? '#ffffff' : 'rgba(64, 192, 224, 0.4)';
                ctx.lineWidth = i === searchIndex ? 3 : 1;
                ctx.strokeRect(x, h/2 - 22, boxWidth - 5, 44);
                
                ctx.fillStyle = i === searchIndex ? '#40c0e0' : '#a0c0e0';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(arr[i], x + boxWidth/2 - 3, h/2 + 5);
                ctx.fillText('[' + i + ']', x + boxWidth/2 - 8, h/2 + 28);
                ctx.textAlign = 'left';
            }
            
            if (searchIndex < arr.length && arr[searchIndex] === target) {
                ctx.fillStyle = '#80e0c0';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('✅ 找到!', w/2, h/2 + 75);
                ctx.textAlign = 'left';
            } else if (searchIndex >= arr.length) {
                ctx.fillStyle = '#e08060';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('❌ 未找到', w/2, h/2 + 75);
                ctx.textAlign = 'left';
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('查找次数: ' + Math.ceil(Math.log2(arr.length)), 20, 55);
        }

        function drawSetOperations(ctx, w, h, p) {
            const cx1 = w/3;
            const cy1 = h/2;
            const cx2 = 2*w/3;
            const cy2 = h/2;
            const r = 100;
            
            ctx.fillStyle = 'rgba(96, 192, 160, 0.25)';
            ctx.beginPath();
            ctx.arc(cx1, cy1, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#60c0a0';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(160, 128, 224, 0.25)';
            ctx.beginPath();
            ctx.arc(cx2, cy2, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#a080e0';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('A', cx1 - r - 25, cy1 + 8);
            ctx.fillText('B', cx2 + r + 20, cy2 + 8);
            
            const mode = Math.floor(p * 4);
            const labels = ['交集 A ∩ B', '并集 A ∪ B', '差集 A - B', '对称差'];
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(labels[mode], w/2, 35);
            ctx.textAlign = 'left';
            
            if (mode === 0) {
                ctx.fillStyle = 'rgba(128, 160, 192, 0.4)';
                ctx.beginPath();
                ctx.arc(cx1, cy1, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx2, cy2, r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('元素数: |A|=8, |B|=6', 20, h - 35);
        }

        function drawComplexity(ctx, w, h, p) {
            ctx.strokeStyle = 'rgba(100,140,180,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (h / 10) * i);
                ctx.lineTo(w, (h / 10) * i);
                ctx.stroke();
            }
            
            const complexities = [
                { name: 'O(1)', color: '#60c0a0', growth: 0 },
                { name: 'O(log n)', color: '#60c0f0', growth: 0.15 },
                { name: 'O(n)', color: '#a080e0', growth: 0.3 },
                { name: 'O(n log n)', color: '#e08060', growth: 0.5 },
                { name: 'O(n²)', color: '#e060a0', growth: 0.8 }
            ];
            
            complexities.forEach(c => {
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, h * 0.8);
                const endY = Math.max(h * 0.1, h * 0.8 - p * h * c.growth * 3);
                ctx.lineTo(w, endY);
                ctx.stroke();
                
                ctx.fillStyle = c.color;
                ctx.font = 'bold 12px Arial';
                ctx.fillText(c.name, w - 70, endY - 8);
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('数据规模: ' + (p * 100).toFixed(0) + '%', 20, 35);
        }

        function drawDP(ctx, w, h, p) {
            const gridSize = 5;
            const cellSize = Math.min(w, h) / (gridSize + 2);
            const startX = cellSize;
            const startY = cellSize;
            
            for (let i = 0; i <= gridSize; i++) {
                for (let j = 0; j <= gridSize; j++) {
                    const x = startX + j * cellSize;
                    const y = startY + i * cellSize;
                    
                    const dist = Math.abs(i - j);
                    const opacity = Math.max(0.1, 1 - dist * 0.15 - (1 - p) * 0.5);
                    
                    ctx.fillStyle = `rgba(64, 192, 224, ${opacity})`;
                    ctx.fillRect(x, y, cellSize - 2, cellSize - 2);
                    ctx.strokeStyle = '#40c0e0';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, cellSize - 2, cellSize - 2);
                    
                    ctx.fillStyle = '#0a0e18';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(dist.toString(), x + cellSize/2 - 2, y + cellSize/2 + 5);
                    ctx.textAlign = 'left';
                }
            }
            
            ctx.strokeStyle = '#80e0c0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(startX + cellSize/2, startY + cellSize/2);
            for (let i = 0; i <= Math.floor(p * gridSize); i++) {
                const x = startX + (i + 0.5) * cellSize;
                const y = startY + (i + 0.5) * cellSize;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('状态数: ' + ((gridSize+1) * (gridSize+1)), 20, 35);
            ctx.fillText('最优路径步数: ' + Math.floor(p * gridSize), 20, 55);
        }

        function drawGreedy(ctx, w, h, p) {
            const intervals = [
                {start: 0, end: 3, profit: 30},
                {start: 2, end: 5, profit: 50},
                {start: 4, end: 7, profit: 40},
                {start: 6, end: 9, profit: 60},
                {start: 8, end: 11, profit: 35}
            ];
            
            const scale = w / 12;
            
            ctx.strokeStyle = 'rgba(100,140,180,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * scale, 0);
                ctx.lineTo(i * scale, h);
                ctx.stroke();
            }
            
            const selected = Math.floor(p * intervals.length);
            intervals.forEach((iv, i) => {
                const isSelected = i < selected;
                const x = iv.start * scale;
                const width = (iv.end - iv.start) * scale;
                const y = 55 + i * 45;
                
                ctx.fillStyle = isSelected ? '#40c0e0' : 'rgba(64, 192, 224, 0.25)';
                ctx.fillRect(x, y, width, 28);
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.strokeRect(x, y, width, 28);
                
                ctx.fillStyle = '#0a0e18';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(iv.profit.toString(), x + width/2 - 6, y + 20);
                ctx.textAlign = 'left';
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('选择数量: ' + selected, 20, 35);
            ctx.fillText('总利润: ' + intervals.slice(0, selected).reduce((sum, iv) => sum + iv.profit, 0), 20, 55);
        }

        function drawPredicate(ctx, w, h, p) {
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('谓词逻辑量化', w/2, 35);
            ctx.textAlign = 'left';
            
            const quantifiers = [
                { symbol: '∀', name: '全称量词', desc: '对所有x' },
                { symbol: '∃', name: '存在量词', desc: '存在x' },
                { symbol: '∃!', name: '唯一量词', desc: '存在唯一x' }
            ];
            
            const idx = Math.floor(p * quantifiers.length);
            const q = quantifiers[idx];
            
            ctx.fillStyle = '#80e0c0';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(q.symbol, w/2, h/2);
            ctx.font = 'bold 20px Arial';
            ctx.fillText(q.name, w/2, h/2 + 45);
            ctx.font = '16px Arial';
            ctx.fillText(q.desc, w/2, h/2 + 75);
            ctx.textAlign = 'left';
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('示例: ' + q.symbol + 'x P(x)', 20, h - 35);
        }

        function drawGraphTheory(ctx, w, h, p) {
            const nodes = [
                {x: w/2, y: 60},
                {x: w/4, y: h/2},
                {x: 3*w/4, y: h/2},
                {x: w/3, y: h - 60},
                {x: 2*w/3, y: h - 60}
            ];
            
            nodes.forEach(n => {
                ctx.fillStyle = '#40c0e0';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            
            const edges = [[0,1],[0,2],[1,3],[2,4],[3,4],[1,2]];
            ctx.strokeStyle = 'rgba(64, 192, 224, 0.5)';
            ctx.lineWidth = 2;
            edges.forEach(e => {
                ctx.beginPath();
                ctx.moveTo(nodes[e[0]].x, nodes[e[0]].y);
                ctx.lineTo(nodes[e[1]].x, nodes[e[1]].y);
                ctx.stroke();
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('顶点数: ' + nodes.length, 20, 35);
            ctx.fillText('边数: ' + edges.length, 20, 55);
            ctx.fillText('握手定理: Σdeg(v) = ' + (edges.length * 2), 20, 75);
        }

        function drawBinary(ctx, w, h, p) {
            const num = Math.floor(p * 255);
            const binary = num.toString(2).padStart(8, '0');
            const hex = num.toString(16).toUpperCase().padStart(2, '0');
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('十进制: ' + num, 20, 35);
            ctx.fillText('十六进制: 0x' + hex, 20, 55);
            
            ctx.font = 'bold 18px Arial';
            ctx.fillStyle = '#80e0c0';
            ctx.textAlign = 'center';
            ctx.fillText('二进制: ' + binary, w/2, h/2);
            ctx.textAlign = 'left';
            
            const bitWidth = 35;
            const startX = (w - bitWidth * 8) / 2;
            for (let i = 0; i < 8; i++) {
                const x = startX + i * bitWidth;
                ctx.strokeStyle = binary[i] === '1' ? '#80e0c0' : '#6080a0';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, h/2 + 40, bitWidth - 5, 30);
                ctx.fillStyle = binary[i] === '1' ? '#80e0c0' : '#6080a0';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(binary[i], x + bitWidth/2 - 3, h/2 + 62);
            }
            ctx.textAlign = 'left';
        }

        function drawFloatingPoint(ctx, w, h, p) {
            const sign = Math.floor(p * 2);
            const exponent = 127 + Math.floor((p - 0.5) * 30);
            const mantissa = 0.5 + p * 0.3;
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('IEEE 754 单精度浮点数', 20, 35);
            
            const parts = [
                {label: '符号位', bits: 1, value: sign, color: '#e060a0'},
                {label: '指数位', bits: 8, value: exponent, color: '#a080e0'},
                {label: '尾数位', bits: 23, value: mantissa.toFixed(4), color: '#60c0a0'}
            ];
            
            let x = 30;
            parts.forEach((part, i) => {
                const width = i === 0 ? 40 : (i === 1 ? 180 : 320);
                ctx.fillStyle = part.color;
                ctx.fillRect(x, h/2 - 30, width, 60);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, h/2 - 30, width, 60);
                
                ctx.fillStyle = '#0a0e18';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(part.label, x + width/2, h/2 - 5);
                ctx.fillText(part.value.toString(), x + width/2, h/2 + 15);
                ctx.fillText(part.bits + '位', x + width/2, h/2 + 35);
                x += width + 10;
                ctx.textAlign = 'left';
            });
            
            const value = (sign === 0 ? 1 : -1) * (1 + mantissa) * Math.pow(2, exponent - 127);
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('值: ' + value.toExponential(4), 20, h - 35);
        }

        function drawCNN(ctx, w, h, p) {
            const layers = [
                {name: '输入层', channels: 3, color: '#60c0a0'},
                {name: '卷积层', channels: 16 + Math.floor(p * 16), color: '#60c0f0'},
                {name: '池化层', channels: 16 + Math.floor(p * 16), color: '#a080e0'},
                {name: '全连接层', channels: 10, color: '#e060a0'}
            ];
            
            const layerWidth = w / (layers.length + 1);
            layers.forEach((layer, i) => {
                const x = layerWidth * (i + 1) - 50;
                const height = 30 + layer.channels * 4;
                const y = h/2 - height/2;
                
                ctx.fillStyle = layer.color;
                ctx.fillRect(x, y, 100, height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, 100, height);
                
                ctx.fillStyle = '#0a0e18';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(layer.name, x + 50, y + 20);
                ctx.fillText(layer.channels + '通道', x + 50, y + height - 10);
                ctx.textAlign = 'left';
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('卷积核大小: 3x3', 20, 35);
            ctx.fillText('激活函数: ReLU', 20, 55);
        }

        function drawDeepLearning(ctx, w, h, p) {
            const layerCounts = [3, 8 + Math.floor(p * 12), 6 + Math.floor(p * 8), 4 + Math.floor(p * 6), 2];
            const layerX = [];
            for (let i = 0; i < layerCounts.length; i++) {
                layerX.push((w / (layerCounts.length + 1)) * (i + 1));
            }
            
            for (let i = 0; i < layerCounts.length - 1; i++) {
                for (let j = 0; j < layerCounts[i]; j++) {
                    const y1 = (h / (layerCounts[i] + 1)) * (j + 1);
                    for (let k = 0; k < layerCounts[i+1]; k++) {
                        const y2 = (h / (layerCounts[i+1] + 1)) * (k + 1);
                        ctx.strokeStyle = `rgba(64, 192, 224, ${0.15 + p * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(layerX[i], y1);
                        ctx.lineTo(layerX[i+1], y2);
                        ctx.stroke();
                    }
                }
            }
            
            layerCounts.forEach((count, i) => {
                for (let j = 0; j < count; j++) {
                    const y = (h / (count + 1)) * (j + 1);
                    ctx.fillStyle = `rgba(64, 192, 224, ${0.4 + p * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(layerX[i], y, 8 + p * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('层数: ' + layerCounts.length, 20, 35);
            ctx.fillText('总节点: ' + layerCounts.reduce((a,b) => a+b, 0), 20, 55);
        }

        function drawRandomForest(ctx, w, h, p) {
            const treeCount = 3 + Math.floor(p * 7);
            
            for (let i = 0; i < treeCount; i++) {
                const x = (w / (treeCount + 1)) * (i + 1);
                drawMiniTree(ctx, x, h/2, 2, Math.PI / 4);
            }
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('决策树数量: ' + treeCount, 20, 35);
            ctx.fillText('集成学习: Bagging', 20, 55);
        }
        
        function drawMiniTree(ctx, cx, cy, depth, angle) {
            if (depth <= 0) return;
            
            ctx.fillStyle = '#40c0e0';
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, Math.PI * 2);
            ctx.fill();
            
            const childY = cy + 35;
            const childGap = 25 * (depth + 1);
            
            ctx.strokeStyle = 'rgba(64, 192, 224, 0.6)';
            ctx.beginPath();
            ctx.moveTo(cx, cy + 10);
            ctx.lineTo(cx - childGap, childY - 8);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx, cy + 10);
            ctx.lineTo(cx + childGap, childY - 8);
            ctx.stroke();
            
            drawMiniTree(ctx, cx - childGap, childY, depth - 1, angle);
            drawMiniTree(ctx, cx + childGap, childY, depth - 1, angle);
        }

        function drawDefault(ctx, w, h, p) {
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('交互式演示区域', w/2, h/2 - 20);
            ctx.font = '16px Arial';
            ctx.fillText('调整滑块查看动态效果', w/2, h/2 + 20);
            ctx.textAlign = 'left';
        }

        document.getElementById('topicModal').addEventListener('click', (e) => {
            if (e.target.id === 'topicModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderKnowledgeGraph();
    </script>
</body>
