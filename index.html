<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e18 0%, #111a28 50%, #0d1321 100%);
            color: #e0f0ff;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        header { 
            text-align: center; 
            padding: 60px 20px 30px;
            position: relative;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #40c0e0, transparent);
        }
        header h1 {
            font-size: 56px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #40c0e0, #80e0c0, #a080e0, #40c0e0);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
            text-shadow: 0 0 60px rgba(64, 192, 224, 0.3);
            letter-spacing: 4px;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }
        header p { 
            color: #80b0d0; 
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .knowledge-graph {
            background: rgba(30, 40, 60, 0.7);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(80, 120, 180, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .graph-title { 
            font-size: 24px; 
            color: #a0c0e0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .legend { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
            font-size: 14px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }
        .legend-item { 
            display: flex; 
            align-items: center; 
            gap: 10px;
            padding: 6px 12px;
            background: rgba(60, 100, 160, 0.2);
            border-radius: 20px;
            transition: all 0.3s;
        }
        .legend-item:hover {
            background: rgba(60, 100, 160, 0.4);
            transform: translateY(-2px);
        }
        .legend-dot { 
            width: 16px; 
            height: 16px; 
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        .legend-dot.level-1 { background: #60c0a0; color: #60c0a0; }
        .legend-dot.level-2 { background: #60c0f0; color: #60c0f0; }
        .legend-dot.level-3 { background: #a080e0; color: #a080e0; }
        .legend-dot.level-4 { background: #e08060; color: #e08060; }
        .legend-dot.level-5 { background: #e060a0; color: #e060a0; }

        .graph-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 18px;
            justify-items: center;
        }
        .graph-node {
            padding: 16px 24px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            text-align: center;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .graph-node::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .graph-node:hover::before {
            left: 100%;
        }
        .graph-node:hover { 
            transform: translateY(-8px) scale(1.05); 
            z-index: 10;
            box-shadow: 0 20px 40px rgba(64, 192, 224, 0.3);
        }
        .graph-node.level-1 { 
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.25), rgba(96, 192, 160, 0.1)); 
            color: #60c0a0; 
            border-color: rgba(96, 192, 160, 0.6);
        }
        .graph-node.level-2 { 
            background: linear-gradient(135deg, rgba(96, 192, 240, 0.25), rgba(96, 192, 240, 0.1)); 
            color: #60c0f0; 
            border-color: rgba(96, 192, 240, 0.6);
        }
        .graph-node.level-3 { 
            background: linear-gradient(135deg, rgba(160, 128, 224, 0.25), rgba(160, 128, 224, 0.1)); 
            color: #a080e0; 
            border-color: rgba(160, 128, 224, 0.6);
        }
        .graph-node.level-4 { 
            background: linear-gradient(135deg, rgba(224, 128, 96, 0.25), rgba(224, 128, 96, 0.1)); 
            color: #e08060; 
            border-color: rgba(224, 128, 96, 0.6);
        }
        .graph-node.level-5 { 
            background: linear-gradient(135deg, rgba(224, 96, 160, 0.25), rgba(224, 96, 160, 0.1)); 
            color: #e060a0; 
            border-color: rgba(224, 96, 160, 0.6);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 24, 0.98);
            display: none;
            flex-direction: column;
            z-index: 1000;
            padding: 30px;
            backdrop-filter: blur(20px);
            overflow-y: auto;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding-bottom: 30px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(80, 120, 180, 0.3);
        }
        .modal-header h3 { 
            font-size: 32px; 
            color: #f0f8ff;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .close-btn {
            font-size: 40px;
            cursor: pointer;
            color: #80a0c0;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .close-btn:hover { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

            border: 1px solid rgba(80, 120, 180, 0.25);

            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .card-content {

            line-height: 1.8;
            font-size: 16px;
        }
        .card-content p {
            margin-bottom: 12px;
            text-align: justify;
        }
        .card-content p:last-child {
            margin-bottom: 0;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .control-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(64, 192, 224, 0.2);
        }
        .control-label {

            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #a0c0e0;
        }
        .control-value {

            color: #0a0e18;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 15px;
            min-width: 60px;
            text-align: center;
        }
        .control-slider {
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, rgba(60, 100, 160, 0.6), rgba(64, 192, 224, 0.3));
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;

            height: 24px;
            background: linear-gradient(135deg, #40c0e0, #80e0c0);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(64, 192, 224, 0.5);
            transition: all 0.3s;
        }
        .control-slider::-webkit-slider-thumb:hover {

            box-shadow: 0 5px 18px rgba(64, 192, 224, 0.7);
        }
        .btn-group {

            gap: 10px;

        }
        .btn {

            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;

        .btn-primary {

        }
        .btn-primary:hover {

        .btn-secondary {

        }
        .btn-secondary:hover {

        .try-title {

            color: #50d0f0;

        .try-list {

        }
        .try-item {

            color: #a0c0e0;
            font-size: 14px;
            padding-left: 20px;
            position: relative;
        }
        .try-item::before {

        }

        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .metric-card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(64, 192, 224, 0.15);
        }
        .metric-label {
            font-size: 12px;
            color: #80a0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 22px;
            font-weight: bold;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #40c0e0;
        }
        .metric-value.highlight {
            color: #80e0c0;
        }
        .metric-value.warning {
            color: #e08060;
        }

        .canvas-container {

            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(64, 192, 224, 0.2);

        .chart-canvas {

        .chart-title {

            font-weight: 500;
        }
        .chart-legend {

        }
        .legend-item {

            color: #a0c0e0;
        }
        .legend-color {

        }

        .related-topics {

            gap: 12px;
            margin-top: 18px;
        }
        .related-tag {

            color: #b090f0;

        .related-tag:hover {

        }

        .formula-box {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(20, 30, 50, 0.4));

            border-radius: 14px;
            border-left: 5px solid #40c0e0;
            font-family: 'Consolas', 'Monaco', 'Microsoft YaHei', monospace;
            font-size: 17px;
            color: #c0e0f0;
            white-space: pre-wrap;
            line-height: 2;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(64, 192, 224, 0.2);
            transition: all 0.3s;
        }
        .stat-card:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(64, 192, 224, 0.4);
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 13px;
            color: #80a0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scenario-tag {
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.2), rgba(96, 192, 160, 0.1));
            border-radius: 18px;
            font-size: 14px;
            color: #70d0b0;
            border: 1px solid rgba(96, 192, 160, 0.3);
            transition: all 0.3s;
        }
        .scenario-tag:hover {
            background: linear-gradient(135deg, rgba(96, 192, 160, 0.3), rgba(96, 192, 160, 0.15));
            transform: translateY(-2px);
        }

        .intuition-box {
            background: linear-gradient(135deg, rgba(60, 140, 200, 0.2), rgba(60, 140, 200, 0.1));
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            border-left: 4px solid #40c0e0;
        }
        .intuition-box strong {
            color: #50d0f0;
            font-weight: 600;
        }

        footer {

            padding: 50px 20px;
            color: #6080a0;
            font-size: 15px;
            border-top: 1px solid rgba(80, 120, 180, 0.2);
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 36px; letter-spacing: 2px; }
            header p { font-size: 16px; }
            .graph-container { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
            .graph-node { padding: 12px 16px; font-size: 13px; }
            .modal-header h3 { font-size: 24px; }
            .stats-grid { grid-template-columns: 1fr; }
            .controls-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>

        function closeModal() {
            document.getElementById('topicModal').style.display = 'none';
            currentTopic = null;
        }

        function updateParam(input) {
            const key = input.dataset.key;
            const value = parseFloat(input.value);
            vizParams[key] = value;
            document.getElementById(`value-${key}`).textContent = value;
            drawVisualization();
        }

        function resetViz() {
            if (!currentTopic) return;
            const detail = topicDetails[currentTopic];
            if (!detail.vizControls) return;
            
            detail.vizControls.forEach(ctrl => {
                vizParams[ctrl.key] = ctrl.default;
                const input = document.querySelector(`[data-key="${ctrl.key}"]`);
                if (input) {
                    input.value = ctrl.default;
                    document.getElementById(`value-${ctrl.key}`).textContent = ctrl.default;
                }
            });
            drawVisualization();
        }

        function animateViz() {
            if (!currentTopic) return;
            const detail = topicDetails[currentTopic];
            if (!detail.vizControls || detail.vizControls.length === 0) return;
            
            const ctrl = detail.vizControls[0];
            let current = ctrl.min;
            const interval = setInterval(() => {
                if (current > ctrl.max) current = ctrl.min;
                vizParams[ctrl.key] = current;
                const input = document.querySelector(`[data-key="${ctrl.key}"]`);
                if (input) {
                    input.value = current;
                    document.getElementById(`value-${ctrl.key}`).textContent = current.toFixed(2);
                }
                drawVisualization();
                current += ctrl.step * 2;
            }, 100);
            
            setTimeout(() => clearInterval(interval), 3000);
        }

        function drawVisualization() {
            const canvas = document.getElementById('vizCanvas');
            if (!canvas || !currentTopic) return;
            
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 350;
            
            const detail = topicDetails[currentTopic];
            if (!detail) return;
            
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            switch(detail.vizType) {
                case 'regression': drawRegression(ctx, canvas.width, canvas.height); break;
                case 'sigmoid': drawSigmoid(ctx, canvas.width, canvas.height); break;
                case 'knn': drawKNN(ctx, canvas.width, canvas.height); break;
                case 'neural-network': drawNeuralNetwork(ctx, canvas.width, canvas.height); break;
                case 'svm': drawSVM(ctx, canvas.width, canvas.height); break;
                case 'stack-queue': drawStackQueue(ctx, canvas.width, canvas.height); break;
                case 'linked-list': drawLinkedList(ctx, canvas.width, canvas.height); break;
                case 'tree': drawTree(ctx, canvas.width, canvas.height); break;
                case 'sorting': drawSorting(ctx, canvas.width, canvas.height); break;
                case 'search': drawSearch(ctx, canvas.width, canvas.height); break;
                case 'graph': drawGraph(ctx, canvas.width, canvas.height); break;
                case 'set': drawSet(ctx, canvas.width, canvas.height); break;
                case 'propositional': drawPropositional(ctx, canvas.width, canvas.height); break;
                case 'predicate': drawPredicate(ctx, canvas.width, canvas.height); break;
                case 'graph-theory': drawGraphTheory(ctx, canvas.width, canvas.height); break;
                case 'binary': drawBinary(ctx, canvas.width, canvas.height); break;
                case 'floating-point': drawFloatingPoint(ctx, canvas.width, canvas.height); break;
                case 'dp': drawDP(ctx, canvas.width, canvas.height); break;
                case 'greedy': drawGreedy(ctx, canvas.width, canvas.height); break;
                case 'complexity': drawComplexity(ctx, canvas.width, canvas.height); break;
                case 'cnn': drawCNN(ctx, canvas.width, canvas.height); break;
                case 'deep-learning': drawDeepLearning(ctx, canvas.width, canvas.height); break;
                case 'random-forest': drawRandomForest(ctx, canvas.width, canvas.height); break;
                case 'decision-tree': drawDecisionTree(ctx, canvas.width, canvas.height); break;
                default: drawDefault(ctx, canvas.width, canvas.height);
            }
        }

        function drawRegression(ctx, w, h) {
            const slope = vizParams.slope || 1;
            const intercept = vizParams.intercept || 0;
            const noise = vizParams.noise || 0.5;
            const samples = vizParams.samples || 30;
            
            const points = [];
            for (let i = 0; i < samples; i++) {
                const x = (i / (samples - 1)) * (w - 100) + 50;
                const y_true = h/2 - (x - w/2) * slope * 2 + intercept * 20;
                const y_noise = (Math.random() - 0.5) * noise * 80;
                points.push({ x, y: y_true + y_noise, cls: Math.random() > 0.5 ? 0 : 1 });
            }
            
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(50, h/2 - (50 - w/2) * slope * 2 + intercept * 20);
            ctx.lineTo(w-50, h/2 - (w-50 - w/2) * slope * 2 + intercept * 20);
            ctx.stroke();
            
            points.forEach(p => {
                ctx.fillStyle = p.cls === 0 ? '#60c0a0' : '#e060a0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });
            
            updateMetrics({1: slope.toFixed(2), 2: intercept.toFixed(2), 3: '拟合'});
        }

        function drawSigmoid(ctx, w, h) {
            const weight = vizParams.weight || 1;
            const bias = vizParams.bias || 0;
            
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let x = 0; x < w; x++) {
                const z = (x - w/2) / (w/6) * weight + bias;
                const y = h - h / (1 + Math.exp(-z));
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            ctx.strokeStyle = 'rgba(100,140,180,0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5,5]);
            ctx.beginPath();
            ctx.moveTo(w/2, 0);
            ctx.lineTo(w/2, h);
            ctx.moveTo(0, h/2);
            ctx.lineTo(w, h/2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            updateMetrics({1: '0.50', 2: weight.toFixed(2), 3: '分类'});
        }

        function drawKNN(ctx, w, h) {
            const k = Math.floor(vizParams.k) || 5;
            const n = vizParams.samples || 30;
            
            const points = [];
            for (let i = 0; i < n; i++) {
                points.push({
                    x: Math.random() * (w-100) + 50,
                    y: Math.random() * (h-100) + 50,
                    cls: Math.floor(Math.random() * 2)
                });
            }
            
            const targetX = w/2;
            const targetY = h/2;
            
            const distances = points.map(p => ({
                ...p,
                dist: Math.sqrt((p.x - targetX)**2 + (p.y - targetY)**2)
            })).sort((a,b) => a.dist - b.dist);
            
            points.forEach(p => {
                ctx.fillStyle = p.cls === 0 ? '#60c0a0' : '#e060a0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();
            });
            
            distances.slice(0, k).forEach(p => {
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            });
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(targetX, targetY, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            updateMetrics({1: k, 2: distances[0]?.dist.toFixed(1) || '-', 3: '搜索'});
        }

        function drawNeuralNetwork(ctx, w, h) {
            const layers = [4, 6 + Math.floor(vizParams.hiddenNodes/4), 4, 2];
            const layerX = [w*0.15, w*0.38, w*0.62, w*0.85];
            
            for (let i = 0; i < layers.length - 1; i++) {
                for (let j = 0; j < layers[i]; j++) {
                    const y1 = (h / (layers[i] + 1)) * (j + 1);
                    for (let k = 0; k < layers[i+1]; k++) {
                        const y2 = (h / (layers[i+1] + 1)) * (k + 1);
                        ctx.strokeStyle = `rgba(64, 192, 224, ${0.15 + Math.random()*0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(layerX[i], y1);
                        ctx.lineTo(layerX[i+1], y2);
                        ctx.stroke();
                    }
                }
            }
            
            const colors = ['#60c0a0', '#60c0f0', '#a080e0', '#e08060'];
            layers.forEach((n, i) => {
                for (let j = 0; j < n; j++) {
                    const y = (h / (n + 1)) * (j + 1);
                    ctx.fillStyle = colors[i] || '#40c0e0';
                    ctx.beginPath();
                    ctx.arc(layerX[i], y, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            updateMetrics({1: layers.join('�?), 2: layers.reduce((a,b)=>a+b,0), 3: '训练'});
        }

        function drawSVM(ctx, w, h) {
            const c = vizParams.c || 1;
            
            const points1 = [];
            const points2 = [];
            for (let i = 0; i < 15; i++) {
                points1.push({ x: w*0.15 + Math.random()*w*0.2, y: 50 + Math.random()*(h-100), cls:0 });
                points2.push({ x: w*0.65 + Math.random()*w*0.2, y: 50 + Math.random()*(h-100), cls:1 });
            }
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(w/2, 30);
            ctx.lineTo(w/2, h-30);
            ctx.stroke();
            
            const margin = 30 + c*10;
            ctx.strokeStyle = '#40c0e0';
            ctx.lineWidth = 2;
            ctx.setLineDash([5,5]);
            ctx.beginPath();
            ctx.moveTo(w/2 - margin, 30);
            ctx.lineTo(w/2 - margin, h-30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(w/2 + margin, 30);
            ctx.lineTo(w/2 + margin, h-30);
            ctx.stroke();
            ctx.setLineDash([]);
            
            points1.forEach(p => {
                ctx.fillStyle = '#60c0a0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });
            points2.forEach(p => {
                ctx.fillStyle = '#e060a0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });
            
            updateMetrics({1: c.toFixed(1), 2: '线性核', 3: '分类'});
        }

        function drawStackQueue(ctx, w, h) {
            const stackSize = vizParams.stackSize || 5;
            const queueSize = vizParams.queueSize || 5;
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('�?(LIFO)', w*0.25, 30);
            ctx.fillText('队列 (FIFO)', w*0.75, 30);
            
            const stackX = w*0.25 - 40;
            const stackY = h-60;
            for (let i = 0; i < stackSize; i++) {
                const y = stackY - i * 35;
                ctx.strokeStyle = '#60c0a0';
                ctx.lineWidth = 2;
                ctx.strokeRect(stackX, y, 80, 30);
                ctx.fillStyle = '#60c0a0';
                ctx.font = '14px Arial';
                ctx.fillText(String.fromCharCode(65 + i), stackX + 40, y + 20);
            }
            
            const queueX = w*0.75 - queueSize*25;
            for (let i = 0; i < queueSize; i++) {
                ctx.strokeStyle = '#a080e0';
                ctx.strokeRect(queueX + i*50, stackY, 48, 60);
                ctx.fillStyle = '#a080e0';
                ctx.font = '14px Arial';
                ctx.fillText(String(i+1), queueX + i*50 + 24, stackY + 38);
            }
            
            ctx.textAlign = 'left';
            updateMetrics({1: stackSize, 2: queueSize, 3: '演示'});
        }

        function drawLinkedList(ctx, w, h) {
            const nodes = Math.min(10, Math.max(3, vizParams.nodes || 5));
            const gap = Math.min(80, (w - 100) / nodes);
            const radius = 25;
            
            for (let i = 0; i < nodes; i++) {
                const x = 60 + i * gap;
                const y = h/2;
                
                if (i < nodes - 1) {
                    ctx.strokeStyle = '#40c0e0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + radius + 10, y);
                    ctx.lineTo(x + gap - radius - 10, y);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(x + gap - radius - 15, y - 6);
                    ctx.lineTo(x + gap - radius - 10, y);
                    ctx.lineTo(x + gap - radius - 15, y + 6);
                    ctx.stroke();
                }
                
                ctx.fillStyle = 'rgba(64, 192, 224, 0.3)';
                ctx.fillRect(x, y - radius, radius*2, radius*2);
                ctx.strokeStyle = '#40c0e0';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y - radius, radius*2, radius*2);
                
                ctx.fillStyle = '#60c0a0';
                ctx.fillRect(x, y - radius, radius, radius*2);
                ctx.strokeStyle = '#60c0a0';
                ctx.strokeRect(x, y - radius, radius, radius*2);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(String(i+1), x + radius/2, y + 6);
            }
            
            ctx.textAlign = 'left';
            updateMetrics({1: nodes, 2: '单链�?, 3: '展示'});
        }

        function drawTree(ctx, w, h) {
            const depth = Math.min(5, Math.max(2, vizParams.depth || 3));
            
            function drawNode(x, y, d) {
                if (d >= depth) return;
                
                ctx.fillStyle = '#40c0e0';
                ctx.beginPath();
                ctx.arc(x, y, 18 - d*2, 0, Math.PI * 2);
                ctx.fill();
                
                if (d < depth - 1) {
                    const childY = y + 60;
                    const gap = (w / Math.pow(2, d+2)) * 0.6;
                    
                    ctx.strokeStyle = 'rgba(64, 192, 224, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y + 18 - d*2);
                    ctx.lineTo(x - gap, childY - 18 + (d+1)*2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y + 18 - d*2);
                    ctx.lineTo(x + gap, childY - 18 + (d+1)*2);
                    ctx.stroke();
                    
                    drawNode(x - gap, childY, d + 1);
                    drawNode(x + gap, childY, d + 1);
                }
            }
            
            drawNode(w/2, 50, 0);
            updateMetrics({1: depth, 2: Math.pow(2, depth) - 1, 3: '二叉�?});
        }

        function drawSorting(ctx, w, h) {
            const size = Math.min(30, Math.max(5, vizParams.size || 15));
            const arr = Array.from({length: size}, () => Math.random());
            arr.sort((a,b) => a - b);
            
            const barWidth = (w - 60) / size;
            arr.forEach((val, i) => {
                const barHeight = val * (h - 80);
                const x = 30 + i * barWidth;
                const y = h - 40 - barHeight;
                
                ctx.fillStyle = `hsl(${i * 360/size}, 70%, 60%)`;
                ctx.fillRect(x + 2, y, barWidth - 4, barHeight);
            });
            
            updateMetrics({1: size, 2: '排序', 3: '可视�?});
        }

        function drawSearch(ctx, w, h) {
            const size = Math.min(30, Math.max(5, vizParams.size || 15));
            const target = vizParams.target || 50;
            
            const arr = Array.from({length: size}, (_, i) => Math.floor(Math.random() * 100));
            arr.sort((a,b) => a - b);
            const foundIdx = arr.findIndex(v => v >= target);
            
            const cellWidth = Math.min(40, (w - 80) / size);
            arr.forEach((val, i) => {
                const x = 40 + i * cellWidth;
                const y = h/2 - 20;
                
                ctx.fillStyle = i === foundIdx ? '#60c0a0' : 'rgba(64, 192, 224, 0.3)';
                ctx.fillRect(x, y, cellWidth - 4, 40);
                ctx.strokeStyle = i === foundIdx ? '#fff' : '#40c0e0';
                ctx.lineWidth = i === foundIdx ? 3 : 1;
                ctx.strokeRect(x, y, cellWidth - 4, 40);
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(String(val), x + (cellWidth - 4)/2, y + 25);
            });
            ctx.textAlign = 'left';
            
            updateMetrics({1: size, 2: target, 3: foundIdx >= 0 ? '找到' : '未找�?});
        }

        function drawGraph(ctx, w, h) {
            const nodes = Math.min(10, Math.max(4, vizParams.nodes || 6));
            const density = vizParams.density || 0.5;
            
            const pts = [];
            for (let i = 0; i < nodes; i++) {
                const angle = (i / nodes) * Math.PI * 2 - Math.PI/2;
                pts.push({
                    x: w/2 + Math.cos(angle) * Math.min(w, h)/3,
                    y: h/2 + Math.sin(angle) * Math.min(w, h)/3
                });
            }
            
            for (let i = 0; i < nodes; i++) {
                for (let j = i + 1; j < nodes; j++) {
                    if (Math.random() < density) {
                        ctx.strokeStyle = 'rgba(64, 192, 224, 0.4)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pts[j].x, pts[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            pts.forEach((p, i) => {
                ctx.fillStyle = '#40c0e0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0a0e18';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(String(i), p.x, p.y + 5);
            });
            ctx.textAlign = 'left';
            
            updateMetrics({1: nodes, 2: '图结�?, 3: '展示'});
        }

        function drawSet(ctx, w, h) {
            const cx1 = w*0.35;
            const cx2 = w*0.65;
            const cy = h/2;
            const r = 100;
            
            ctx.fillStyle = 'rgba(96, 192, 160, 0.3)';
            ctx.beginPath();
            ctx.arc(cx1, cy, r, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(160, 128, 224, 0.3)';
            ctx.beginPath();
            ctx.arc(cx2, cy, r, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#60c0a0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx1, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = '#a080e0';
            ctx.beginPath();
            ctx.arc(cx2, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('A', cx1 - r/2, cy - r/3);
            ctx.fillText('B', cx2 + r/2, cy - r/3);
            ctx.textAlign = 'left';
            
            updateMetrics({1: 'Venn�?, 2: '集合运算', 3: '演示'});
        }

        function drawPropositional(ctx, w, h) {
            const p = vizParams.p || 0.5;
            const q = vizParams.q || 0.5;
            const op = Math.floor(vizParams.op || 0);
            
            const ops = ['AND', 'OR', 'NOT P', 'XOR', '�?, '�?];
            const results = [
                (p > 0.5) && (q > 0.5),
                (p > 0.5) || (q > 0.5),
                !(p > 0.5),
                (p > 0.5) !== (q > 0.5),
                !(p > 0.5) || (q > 0.5),
                (p > 0.5) === (q > 0.5),
            ];
            
            ctx.fillStyle = p > 0.5 ? '#60c0a0' : 'rgba(96, 192, 160, 0.3)';
            ctx.fillRect(w*0.15, h*0.3, 100, 100);
            ctx.strokeStyle = '#60c0a0';
            ctx.strokeRect(w*0.15, h*0.3, 100, 100);
            
            ctx.fillStyle = q > 0.5 ? '#60c0f0' : 'rgba(96, 192, 240, 0.3)';
            ctx.fillRect(w*0.35, h*0.3, 100, 100);
            ctx.strokeStyle = '#60c0f0';
            ctx.strokeRect(w*0.35, h*0.3, 100, 100);
            
            ctx.fillStyle = results[op] ? '#80e0c0' : 'rgba(224, 96, 160, 0.3)';
            ctx.fillRect(w*0.6, h*0.3, 120, 100);
            ctx.strokeStyle = results[op] ? '#80e0c0' : '#e060a0';
            ctx.strokeRect(w*0.6, h*0.3, 120, 100);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('P', w*0.15 + 50, h*0.3 + 58);
            ctx.fillText('Q', w*0.35 + 50, h*0.3 + 58);
            ctx.fillText(ops[op], w*0.6 + 60, h*0.3 + 58);
            ctx.textAlign = 'left';
            
            updateMetrics({1: p > 0.5 ? 'T' : 'F', 2: q > 0.5 ? 'T' : 'F', 3: results[op] ? 'T' : 'F'});
        }

        function drawPredicate(ctx, w, h) {
            const domain = Math.min(10, Math.max(3, vizParams.domain || 5));
            const p_ratio = vizParams.p_ratio || 0.6;
            
            const pts = [];
            for (let i = 0; i < domain; i++) {
                pts.push({
                    x: 50 + Math.random() * (w - 100),
                    y: 80 + Math.random() * (h - 160),
                    hasP: Math.random() < p_ratio
                });
            }
            
            pts.forEach(p => {
                ctx.fillStyle = p.hasP ? '#60c0a0' : '#e060a0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            
            const allP = pts.every(p => p.hasP);
            const someP = pts.some(p => p.hasP);
            const quantifier = Math.floor(vizParams.quantifier || 0);
            
            updateMetrics({
                1: quantifier === 0 ? '∀' : quantifier === 1 ? '�? : '�?',
                2: pts.filter(p => p.hasP).length + '/' + domain,
                3: quantifier === 0 ? (allP ? '�? : '�?) : (someP ? '�? : '�?)
            });
        }

        function drawGraphTheory(ctx, w, h) {
            drawGraph(ctx, w, h);
        }

        function drawBinary(ctx, w, h) {
            const value = Math.floor(vizParams.value || 42);
            const bits = Math.floor(vizParams.bits || 8);
            
            let binary = value.toString(2).padStart(bits, '0');
            let hex = value.toString(16).toUpperCase().padStart(Math.ceil(bits/4), '0');
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Dec: ' + value, w/2, 60);
            ctx.fillText('Bin: ' + binary, w/2, 100);
            ctx.fillText('Hex: 0x' + hex, w/2, 140);
            
            const cellWidth = Math.min(35, (w - 80) / bits);
            for (let i = 0; i < bits; i++) {
                const x = 40 + i * cellWidth;
                const y = h/2;
                ctx.fillStyle = binary[i] === '1' ? '#60c0a0' : 'rgba(64, 192, 224, 0.3)';
                ctx.fillRect(x, y - 18, cellWidth - 4, 36);
                ctx.strokeStyle = '#40c0e0';
                ctx.strokeRect(x, y - 18, cellWidth - 4, 36);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText(binary[i], x + (cellWidth - 4)/2, y + 5);
            }
            ctx.textAlign = 'left';
            
            updateMetrics({1: value, 2: '0x'+hex, 3: bits+'�?});
        }

        function drawFloatingPoint(ctx, w, h) {
            const mantissa = vizParams.mantissa || 1.25;
            const exponent = Math.floor(vizParams.exponent || 2);
            const value = mantissa * Math.pow(2, exponent);
            
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${mantissa.toFixed(2)} × 2^${exponent} = ${value.toFixed(4)}`, w/2, 60);
            
            ctx.textAlign = 'left';
            updateMetrics({1: mantissa.toFixed(2), 2: exponent, 3: value.toFixed(4)});
        }

        function drawDP(ctx, w, h) {
            const size = Math.min(12, Math.max(3, vizParams.size || 6));
            const cellSize = Math.min(40, (w - 80) / size);
            
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    const x = 40 + j * cellSize;
                    const y = 60 + i * cellSize;
                    const dist = Math.abs(i - j);
                    const opacity = Math.max(0.2, 1 - dist/size);
                    
                    ctx.fillStyle = `rgba(64, 192, 224, ${opacity})`;
                    ctx.fillRect(x, y, cellSize - 4, cellSize - 4);
                    ctx.strokeStyle = '#40c0e0';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, cellSize - 4, cellSize - 4);
                }
            }
            
            ctx.strokeStyle = '#80e0c0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(40, 60);
            for (let i = 0; i < size; i++) {
                const x = 40 + i * cellSize + (cellSize - 4)/2;
                const y = 60 + i * cellSize + (cellSize - 4)/2;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            updateMetrics({1: size, 2: 'DP�?, 3: '填充'});
        }

        function drawGreedy(ctx, w, h) {
            const items = Math.min(10, Math.max(4, vizParams.items || 6));
            const capacity = Math.floor(vizParams.capacity || 10);
            
            const bars = [];
            let total = 0;
            for (let i = 0; i < items; i++) {
                const wgt = Math.ceil(Math.random() * 3);
                if (total + wgt <= capacity) {
                    bars.push({ w: wgt, taken: true });
                    total += wgt;
                } else {
                    bars.push({ w: wgt, taken: false });
                }
            }
            
            const barWidth = Math.min(50, (w - 80) / items);
            bars.forEach((b, i) => {
                const x = 40 + i * barWidth;
                const barH = b.w * 40;
                const y = h - 50 - barH;
                
                ctx.fillStyle = b.taken ? '#60c0a0' : 'rgba(224, 128, 96, 0.4)';
                ctx.fillRect(x + 4, y, barWidth - 8, barH);
                ctx.strokeStyle = b.taken ? '#80e0c0' : '#e08060';
                ctx.strokeRect(x + 4, y, barWidth - 8, barH);
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(String(b.w), x + barWidth/2, y - 8);
            });
            ctx.textAlign = 'left';
            
            updateMetrics({1: total, 2: capacity, 3: '贪心'});
        }

        function drawComplexity(ctx, w, h) {
            const n = vizParams.n || 30;
            const scale = vizParams.scale || 0.5;
            
            const funcs = [
                { name: 'O(1)', color: '#60c0a0', fn: () => 1 },
                { name: 'O(log n)', color: '#60c0f0', fn: x => Math.log2(x+1) },
                { name: 'O(n)', color: '#a080e0', fn: x => x },
                { name: 'O(n log n)', color: '#e08060', fn: x => x * Math.log2(x+1) },
                { name: 'O(n²)', color: '#e060a0', fn: x => x * x },
            ];
            
            ctx.strokeStyle = 'rgba(100,140,180,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (h/10) * i + 40);
                ctx.lineTo(w, (h/10) * i + 40);
                ctx.stroke();
            }
            
            const maxY = funcs[funcs.length-1].fn(n) * scale;
            funcs.forEach(f => {
                ctx.strokeStyle = f.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let x = 0; x <= n; x++) {
                    const px = 50 + (x / n) * (w - 100);
                    const py = h - 30 - (f.fn(x) * scale / maxY) * (h - 100);
                    if (x === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            });
            
            funcs.forEach((f, i) => {
                ctx.fillStyle = f.color;
                ctx.fillRect(w - 100, 50 + i * 25, 15, 15);
                ctx.fillStyle = '#c0d0e0';
                ctx.font = '12px Arial';
                ctx.fillText(f.name, w - 80, 62 + i * 25);
            });
            
            updateMetrics({1: n, 2: scale.toFixed(1), 3: '增长'});
        }

        function drawCNN(ctx, w, h) {
            const layers = 3 + Math.floor(vizParams.layers || 1);
            const colors = ['#60c0a0', '#60c0f0', '#a080e0', '#e08060'];
            const layerWidth = (w - 100) / (layers + 1);
            
            for (let i = 0; i < layers; i++) {
                const x = 60 + (i + 0.5) * layerWidth;
                const size = 40 - i * 5;
                const y = h/2 - size/2;
                
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(x - size/2, y, size, size);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - size/2, y, size, size);
                
                if (i < layers - 1) {
                    ctx.strokeStyle = 'rgba(64, 192, 224, 0.3)';
                    ctx.beginPath();
                    ctx.moveTo(x + size/2 + 10, h/2);
                    ctx.lineTo(x + layerWidth - size/2 - 10, h/2);
                    ctx.stroke();
                }
            }
            
            updateMetrics({1: layers, 2: 'CNN', 3: '卷积'});
        }

        function drawDeepLearning(ctx, w, h) {
            drawNeuralNetwork(ctx, w, h);
        }

        function drawRandomForest(ctx, w, h) {
            const trees = Math.min(8, Math.max(2, vizParams.trees || 4));
            const treeWidth = (w - 80) / trees;
            
            for (let t = 0; t < trees; t++) {
                const cx = 60 + (t + 0.5) * treeWidth;
                drawMiniTree(ctx, cx, h/2, 2, Math.PI/4);
            }
            
            updateMetrics({1: trees, 2: '森林', 3: '集成'});
        }

        function drawMiniTree(ctx, cx, cy, depth, angle) {
            if (depth <= 0) return;
            
            ctx.fillStyle = '#40c0e0';
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, Math.PI * 2);
            ctx.fill();
            
            const childY = cy + 35;
            const childGap = 25 * (depth + 1);
            
            ctx.strokeStyle = 'rgba(64, 192, 224, 0.6)';
            ctx.beginPath();
            ctx.moveTo(cx, cy + 10);
            ctx.lineTo(cx - childGap, childY - 8);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx, cy + 10);
            ctx.lineTo(cx + childGap, childY - 8);
            ctx.stroke();
            
            drawMiniTree(ctx, cx - childGap, childY, depth - 1, angle);
            drawMiniTree(ctx, cx + childGap, childY, depth - 1, angle);
        }

        function drawDecisionTree(ctx, w, h) {
            drawTree(ctx, w, h);
        }

        function drawDefault(ctx, w, h) {
            ctx.fillStyle = '#40c0e0';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('可视化演示区�?, w/2, h/2);
            ctx.font = '14px Arial';
            ctx.fillText('调整滑块查看动态效�?, w/2, h/2 + 30);
            ctx.textAlign = 'left';
        }

        function updateMetrics(m) {
            const m1 = document.getElementById('metric-1');
            const m2 = document.getElementById('metric-2');
            const m3 = document.getElementById('metric-3');
            if (m1) m1.textContent = m[1] || '-';
            if (m2) m2.textContent = m[2] || '-';
            if (m3) m3.textContent = m[3] || '运行�?;
        }

        document.getElementById('topicModal').addEventListener('click', (e) => {
            if (e.target.id === 'topicModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderKnowledgeGraph();
    </script>
</body>
</html>
